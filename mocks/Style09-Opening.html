.after{min-height:40vh;display:grid;place-items:center;color:var(--ln3);font-size:15px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.4,.1,.2,1) forwards}

@media (max-width:700px){

const fade=[...document.querySelectorAll('#canopy,#cols,#board,#led,#dim,.far,text.t,#wins,#doors,.doorwin,#band')];
const WX=792,WY=508,SYM=(x,y)=>({x:762+64*(x-250)/420,y:479.5+62.8*(y-200)/412});
const P_END=SYM(298,428), P_LOW=SYM(246,600);
let top=0,len=1,W=innerWidth,H=innerHeight,SW=W,SH=H,SY=0,cur=0,tgt=0;
function measure(){top=track.offsetTop;len=track.offsetHeight-innerHeight;W=innerWidth;H=innerHeight;const r=scene.getBoundingClientRect();SW=r.width;SH=r.height;SY=r.top-scene.parentNode.getBoundingClientRect().top;}
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,map=(p,a,b)=>cl((p-a)/(b-a));
function frame(t){
  tgt=cl((scrollY-top)/len); cur+= (tgt-cur)*(RM?1:.12);
  const p=cur, k=Math.max(SW/1440,SH/900), ox=(SW-1440*k)/2, oy=(SH-900*k)/2;
  const z=ease(map(p,.1,.72)), mobile=W<700;
  const S=1+(((mobile?Math.min(.5*SH,.86*SW):.72*SH)/(64*k))-1)*z;
  const fx=mobile?SW*.5:SW*.64, fy=mobile?SH*.42:SH*.5;
  const nx=ox+WX*k, ny=oy+WY*k, sx=nx+(fx-nx)*z, sy=ny+(fy-ny)*z;
  const tx=(sx-ox)/k-WX*S, ty=(sy-oy)/k-WY*S;
  cam.setAttribute('transform',`translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${S.toFixed(4)})`);
  const toScr=q=>({x:ox+(tx+q.x*S)*k,y:SY+oy+(ty+q.y*S)*k});
  const dIn=map(p,.18,.46); det.style.opacity=dIn; simple.style.opacity=1-dIn;
  const fo=(1-map(p,.2,.42)).toFixed(3); fade.forEach(e=>e.style.opacity=fo);
  detail.style.opacity=(map(p,.04,.12)*(1-map(p,.3,.42))).toFixed(3);
  const n=map(p,.78,.92); note.style.opacity=n; note.style.transform=`translateY(${(1-n)*14}px)`;
  const e=toScr(P_END), r=note.getBoundingClientRect();
  let d;
  if(mobile){const lo=toScr(P_LOW); d=`M${lo.x},${r.top-10} L${lo.x},${lo.y} L${e.x},${e.y}`;}
  else{const ay=r.top+20, mx=e.x-(e.y<ay?0:0)-60; d=`M${r.right+14},${ay} L${mx},${ay} L${e.x},${e.y}`;}
  lp.setAttribute('d',d);
  lp.style.opacity=n; lp.style.strokeDasharray=3000; lp.style.strokeDashoffset=3000*(1-n);
  ld.setAttribute('cx',e.x); ld.setAttribute('cy',e.y); ld.style.opacity=map(p,.88,.94);
  // ambient
  if(!RM){
    const ledx=-((t*.04)%560); ledt.setAttribute('transform',`translate(${ledx} 0)`);
    straps.forEach((s,i)=>s.style.transform=`rotate(${Math.sin(t/900+i*1.3)*6}deg)`);
  }
  requestAnimationFrame(frame);
}
addEventListener('resize',measure);measure();requestAnimationFrame(frame);
// draw-in on load
document.querySelectorAll('#rake .s, #canopy .s, #cols .s, .far path').forEach((el,i)=>{el.setAttribute('pathLength','1');el.classList.add('draw');el.style.animationDelay=(i*25)+'ms';el.addEventListener('animationend',()=>{el.classList.remove('draw');el.removeAttribute('pathLength')},{once:true})});
})();
</script>
</body></html>
