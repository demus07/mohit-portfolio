<!-- Direction 01: Editorial index — the eight projects set large in serif as the index of a printed folio, an engraved plate of the bay above; the hovered name shows its real media, AuctionXI open by default. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Editorial index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe8da; --paper-2:#e7dfcd; --ink:#1c2b36; --soft:#5b6a72; --sea:#2c6d8c; --sea-ink:#2c6d8c;
  --serif:"Newsreader",Georgia,serif; --sans:"Hanken Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:50;opacity:.22;mix-blend-mode:multiply}

/* ---------- engraved plate of the bay ---------- */
.plate{position:relative;height:min(33vh,330px);min-height:240px;overflow:hidden}
.plate svg{position:absolute;left:0;bottom:0;width:100%;height:100%;display:block}
.plate .layer{will-change:transform}
.plate::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to bottom,rgba(239,232,218,0),var(--paper))}

/* ---------- head ---------- */
.wrap{width:min(1440px,100%);margin:0 auto;padding:0 clamp(16px,5.5vw,96px)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,72px);margin-top:-6px;position:relative;z-index:2}
h2{font-family:var(--serif);font-weight:300;font-size:clamp(44px,4.9vw,76px);line-height:1.02;letter-spacing:-.018em;text-wrap:balance;max-width:11.5ch}
.lede{font-size:clamp(16px,1.2vw,19px);line-height:1.5;color:var(--soft);max-width:40ch;margin-top:20px}

/* ---------- index ---------- */
.index{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,72px);margin-top:clamp(36px,6vh,64px);padding-bottom:40vh}
.list{list-style:none;counter-reset:none}
.item{position:relative}
.item button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:18px;width:100%;padding:.06em 0 .1em}
.name{font-family:var(--serif);font-weight:300;font-size:clamp(46px,5.2vw,84px);line-height:1.02;white-space:nowrap;letter-spacing:-.02em;color:rgba(28,43,54,.26);transition:color .6s ease,transform .7s cubic-bezier(.2,.7,.2,1);display:inline-block;transform-origin:left center}
.kind{font-size:14px;color:var(--soft);opacity:0;transform:translateX(-8px);transition:opacity .5s ease,transform .6s ease;white-space:nowrap}
.item.on .name{color:var(--ink);font-style:italic;transform:translateX(14px)}
.item.on .kind{opacity:1;transform:none}
.item button:hover .name{color:rgba(28,43,54,.62)}
.item.on button:hover .name{color:var(--ink)}
.item button:focus-visible .name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:10px}
.mobile-media{display:none}

.panel{position:sticky;top:clamp(24px,8vh,80px);align-self:start}
.frame{position:relative;aspect-ratio:1506/940;overflow:hidden;border-radius:6px;background:#0d1520}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.035);transition:opacity .8s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.frame img.on{opacity:1;transform:none}
.sun{position:absolute;inset:-30% -10% auto auto;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(242,190,120,.32),rgba(242,190,120,0));pointer-events:none;mix-blend-mode:screen}
.detail{position:relative;margin-top:26px;min-height:300px}
.d{position:absolute;inset:0 auto auto 0;width:100%;opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.d.on{opacity:1;transform:none;pointer-events:auto;transition-delay:.08s}
.d .k{font-size:14px;color:var(--soft)}
.d h3{font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.2vw,34px);line-height:1.12;letter-spacing:-.01em;margin-top:6px;max-width:22ch;text-wrap:balance}
.d p{font-size:16px;line-height:1.55;max-width:42ch;margin-top:10px;color:#33434d}
.facts{list-style:none;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:620px}
.facts li{font-size:15px;line-height:1.45;color:#33434d;padding-left:16px;position:relative}
.facts li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:1px;background:var(--sea)}
.tech{font-size:14px;color:var(--soft);margin-top:14px}
.links{margin-top:16px;display:flex;gap:22px;font-size:15px;font-weight:500}
.links a{color:var(--sea);text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .45s ease;padding-bottom:2px}
.links a:hover{background-size:100% 1px}
.links span{color:var(--soft);font-weight:400}

/* ---------- foot: sea line ---------- */
.horizon{position:relative;height:30vh;overflow:hidden}
.horizon svg{position:absolute;inset:0;width:100%;height:100%}

@media (max-width:820px){
  .plate{height:30vh;min-height:220px}
  .head{grid-template-columns:1fr}
  .index{grid-template-columns:1fr;margin-top:24px}
  .panel{display:none}
  .name{font-size:clamp(40px,11vw,56px)}
  .item.on .name{transform:translateX(6px)}
  .kind{display:none}
  .mobile-media{display:block;max-height:0;overflow:hidden;transition:max-height .7s cubic-bezier(.2,.7,.2,1)}
  .item.on .mobile-media{max-height:900px}
  .mobile-media .frame{margin:14px 0 4px;opacity:1}
  .mobile-media .frame img{opacity:1;transform:none}
  .mobile-media .d{position:relative;opacity:1;transform:none;pointer-events:auto;padding-bottom:22px}
  .facts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<!-- direction: Work 01 · Editorial index -->
<svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>

<section class="plate" aria-hidden="true">
  <svg id="plate" viewBox="0 0 1440 380" preserveAspectRatio="xMidYMax slice"></svg>
</section>

<div class="wrap">
  <header class="head">
    <div>
      <h2>Things I've built and shipped</h2>
    </div>
    <div><p class="lede" style="margin-top:clamp(8px,1.6vw,28px)">Products I run, client work, web and mobile apps, AI, VR and command-line tools.</p></div>
  </header>

  <section class="index">
    <ul class="list" id="list"></ul>
    <aside class="panel">
      <div class="frame" id="frame"></div>
      <div class="detail" id="detail"></div>
    </aside>
  </section>
</div>

<section class="horizon" aria-hidden="true"><svg id="hz" viewBox="0 0 1440 270" preserveAspectRatio="xMidYMax slice"></svg></section>

<script>
const P=[
 {s:'auctionxi',n:'AuctionXI',k:'My own product, 2026',h:'Live player auctions for any sport',l:'Real-time bidding, broadcast graphics and YouTube overlays, with no production team.',a:[['Live','https://auction-xi.com']],
  f:['Every bid lands on every screen at once, and the money always adds up.','Twenty broadcast scenes for the projector and the stream.','Auction-ready in under 20 minutes.'],t:'Next.js, TypeScript, Postgres, Drizzle, Pusher, NextAuth'},
 {s:'texagent',n:'TexAgent',k:'Client work, 2026',h:'A bahi-khata for textile brokers',l:'Bills, brokerage and follow-ups in one place, instead of a paper book.',a:[],priv:1},
 {s:'cachekaro',n:'Cache Karo',k:'Command-line tool, 2026',h:'Find the cache hogs, get the space back',l:'Disk analysis and safe cleanup on macOS, Linux and Windows. One line to install.',a:[['PyPI','https://pypi.org/project/cachekaro/'],['Source','https://github.com/Mohit-Bagri/cachekaro']]},
 {s:'aether',n:'Aether',k:'AI web app, 2025',h:'News, YouTube and Reddit in one conversation',l:'An assistant with 17+ tones, and an NLP pipeline that scores every article first.',a:[['Source','https://github.com/Mohit-Bagri/aether-news-trends']]},
 {s:'flowledger',n:'FlowLedger',k:'Mobile app, 2026',h:'Every rupee in, every rupee out',l:'A local-first finance app in Flutter that scans receipts and catches money leaks.',a:[['Source','https://github.com/Mohit-Bagri/flowledger']]},
 {s:'shuttle',n:'Space Shuttle VR',k:'VR game, 2024',h:'Fix the shuttle, then fly it out',l:'A room-scale game for Meta Quest: hands-on tasks aboard, then pilot it to the final portal.',a:[['Source','https://github.com/Mohit-Bagri/spaceshuttletasks-vr-game']]},
 {s:'velotype',n:'VeloType',k:'Web app, 2026',h:'A typing test built for feel',l:'Themes, modes and live words per minute, with a caret that keeps up.',a:[['Live','https://velo-type.vercel.app']]},
 {s:'windmill',n:'Windmill VR',k:'VR app, 2025',h:'Breathe with the windmill',l:'A calm VR app for Meta Quest, paced to a four-part breath.',a:[['Source','https://github.com/Mohit-Bagri/windmill-vr']]}
];
const links=p=>`<div class="links">${p.a.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}${p.priv?'<span>Private client project</span>':''}</div>`;
const detail=p=>`<div class="k">${p.k}</div><h3>${p.h}</h3><p>${p.l}</p>${p.f?`<ul class="facts">${p.f.map(x=>`<li>${x}</li>`).join('')}</ul><div class="tech">${p.t}</div>`:''}${links(p)}`;

const list=document.getElementById('list'),frame=document.getElementById('frame'),det=document.getElementById('detail');
P.forEach((p,i)=>{
  list.insertAdjacentHTML('beforeend',`<li class="item" data-i="${i}"><button aria-controls="d${i}"><span class="name">${p.n}</span><span class="kind">${p.k}</span></button>
   <div class="mobile-media"><div class="frame"><img src="media/${p.s}.png" alt="${p.n}" loading="lazy"></div><div class="d">${detail(p)}</div></div></li>`);
  frame.insertAdjacentHTML('beforeend',`<img src="media/${p.s}.png" alt="${p.n}, ${p.h}">`);
  det.insertAdjacentHTML('beforeend',`<div class="d" id="d${i}">${detail(p)}</div>`);
});
frame.insertAdjacentHTML('beforeend','<div class="sun"></div>');
const items=[...list.children],imgs=[...frame.querySelectorAll('img')],ds=[...det.children];
let cur=-1,pinned=false;
function set(i){ if(i===cur)return; cur=i;
  items.forEach((el,j)=>el.classList.toggle('on',j===i));
  imgs.forEach((el,j)=>el.classList.toggle('on',j===i));
  ds.forEach((el,j)=>el.classList.toggle('on',j===i));
}
set(0);
const mq=matchMedia('(max-width:820px)');
items.forEach((el,i)=>{
  const b=el.querySelector('button');
  b.addEventListener('mouseenter',()=>{ if(!mq.matches) set(i)});
  b.addEventListener('focus',()=>set(i));
  b.addEventListener('click',()=>set(i));
});

/* ---------- engraved plate: the bay from Nariman Point to Malabar Hill ---------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const plate=document.getElementById('plate');
const ink='#2c6d8c';
el('defs',{},plate).innerHTML=`
 <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)"><line x1="0" y1="0" x2="0" y2="6" stroke="${ink}" stroke-width=".8" opacity=".55"/></pattern>
 <pattern id="hatch2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)"><line x1="0" y1="0" x2="0" y2="4" stroke="${ink}" stroke-width=".9" opacity=".7"/></pattern>
 <radialGradient id="sunwash" cx="78%" cy="58%" r="45%"><stop offset="0" stop-color="#f2c88a" stop-opacity=".55"/><stop offset="1" stop-color="#f2c88a" stop-opacity="0"/></radialGradient>`;
el('rect',{width:1440,height:380,fill:'url(#sunwash)'},plate);
// sky: engraved horizontal rules thinning toward the sun
const sky=el('g',{class:'layer',stroke:ink,'stroke-width':.6,fill:'none'},plate);
for(let y=18;y<230;y+=7){
  const op=(.08+ (y/230)*.18).toFixed(3);
  // a gap around the sun
  el('path',{d:`M0 ${y} H${1060-Math.max(0,90-Math.abs(y-190))*1.4} M${1060+Math.max(0,90-Math.abs(y-190))*1.4+60} ${y} H1440`,opacity:op},sky);
}
el('circle',{cx:1120,cy:190,r:38,fill:'none',stroke:ink,'stroke-width':.9,opacity:.55},sky);
// Malabar Hill, far right, with the necklace curving toward it
const hill=el('g',{class:'layer'},plate);
el('path',{d:'M930 262 C 1000 250 1040 214 1110 206 C 1180 198 1220 222 1290 214 C 1350 208 1400 226 1440 232 V 270 H 930 Z',fill:'url(#hatch)'},hill);
const hr=rnd(7);
for(let x=960;x<1440;x+=9){const h=8+hr()*30*(x>1080&&x<1330?1:.45);const base=258-(x>1060?Math.min(40,(x-1060)*.3):0)+(x>1330?(x-1330)*.15:0);
  el('rect',{x,y:base-h,width:6,height:h,fill:'url(#hatch2)'},hill)}
// sea: engraved swell lines
const sea=el('g',{class:'layer',stroke:ink,fill:'none'},plate);
for(let i=0;i<14;i++){const y=272+i*8+i*i*.35;let d=`M0 ${y}`;for(let x=0;x<=1440;x+=60)d+=` Q ${x+30} ${y-(i%2?1.4:2.2)} ${x+60} ${y}`;
  el('path',{d,'stroke-width':.55+i*.05,opacity:(.18+i*.025).toFixed(2),'stroke-dasharray':i<4?'40 18 90 22':'none'},sea)}
// the curve of Marine Drive: the parapet sweeping from left foreground to the far hill
const curve=el('g',{class:'layer'},plate);
el('path',{d:'M-20 372 C 260 330 620 300 900 280 C 1010 272 1080 266 1150 262',fill:'none',stroke:ink,'stroke-width':1.4,opacity:.85},curve);
el('path',{d:'M-20 380 C 260 340 620 310 900 287 C 1010 278 1080 271 1150 266',fill:'none',stroke:ink,'stroke-width':.7,opacity:.55},curve);
// tetrapods along the wall foot
for(let i=0;i<46;i++){const t=i/45, x=-10+t*1150, y=372-(372-262)*Math.pow(t,.62)+4, s=9*(1-t*.82);
  const g=el('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(s/9).toFixed(3)})`,stroke:ink,'stroke-width':1.1,fill:'none',opacity:.7},curve);
  el('path',{d:'M0 0 L-7 6 M0 0 L7 5 M0 0 L1 -8 M0 0 L-1 3'},g)}
// lamps of the necklace (unlit by day: just the posts)
for(let i=0;i<22;i++){const t=i/21, x=40+t*1080, y=360-(360-262)*Math.pow(t,.62), h=34*(1-t*.84);
  el('path',{d:`M${x.toFixed(1)} ${y.toFixed(1)} v${(-h).toFixed(1)} q 0 ${(-h*.12).toFixed(1)} ${(h*.18).toFixed(1)} ${(-h*.14).toFixed(1)}`,stroke:ink,'stroke-width':Math.max(.5,1.4*(1-t)),fill:'none',opacity:.75},curve)}
// Art Deco blocks along the curve, inland side (behind the road)
const deco=el('g',{class:'layer'},plate);
const r=rnd(42);
let x=-10;
while(x<1010){const t=Math.max(0,x)/1150, sc=1-Math.pow(t,.62)*.82, base=336-(336-246)*Math.pow(t,.62);
  const w=(70+r()*60)*sc, h=(120+r()*70)*sc, curved=r()>.45, tower=r()>.7;
  const g=el('g',{stroke:ink,fill:'none','stroke-width':Math.max(.5,1.1*sc)},deco);
  const R=curved?Math.min(w*.35,26*sc):0;
  el('path',{d:`M${x} ${base} V${base-h} H${x+w-R} ${R?`Q ${x+w} ${base-h} ${x+w} ${base-h+R}`:''} V${base}`,fill:['#f1e3c4','#f0d9cf','#efe6b8','#ece4d4'][Math.floor(r()*4)]},g);
  el('line',{x1:x+w*.5,y1:base-h+4*sc,x2:x+w*.5,y2:base,opacity:.35},g);
  // ribbon balconies
  const fl=Math.round(h/(17*sc));
  for(let k=1;k<fl;k++){const yy=base-k*(h/fl);el('line',{x1:x+3*sc,y1:yy,x2:x+w-(R&&yy<base-h+R?R*.4:0)-1,y2:yy,opacity:.75},g);
    if(k%1===0)el('rect',{x:x+6*sc,y:yy-(h/fl)*.62,width:w-14*sc,height:(h/fl)*.42,fill:'url(#hatch2)',stroke:'none',opacity:.35},g)}
  if(tower){const tw=w*.22,tx=x+w*.18;el('path',{d:`M${tx} ${base-h} V${base-h-22*sc} H${tx+tw} V${base-h} M${tx+tw*.2} ${base-h-22*sc} V${base-h-32*sc} H${tx+tw*.8} V${base-h-22*sc}`},g)}
  x+=w+(2+r()*5)*sc;
}
// road + promenade foreground lines
el('path',{d:'M-20 392 C 260 352 620 320 900 296 C 1010 286 1080 279 1150 274',fill:'none',stroke:ink,'stroke-width':.5,opacity:.5},plate);
// a few rain trees in the far right
// horizon at the foot of the page
const hz=document.getElementById('hz');
for(let i=0;i<9;i++){const y=60+i*20+i*i*1.6;let d=`M0 ${y}`;for(let xx=0;xx<=1440;xx+=80)d+=` Q ${xx+40} ${y-1.6} ${xx+80} ${y}`;
  el('path',{d,stroke:ink,fill:'none','stroke-width':.6,opacity:(.12+i*.04).toFixed(2)},hz)}
el('line',{x1:0,y1:52,x2:1440,y2:52,stroke:ink,'stroke-width':1,opacity:.6},hz);

/* ---------- scroll: plate parallax + index follows reading line on phones ---------- */
const layers=[...plate.querySelectorAll('.layer')];const depth=[.04,.1,.06,.16,.22];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let ticking=false;
function frameTick(){ticking=false;const y=scrollY;
  if(!reduce&&y<700)layers.forEach((L,i)=>L.style.transform=`translate3d(${(-y*depth[i]*.5).toFixed(1)}px,${(y*depth[i]).toFixed(1)}px,0)`);
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(frameTick)}},{passive:true});
</script>
</body>
</html>
