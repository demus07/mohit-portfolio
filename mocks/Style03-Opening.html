<script>
/* ---------- Style 03 shared kit: low-poly helpers + the Mohit figure ---------- */
const T = THREE;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const _mats = {};

// text drawn to a canvas texture (station boards, LED, marathi)
function textTex(lines, o = {}) {

// sky dome with a soft vertical gradient (stops: [[y01,color],...])
function skyDome(stops, r = 900) {
  const g = new T.SphereGeometry(r, 24, 16); const col = []; const p = g.attributes.position; const c = new T.Color();
  const cs = stops.map(s => [s[0], new T.Color(s[1])]);
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) / r + 1) / 2; let k = 0; while (k < cs.length - 2 && t > cs[k + 1][0]) k++;

function recolorSky(sky, stops) {

// faceted sea: a jittered grid whose vertices bob; returns {mesh, tick(t)}
function makeSea(w, d, sx, sz, color, amp = .25) {

// concrete tetrapod: four legs from a centre

  const dirs = [[0, 1, 0], [.943, -.333, 0], [-.471, -.333, .816], [-.471, -.333, -.816]];

  const g = new T.Group(); let y = 0, x = 0;
  for (let i = 0; i < 5; i++) { const s = mesh(new T.CylinderGeometry(.16 - i * .015, .2 - i * .015, h / 5, 5), mat(0x8a7560), x, y + h / 10, 0, g); s.rotation.z = -lean; y += h / 5 * Math.cos(lean); x += h / 5 * Math.sin(lean); }

    const f = new T.ConeGeometry(.35, 2.6, 3); f.translate(0, 1.3, 0); f.scale(1, 1, .25);
    const m = mesh(f, mat(i % 2 ? 0x5f8a5a : 0x6f9a63), x, y, 0, g); m.rotation.set(0, i / 7 * Math.PI * 2, 1.25 + (i % 3) * .12, 'YXZ');

}
function rainTree(s = 1, col = 0x6d8f5f) {

  [[0, 3.1, 0, 2.1], [1.3, 2.8, .3, 1.5], [-1.3, 2.9, -.2, 1.6], [.2, 3.0, 1.1, 1.3]].forEach(([x, y, z, r], i) => {

}
// marine drive lamp post (curved arm), returns {group, bulb, glow}

let _glow;
function glowTex() {

/* ---------- stage: renderer + sticky scroll progress + pause offscreen ---------- */
function makeStage(o) {

  R.setPixelRatio(Math.min(devicePixelRatio, o.dpr || 1.6));

  const scene = new T.Scene(), cam = new T.PerspectiveCamera(o.fov || 35, 1, .1, 2000);

/* bake a static group into one mesh per (untextured) material: far fewer draw calls */

function tetrapodGeo(s = 1) {

  const dirs = [[0, 1, 0], [.943, -.333, 0], [-.471, -.333, .816], [-.471, -.333, -.816]];

/* ---------------- THE CHARACTER: low-poly Mohit ---------------- */

let _shirtTex;
function shirtTex() {

    const roof = new T.CylinderGeometry(2.4, 2.4, L, 8, 1, false, -.82, 1.64); roof.rotateX(-Math.PI / 2); roof.rotateY(Math.PI / 2);
    const rm = mesh(roof, mat(C.roof), L / 2, TOP - 2.4 * Math.cos(.82) + .01, 0, g); rm.castShadow = true;
    [4.5, 11, 17.5].forEach(x => { const a = mesh(new T.BoxGeometry(3.4, .42, 2.2), mat(0xd3d0ca), x, 4.65, 0, g); a.castShadow = true; mesh(new T.BoxGeometry(3.0, .05, 1.8), mat(0x9a9892), x, 4.88, 0, g); });
    if (o.panto) {
      mesh(new T.BoxGeometry(1.2, .2, 1.4), mat(0x4a4f57), o.panto, 4.6, 0, g);
      const pm = mat(0x3d434b);
      [[-1, 1], [1, 1]].forEach(([a]) => { const l = mesh(new T.BoxGeometry(.05, 1.6, .05), pm, o.panto + a * .35, 5.35, 0, g); l.rotation.z = a * .55; });
      const l2 = mesh(new T.BoxGeometry(.05, 1.25, .05), pm, o.panto, 6.25, 0, g); l2.rotation.z = .5;
      mesh(new T.BoxGeometry(.08, .06, 1.6), pm, o.panto + .3, 6.5, 0, g);

    // underframe
    mesh(new T.BoxGeometry(L - 3, .55, 2.4), mat(0x2a2f38), L / 2, .5, 0, g);
    [3.2, L - 3.2].forEach(x => mesh(new T.BoxGeometry(2.6, .5, 2.9), mat(0x24282f), x, .45, 0, g));
    mesh(new T.BoxGeometry(L, .1, W), mat(0x9aa2ab), L / 2, 1.12, 0, g); // floor
    return g;
  }
  const xs = [0, -22.6, -45.2, -67.8, -90.4, -113];
  const coaches = xs.map((x, i) => bake(coach(x, { clear: i === 0 ? MOHIT_WIN : -1, panto: i === 1 ? 11 : 0 }), { cast: true, receive: true }));
  const MX = cx0; // world x of Mohit's window (coach 0 starts at x=0)

  // cab front (raked) at x = 22
  const cab = new T.Group(); cab.position.x = L; scene.add(cab);
  const nose = new T.BoxGeometry(1.6, TOP + .55 - BOT, W, 2, 3, 1);
  deform(nose, v => { const y = v.y + (TOP + .55 + BOT) / 2; if (v.x > 0) v.x -= clamp((y - 2.0) / 2.5) * 1.15; v.y = y; });
  nose.translate(.8, 0, 0); const nm = mesh(nose, mat(C.body), 0, 0, 0, cab); nm.castShadow = true;
  const wind = mesh(new T.PlaneGeometry(2.9, 1.25), new T.MeshPhongMaterial({ color: 0x1d2632, shininess: 100, specular: 0xffd9b0, flatShading: true }), 1.27, 3.0, 0, cab);
  wind.rotation.set(0, Math.PI / 2, 0); wind.rotateX(-.42);
  const led = textTex([{ t: 'CHURCHGATE', font: '700 64px "Hanken Grotesk", sans-serif', y: .54 }], { w: 512, h: 96, bg: '#0b0b0c', color: '#ffb340', dots: 4 });
  const ledM = mesh(new T.PlaneGeometry(2.3, .42), basic(0xffffff, { map: led }), .96, 3.92, 0, cab); ledM.rotation.set(0, Math.PI / 2, 0); ledM.rotateX(-.42);
  mesh(new T.BoxGeometry(.04, .42, W + .01), mat(C.blue), 1.62, 1.72, 0, cab);
  mesh(new T.BoxGeometry(.04, .45, W + .01), mat(C.navy), 1.62, 1.02, 0, cab);
  [-1.15, 1.15].forEach(z => { mesh(new T.BoxGeometry(.06, .2, .45), basic(0xfff3d0), 1.63, 2.15, z, cab); });
  mesh(new T.BoxGeometry(.5, .3, 1.4), mat(0x2a2f38), 1.7, .65, 0, cab);

  // ---------- Mohit's coach interior + Mohit ----------
  const inter = new T.Group(); scene.add(inter);
  mesh(new T.BoxGeometry(L - .4, .02, W - .2), mat(0x8f99a6), L / 2, 1.18, 0, inter);
  mesh(new T.BoxGeometry(L - .4, .04, W - .2), mat(0xe9e7e2), L / 2, 3.92, 0, inter);
  for (let i = 0; i < 4; i++) mesh(new T.BoxGeometry(3.2, .03, .18), basic(0xfffbf0), 4 + i * 4.6, 3.88, .9, inter);
  const seatM = mat(0x7593bb), seatD = mat(0x6684ad);
  function bench(x, z, face) {
    const b = new T.Group(); b.position.set(x, 0, z); b.rotation.y = face; inter.add(b);
    mesh(new T.BoxGeometry(.5, .14, 1.45), seatM, 0, 1.6, 0, b);
    mesh(new T.BoxGeometry(.12, .85, 1.45), seatD, -.26, 2.05, 0, b);
    mesh(new T.BoxGeometry(.4, .38, .1), mat(0x9aa0a8), 0, 1.38, 0, b);
    mesh(new T.BoxGeometry(.13, .06, .7), mat(0xcfd3d8), -.2, 2.55, 0, b); // grab handle
  }
  winXs.forEach((x, i) => { if (i !== MOHIT_WIN) bench(x + .2, 1.0, 0); else { const b = new T.Group(); b.position.set(x + .775, .3, .62); inter.add(b); mesh(new T.BoxGeometry(1.2, .14, .55), mat(0x6f8db5), 0, 1.6, 0, b); mesh(new T.BoxGeometry(1.2, .8, .12), mat(0x6684ad), 0, 2.05, -.3, b); } bench(x + 1.35, 1.0, Math.PI); bench(x + .2, -1.0, 0); bench(x + 1.35, -1.0, Math.PI); });
  for (let i = 0; i < 9; i++) { // grab straps
    const g = new T.Group(); g.position.set(3.5 + i * 2.1, 3.8, 0); inter.add(g);
    mesh(new T.CylinderGeometry(.012, .012, .45, 3).translate(0, -.22, 0), mat(0xd9d4c8), 0, 0, 0, g);
    mesh(new T.TorusGeometry(.07, .015, 3, 6), mat(0xe6e1d6), 0, -.5, 0, g);
    g.userData.ph = i; (inter.userData.straps = inter.userData.straps || []).push(g);
  }
  mesh(new T.CylinderGeometry(.02, .02, L - 1, 4).rotateZ(Math.PI / 2), mat(0xc9ccd1, { shininess: 60, specular: 0x888888 }), L / 2, 3.8, 0, inter);
  const lamp = new T.PointLight(0xffe3bd, .9, 7, 1.6); lamp.position.set(MX + .4, 3.3, .9); scene.add(lamp);
  const fill = new T.PointLight(0xffd2a0, .5, 2.2, 1.5); fill.position.set(MX + .4, 2.9, 1.55); scene.add(fill);

  const mo = makeMohit({ expression: 'pensive' });
  mo.root.scale.setScalar(.3); mo.root.rotation.y = 0;
  mo.root.position.set(MX - .12, 1.12, .9); scene.add(mo.root);
  poseChin(mo, { look: -.28, nod: -.22, tilt: .1, lean: .34, side: .05, poleX: -.5, poleZ: 1.5 });

  // ---------- canopy over the platform (stops short of his coach) ----------
  const cn = new T.Group(); scene.add(cn);
  for (let x = -118; x <= -6; x += 8) {
    const c = mesh(new T.CylinderGeometry(.16, .2, 6.6, 6), mat(0x2f6b54), x, 4.25, 7.6, cn); c.castShadow = true;
    mesh(new T.BoxGeometry(.25, .5, 6), mat(0x2f6b54), x, 7.4, 7.6, cn);
    const br = mesh(new T.BoxGeometry(.12, 2.2, .12), mat(0x2f6b54), x, 6.6, 6.6, cn); br.rotation.x = .7;
  }
  [[2.2, .17], [13, -.17]].forEach(([z, r]) => { const s = mesh(new T.BoxGeometry(116, .14, 6.0), mat(0xd7d2c8), -62, 7.95, (z + 7.6) / 2, cn); s.rotation.x = r; s.castShadow = true; });
  mesh(new T.BoxGeometry(116, .5, .5), mat(0x2f6b54), -62, 7.55, 7.6, cn);
  // station board
  const brd = textTex([{ t: 'चर्चगेट', font: '700 74px "Noto Sans Devanagari", sans-serif', y: .33 }, { t: 'CHURCHGATE', font: '700 70px "Hanken Grotesk", Arial, sans-serif', y: .76 }], { w: 512, h: 256, bg: '#f2c130', color: '#141414' });
  const bd = new T.Group(); bd.position.set(-2.5, 0, 9.4); bd.rotation.y = -.3; scene.add(bd);
  mesh(new T.PlaneGeometry(3.2, 1.6), mat(0xffffff, { map: brd }), 0, 3.6, .07, bd);
  mesh(new T.BoxGeometry(3.35, 1.75, .1), mat(0x1c1c1c), 0, 3.6, 0, bd);
  [-1.4, 1.4].forEach(x => mesh(new T.BoxGeometry(.12, 4.4, .12), mat(0x1f4a3a), x, 2.2, -.08, bd).castShadow = true);

  // ---------- the parked rake on the far road (no cab visible) ----------
  [-6.5].forEach(z => { for (let i = 0; i < 6; i++) { const g = coach(-10 - i * 22.6, {}); g.position.z = z; bake(g, { cast: true, receive: true }); } });

  // ---------- the city beyond: Western Railway HQ, Eros, blocks, Wankhede masts ----------
  const stone = 0xd8c09a, stoneD = 0xb99c74;
  const hq = new T.Group(); hq.position.set(-38, 0, -62); hq.rotation.y = .12; scene.add(hq);
  mesh(new T.BoxGeometry(46, 15, 14), mat(stone), 0, 7.5, 0, hq);
  for (let f = 0; f < 3; f++) for (let i = 0; i < 14; i++) { const x = -20 + i * 3.1; if (Math.abs(x) < 4) continue; const w = mesh(new T.BoxGeometry(1.1, 2.2, .1), mat(0x7e6a55), x, 3 + f * 4.4, 7.05, hq); const a = mesh(new T.ConeGeometry(.78, .8, 4), mat(0x7e6a55), x, 4.5 + f * 4.4, 7.0, hq); a.rotation.y = Math.PI / 4; a.scale.z = .1; }
  [-23, 23].forEach(x => { mesh(new T.BoxGeometry(4, 19, 4), mat(stoneD), x, 9.5, 7, hq); mesh(new T.ConeGeometry(2.6, 5, 4), mat(0x8e7a64), x, 21.4, 7, hq).rotation.y = Math.PI / 4; });
  for (let i = -3; i <= 3; i++) if (i) mesh(new T.ConeGeometry(.6, 2.4, 4), mat(stoneD), i * 6, 16.2, 6, hq);
  mesh(new T.BoxGeometry(9, 22, 9), mat(stone), 0, 11, 2, hq);
  mesh(new T.CylinderGeometry(4.3, 4.6, 5, 8), mat(stoneD), 0, 24.5, 2, hq);
  mesh(new T.SphereGeometry(4.4, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), mat(0x9a8a76), 0, 27, 2, hq);
  mesh(new T.CylinderGeometry(.9, 1.1, 2.4, 6), mat(stoneD), 0, 32.2, 2, hq);
  mesh(new T.ConeGeometry(.6, 2.6, 6), mat(0x9a8a76), 0, 34.6, 2, hq);
  mesh(new T.BoxGeometry(5, 7, .3), mat(0x7e6a55), 0, 9, 6.6, hq);
  // Eros (cream deco, stepped tower)
  const er = new T.Group(); er.position.set(30, 0, -70); er.rotation.y = -.3; scene.add(er);
  mesh(new T.BoxGeometry(26, 14, 14), mat(0xeadbbd), 0, 7, 0, er);
  mesh(new T.CylinderGeometry(7, 7, 14, 10, 1, false, 0, Math.PI / 2), mat(0xeadbbd), 13, 7, 7, er);
  [[0, 22, 6], [0, 26, 4.2], [0, 29, 2.6]].forEach(([x, h, w]) => mesh(new T.BoxGeometry(w, h, w * .8), mat(0xf1e4c9), 11, h / 2, 9, er));
  for (let f = 0; f < 4; f++) mesh(new T.BoxGeometry(27, .3, 1), mat(0xd4c19c), 0, 3 + f * 3, 7.3, er);
  mesh(new T.BoxGeometry(16, 2.2, .3), mat(0xb85b45), -3, 11.5, 7.2, er);
  // blocks + rain trees
  const city = new T.Group(); scene.add(city);
  const pal = [0xead9bf, 0xe9c9b5, 0xdcd2bb, 0xe8e0c8, 0xd7c2a8, 0xe5d0b0];
  for (let i = 0; i < 46; i++) {
    const x = -200 + (i * 37) % 400 + hash3(i, 1, 2) * 10, z = -90 - (i % 5) * 26 - hash3(i, 3, 1) * 20, h = 10 + hash3(i, 2, 2) * 26;
    if (x > -70 && x < 50 && z > -100) continue;
    const b = decoBlock(10 + hash3(i, 5, 1) * 8, h, 9, pal[i % pal.length]); b.position.set(x, 0, z); b.rotation.y = (hash3(i, 9, 9) - .5) * .3; city.add(b);
  }
  for (let i = 0; i < 18; i++) { const t = rainTree(1.6 + hash3(i, 0, 7) * .8, i % 2 ? 0x6f9160 : 0x7a9a66); t.position.set(-160 + i * 17 + hash3(i, 4, 4) * 6, 0, -30 - hash3(i, 1, 9) * 14); city.add(t); }
  bake(city); bake(hq); bake(er); bake(cn, { cast: true });
  [[80, -130], [118, -150], [96, -190]].forEach(([x, z]) => {
    const m = new T.Group(); m.position.set(x, 0, z); scene.add(m);
    mesh(new T.CylinderGeometry(.5, 1.1, 50, 5), mat(0x9aa3ac), 0, 25, 0, m);
    const head = mesh(new T.BoxGeometry(7, 4, .6), mat(0x7f8892), 0, 51, 0, m); head.lookAt(0, 51, 400);
  });
  // drifting low-poly clouds + a few birds
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    const c = new T.Group(); for (let k = 0; k < 3; k++) { const g = jitter(new T.IcosahedronGeometry(6 + k * 2, 0), 2); g.scale(1.6, .45, 1); mesh(g, mat(0xfff0e0, { emissive: 0x6b4a32 }), k * 9 - 9, k === 1 ? 2 : 0, 0, c); }
    c.position.set(-300 + i * 75, 55 + (i % 3) * 14, -260 - (i % 4) * 30); scene.add(c); clouds.push(c);
  }
  const birds = [];
  for (let i = 0; i < 7; i++) { const b = new T.Group(); [-1, 1].forEach(s => { const w = mesh(new T.ConeGeometry(.35, 1.4, 3).rotateZ(s * Math.PI / 2), basic(0x4a4040), s * .6, 0, 0, b); w.userData.s = s; });  }

  // ---------- camera path ----------
  const keysWide = [
    [0, [52, 7.5, 34], [2, 4.5, -6], 40],
    [.42, [30, 3.6, 17], [9, 2.9, 0], 36],
    [.74, [MX + 3.4, 2.1, 9.0], [MX - .4, 2.95, 1], 32],
    [1, [MX + .75, 2.62, 4.6], [MX - .25, 2.66, 1.3], 30],
  ];
  const keysTall = [
    [0, [44, 9, 46], [6, 3.5, -4], 62],
    [.42, [26, 4.2, 22], [9, 2.9, 0], 54],
    [.74, [MX + 2.6, 2.4, 9.0], [MX - .2, 3.1, 1], 46],
    [1, [MX + 1.6, 2.2, 6.4], [MX - .2, 3.25, 1], 44],
  ];
  const note = document.getElementById('note'), hint = document.getElementById('hint'), copy = document.querySelector('.copy');
  S.frames.push((p, t) => {
    const tall = S.w / S.h < .9;
    const k = camKeys(tall ? keysTall : keysWide, p);
    cam.position.set(...k.pos); cam.lookAt(...k.tgt); cam.fov = k.fov;
    // keep him right of the text column on wide screens
    const shift = tall ? 0 : smooth(.45, 1, p) * .2 * S.w;
    if (shift > 0) cam.setViewOffset(S.w, S.h, -shift, 0, S.w, S.h); else cam.clearViewOffset();
    cam.updateProjectionMatrix();
    note.classList.toggle('on', p > .88);
    const co = 1 - smooth(.1, .26, p); copy.style.opacity = clamp(co); copy.style.visibility = co < .01 ? 'hidden' : 'visible';
    hint.style.opacity = p > .04 ? 0 : 1;
    // ambient
    clouds.forEach((c, i) => { c.position.x = ((c.position.x + 300 + .02 * (1 + i % 3)) % 680) - 340; });
    if (0) birds.forEach((b, i) => { b.position.x = ((t * 3.2 + i * 9 + 60) % 260) - 130; b.position.y = 22 + (i % 3) * 3 + Math.sin(t + i) * .8; b.children.forEach(w => w.rotation.x = Math.sin(t * 7 + i) * .5 * w.userData.s); });
    inter.userData.straps.forEach(g => g.rotation.z = Math.sin(t * .9 + g.userData.ph) * .06);
    mohitLife(mo, t);
  });
})();
