.run{height:320vh;position:relative}

.him{position:absolute;z-index:2;left:62vw;bottom:0;height:min(76vh,700px);aspect-ratio:560/800;will-change:transform}
.him svg{width:100%;height:100%;display:block;overflow:visible}
.ln,.ln *{vector-effect:non-scaling-stroke}

<!-- direction: Style01 Promenade — flat-field Marine Drive, sun lowers, lamps draw on -->
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // curve sampling for blocks and lamps
  const curve = document.getElementById('curve'), L = curve.getTotalLength();
  const deco = document.getElementById('deco'), lamps = document.getElementById('lamps');
  const fills = ['#efe3c8', '#f1dcc9', '#e9e0b9', '#ece6da', '#e7d2c4', '#f0e2b6'];
  const N = 24;
  for (let i = N - 1; i >= 0; i--) {
    const t = i / (N - 1), pt = curve.getPointAtLength(L * Math.pow(t, 1.25) * .98 + 6);
    const sc = .18 + .82 * Math.pow(1 - t, 1.6); // near (right) is larger
    const w = 64 * sc + 6, h = (40 + (i * 37 % 23)) * sc * 2.6 + 6;
    const x = pt.x - w / 2, y = pt.y - h - 2 * sc;
    const g = el('g', {}, deco);
    el('rect', { x, y, width: w, height: h, fill: fills[i % fills.length] }, g);
    // a curved corner and eyebrow sunshades: the Deco tell
    el('path', { class: 'ln', d: `M${x},${y + h} V${y + 4 * sc} Q${x},${y} ${x + 4 * sc},${y} H${x + w} V${y + h}`, style: 'stroke:#16202c;stroke-opacity:.75' }, g);
    if (sc > .35) for (let r = y + 10 * sc; r < y + h - 6 * sc; r += 9 * sc) el('path', { class: 'ln', d: `M${x + 2 * sc},${r} H${x + w - 2 * sc}`, style: 'stroke:#16202c;stroke-opacity:.35' }, g);
    if (sc > .5) el('rect', { x: x + w * .62, y: y - 9 * sc, width: w * .22, height: 9 * sc, fill: fills[(i + 2) % fills.length] }, g);
  }
  const lampEls = [];
  for (let i = 0; i < 34; i++) {
    const t = i / 33, pt = curve.getPointAtLength(L * Math.pow(t, .9));
    const r = 1.2 + 3.2 * Math.pow(1 - t, 2);
    lampEls.push(el('circle', { cx: pt.x, cy: pt.y + 3, r, fill: '#ffd27a', opacity: 0 }, lamps));
  }
  // tetrapods, a loose pile at the wall's foot
  const tg = document.getElementById('tetras');
  for (let i = 0; i < 34; i++) {
    const row = i % 2, x = -30 + (i >> 1) * 92 + row * 46 + (i * 53 % 24), y = 792 + row * 30 + (i * 31 % 9), s = (1.15 + (i * 17 % 7) / 16) * (row ? 1.2 : 1), rot = (i * 47 % 60) - 30;
    el('use', { href: '#tetra', transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})` }, tg);
  }
  // sea: fine horizontal rules, denser near the horizon, drifting slowly
  const waves = document.getElementById('waves'), wl = [];
  for (let i = 0; i < 18; i++) {
    const y = 560 + Math.pow((i + 1) / 18, 1.7) * 200;
    const seg = 30 + i * 9, gap = 60 + i * 14;
    const p = el('path', { d: `M-200,${y.toFixed(1)} H1640`, 'stroke-dasharray': `${seg} ${gap}` }, waves);
    wl.push({ p, sp: .08 + i * .025, off: (i * 97) % 300 });
  }
  const glint = document.getElementById('glint'), gl = [];
  for (let i = 0; i < 9; i++) gl.push(el('rect', { x: 0, y: 566 + i * 13 + i * i * 1.2, width: 60 - i * 3, height: 2.2, fill: '#f6c27a' }, glint));
  const run = document.getElementById('run'), sun = document.getElementById('sun'), dusk = document.getElementById('dusk');
  const him = document.getElementById('him');
  let cur = 0, top0, span;
  const measure = () => { top0 = run.getBoundingClientRect().top + scrollY; span = run.offsetHeight - innerHeight; };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = t => 1 - Math.pow(1 - t, 3);
  let tm = 0, last = performance.now();
  function tick(now) {
    const dt = Math.min(50, now - last); last = now; if (!reduce) tm += dt;
    const tgt = clamp((scrollY - top0) / span, 0, 1);
    cur += (tgt - cur) * (reduce ? 1 : .1);
    const p = ease(cur);
    const sy = 150 + p * 412, sx = 800 - p * 50;
    sun.setAttribute('cy', sy.toFixed(1)); sun.setAttribute('cx', sx.toFixed(1));
    dusk.setAttribute('opacity', (clamp((cur - .25) / .7, 0, 1) * .85).toFixed(3));
    // lamps light near to far
    const lit = clamp((cur - .35) / .55, 0, 1) * lampEls.length;
    lampEls.forEach((c, i) => c.setAttribute('opacity', clamp(lit - i, 0, 1).toFixed(2)));
    // glint follows the sun, fades as it sets
    gl.forEach((r, i) => { const w = +r.getAttribute('width'); r.setAttribute('x', (sx - w / 2 + Math.sin(tm / 900 + i) * 6).toFixed(1)); });
    glint.setAttribute('opacity', (.85 - p * .4).toFixed(2));
    // ambient drift
    wl.forEach(w => w.p.setAttribute('stroke-dashoffset', (-(tm * w.sp / 16) - w.off).toFixed(1)));
    // his slight settle: earned, a few pixels only
    him.style.translate = `0 ${(1 - p) * 14}px`;
    requestAnimationFrame(tick);
  }
  addEventListener('resize', measure); measure(); requestAnimationFrame(tick);
})();
</script>
