let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

// Art Deco row: near (left) to far (Malabar Hill)
(()=>{
  const cols=['#f3e3c3','#f2d48a','#eab3a3','#f6efe2','#e9c9a0','#d9e3d6'];
  const haze='#c9dcd2';
  let s='',x=-60;
  while(x<720){
    const u=clamp((x+60)/780);
    const w=lerp(92,14,Math.pow(u,.7))*(0.8+rnd()*.4);
    const h=lerp(150,22,Math.pow(u,.8))*(0.75+rnd()*.45);
    const base=lerp(640,606,u);
    const top=base-h;
    const c=cols[Math.floor(rnd()*cols.length)];
    const fade=lerp(0,.62,u);
    const r=Math.min(w*.35,18*(1-u)+2);
    // curved corner on the sea side (left)
    s+=`<path d="M${x} ${base} V${top+r} Q${x} ${top} ${x+r} ${top} H${x+w} V${base} Z" fill="${c}"/>`;
    s+=`<path d="M${x+w*.72} ${base} V${top} H${x+w} V${base} Z" fill="#8a6a6a" opacity=".22"/>`;
    // eyebrow sunshades and ribbon balconies
    const fl=Math.max(2,Math.round(h/lerp(18,6,u)));
    for(let i=1;i<fl;i++){const y=top+i*h/fl;
      s+=`<rect x="${x+1}" y="${y}" width="${w-2}" height="${Math.max(.6,lerp(2.6,.6,u))}" fill="#5a4a52" opacity="${lerp(.5,.18,u)}"/>`;
      if(u<.55&&i%2) for(let k=x+w*.12;k<x+w*.8;k+=lerp(12,5,u)) s+=`<rect x="${k}" y="${y+lerp(4,1.5,u)}" width="${lerp(5,2,u)}" height="${lerp(7,2,u)}" fill="#3b4d5e" opacity=".55"/>`;
    }
    if(u<.5) s+=`<rect x="${x+w*.5-3}" y="${top-lerp(14,4,u)}" width="${lerp(8,3,u)}" height="${lerp(14,4,u)}" fill="${c}"/>`;
    if(fade>0) s+=`<path d="M${x} ${base} V${top+r} Q${x} ${top} ${x+r} ${top} H${x+w} V${base} Z" fill="${haze}" opacity="${fade}"/>`;
    x+=w+lerp(4,1,u);
  }
  // promenade, parapet and lamp posts along the curve
  s+=`<path d="M-60 642 C200 632 460 616 760 606 L760 610 C460 621 200 638 -60 650 Z" fill="#e8e0cf"/>`;
  s+=`<path d="M-60 650 C200 638 460 621 760 610 L760 613 C460 624 200 642 -60 656 Z" fill="#7d8d93"/>`;
  for(let i=0;i<26;i++){const u=i/26,lx=lerp(-40,740,Math.pow(u,.85)),ly=lerp(642,607,u),lh=lerp(30,5,u);
    s+=`<rect x="${lx}" y="${ly-lh}" width="${lerp(2,.6,u)}" height="${lh}" fill="#3c4650" opacity=".7"/>`;}
  $('deco').innerHTML=s;
  let m='';for(let i=0;i<14;i++){const x=600+i*20+rnd()*8,h=10+rnd()*36;m+=`<rect x="${x}" y="${566-h+Math.abs(i-6)*3}" width="${8+rnd()*8}" height="${h+40}"/>`;}
  $('malabar').innerHTML=m;
})();

// sea glints, painted dashes
(()=>{let s='';for(let i=0;i<70;i++){const y=620+Math.pow(rnd(),1.6)*270,w=10+rnd()*60*(y-600)/300,x=rnd()*1500-30;
  s+=`<rect class="gl" x="${x}" y="${y}" width="${w}" height="${1.2+(y-600)/150}" rx="1" opacity="${.25+rnd()*.5}"/>`;}
  $('glint').innerHTML=s;})();

// tetrapods: four-legged concrete armour piled at the wall
function tetra(x,y,s,rot,shade){
  const legs=[[0,-1],[.94,.34],[-.94,.34],[.1,.9]];
  let p='';
  legs.forEach(([dx,dy],i)=>{const a=Math.atan2(dy,dx)+rot;const ex=x+Math.cos(a)*48*s,ey=y+Math.sin(a)*48*s;
    const nx=-Math.sin(a)*15*s,ny=Math.cos(a)*15*s,tx=-Math.sin(a)*9*s,ty=Math.cos(a)*9*s;
    const f=['#b9b2a6','#d6cfc1','#8f8a82','#a49e94'][(i+shade)%4];
    p+=`<path d="M${x+nx} ${y+ny} L${ex+tx} ${ey+ty} Q${ex+Math.cos(a)*5*s} ${ey+Math.sin(a)*5*s} ${ex-tx} ${ey-ty} L${x-nx} ${y-ny} Z" fill="${f}"/>`;});
  p+=`<circle cx="${x}" cy="${y}" r="${16*s}" fill="#c8c1b3"/><circle cx="${x-4*s}" cy="${y-5*s}" r="${7*s}" fill="#e6dfd0" opacity=".8"/>`;
  return p;
}
(()=>{
  let s='';
  // the low sea wall / parapet in the near foreground, left
    const pile=[[30,800,1.1,.2],[120,812,1.2,1.1],[210,796,1,2.3],[300,818,1.15,.7],[390,806,1,1.9],[480,820,1.05,.4],[570,812,.95,2.8],[70,850,1.3,1.6],[180,856,1.35,.3],[300,866,1.3,2.1],[420,860,1.25,1.2],[540,864,1.2,.9],[-20,862,1.2,2.6]];
  pile.forEach(([x,y,k,r],i)=>s+=tetra(x,y,k,r,i));
  s+=`<g id="spray" fill="#f4fbfa" opacity="0"><circle cx="340" cy="770" r="26"/><circle cx="378" cy="752" r="18"/><circle cx="306" cy="756" r="16"/><circle cx="360" cy="728" r="11"/><circle cx="410" cy="776" r="14"/></g>`;
  // the promenade parapet itself, closest, low across the bottom left
  s+=`<path d="M-300 884 C100 874 380 870 660 872 L660 900 L-300 900 Z" fill="#d9d2c2"/><path d="M-300 884 C100 874 380 870 660 872 L660 876 C380 874 100 878 -300 888 Z" fill="#f4eee0"/>`;
  $('front').innerHTML=s;
})();

// rays behind hero
(()=>{let s='';for(let i=0;i<32;i++){const a=i/32*Math.PI*2,b=a+Math.PI/32;
  s+=`<path d="M1130 330 L${1130+1500*Math.cos(a)} ${330+1500*Math.sin(a)} L${1130+1500*Math.cos(b)} ${330+1500*Math.sin(b)} Z" fill="#fff4cf"/>`;}
  $('rays').innerHTML=s;})();

$('hero').innerHTML=MOHIT({mood:'smile',id:'p',rim:'#7fe0dc'});

const pin=$('pin'),heroG=$('heroG'),lines=[...document.querySelectorAll('#lines p')],aside=$('aside'),back=$('back'),haloG=$('haloG');
let t=0,tt=0,last=performance.now();
const ease=x=>1-Math.pow(1-x,3);
function layout(){
  const phone=innerWidth<720, ar=innerWidth/innerHeight;
  const vbW=ar>1.6?1440:900*ar, vbH=ar>1.6?1440/ar:900;
  const L=720-vbW/2, T=450-vbH/2;
  if(phone){const sc=Math.min(vbW*1.05/400,vbH*.56/500);return{sc,x:720-200*sc+vbW*.04,y:T+vbH-500*sc,hx:720+vbW*.06,hy:T+vbH-500*sc+200*sc};}
  const sc=Math.min(vbH*.9/500,vbW*.46/400);
  const x=L+vbW-400*sc-vbW*.02, y=T+vbH-500*sc;
  return{sc,x,y,hx:x+210*sc,hy:y+200*sc};
}
function render(){
  const P=layout();
  const k=ease(clamp(tt/.22));
  const dy=(1-k)*520*P.sc;
  heroG.setAttribute('transform',`translate(${P.x} ${P.y+dy}) scale(${P.sc})`);
  haloG.setAttribute('transform',`translate(${P.hx-1130} ${P.hy-330+dy})`);
  haloG.style.opacity=k;
  back.setAttribute('transform',`translate(${-tt*40} ${tt*10})`);
  lines.forEach((p,i)=>{const a=clamp((tt-(.26+i*.15))/.1);p.style.opacity=a;p.style.transform=`translateY(${(1-a)*18}px)`;});
  const b=clamp((tt-.78)/.1);aside.style.opacity=b;aside.style.transform=`translateY(${(1-b)*16}px)`;
}
function frame(now){
  const dt=Math.min(64,now-last);last=now;
  const r=pin.getBoundingClientRect();t=clamp(-r.top/(r.height-innerHeight));
  tt+=reduce?(t-tt):(t-tt)*Math.min(1,dt/110);
  render();
  if(!reduce){
    const T=now/1000;
    $('rays').setAttribute('transform',`rotate(${T*1.2} 1130 330)`);
    $('clouds').setAttribute('transform',`translate(${Math.sin(T*.05)*40} 0)`);
    const sp=(T%7)/7, so=sp<.18?Math.sin(sp/.18*Math.PI):0;
    $('spray').setAttribute('opacity',so*.85);$('spray').setAttribute('transform',`translate(0 ${-so*24})`);
    $('glint').setAttribute('opacity',.75+.25*Math.sin(T*1.7));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
