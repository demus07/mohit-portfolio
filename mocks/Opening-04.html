<script>
(() => {
  // coach detail along the rake: windows (lit, some with passengers), doors
  const NS = "http://www.w3.org/2000/svg", bits = document.getElementById("coachBits");
  const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); bits.appendChild(e); return e; };
  const xs = [];
  for (let x = -700; x < 2400; x += 136) xs.push(x);
  xs.forEach((x, i) => {
    if (i % 4 === 3) { // door
      mk("rect", { x: x - 6, y: 372, width: 112, height: 300, rx: 3, fill: "#c4b296", stroke: "#8f7f68", "stroke-width": 2 });
      mk("line", { x1: x + 50, y1: 372, x2: x + 50, y2: 672, stroke: "#857560", "stroke-width": 2 });
      mk("rect", { x: x + 8, y: 396, width: 32, height: 86, rx: 5, fill: "url(#lit)", opacity: .85 });
      mk("rect", { x: x + 60, y: 396, width: 32, height: 86, rx: 5, fill: "url(#lit)", opacity: .85 });
      return;
    }
    const cx = x + 50;
    if (Math.abs(cx - 1010) < 40) return;
    mk("rect", { x: cx - 52, y: 397, width: 104, height: 116, rx: 12, fill: "#a8977c" });
    mk("rect", { x: cx - 46, y: 403, width: 92, height: 104, rx: 9, fill: "url(#lit)" });
    mk("rect", { x: cx - 46, y: 467, width: 92, height: 40, fill: "#335a85", opacity: .9 });
    if (i % 3 === 1) { // a seated passenger, soft
      mk("circle", { cx: cx + (i % 2 ? 14 : -16), cy: 452, r: 13, fill: "#3b3436", opacity: .75 });
      mk("path", { d: `M${cx + (i % 2 ? -12 : -42)},507 C${cx + (i % 2 ? -10 : -40)},478 ${cx + (i % 2 ? 4 : -26)},466 ${cx + (i % 2 ? 14 : -16)},466 C${cx + (i % 2 ? 26 : -4)},466 ${cx + (i % 2 ? 40 : 10)},478 ${cx + (i % 2 ? 42 : 12)},507 Z`, fill: "#4a4550", opacity: .7 });
    }
    mk("rect", { x: cx - 46, y: 403, width: 92, height: 104, rx: 9, fill: "none", stroke: "#2a2a2e", "stroke-width": 2.5 });
  });
  // roof AC units
  for (let x = -700; x < 2400; x += 544) mk("rect", { x: x + 80, y: 334, width: 220, height: 14, rx: 4, fill: "#a99a83" });
})();
</script>

  const grid = new Uint8Array(COLS * ROWS);   // 0 off, 1 amber, 2 red
  const put = (c, r, v) => { if (c >= 0 && c < COLS && r >= 0 && r < ROWS) grid[r * COLS + c] = v; };
  const textW = (s, sc = 1) => [...s].reduce((w, ch) => w + ((F[ch] || F[" "]).split(" ")[0].length + 1) * sc, -sc);
  const drawText = (s, c0, r0, v, sc = 1) => {
    let c = c0;
    for (const ch of s) {
      const g = (F[ch] || F[" "]).split(" "), w = g[0].length;
      g.forEach((row, ry) => [...row].forEach((b, rx) => { if (b === "1") for (let a = 0; a < sc; a++) for (let d = 0; d < sc; d++) put(c + rx * sc + a, r0 + ry * sc + d, v); }));
      c += (w + 1) * sc;
    }
  };
  // Devanagari header, sampled from the font into the LED grid
  let deva = null;
  try { await document.fonts.load('600 40px "Noto Sans Devanagari"'); } catch (e) {}
  const sampleDeva = () => {
    const h = 9, cv = document.createElement("canvas"), W = 80; cv.width = W * 8; cv.height = h * 8;
    const x = cv.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, cv.width, cv.height);
    x.fillStyle = "#fff"; x.font = `600 ${h * 8 * .78}px "Noto Sans Devanagari", sans-serif`; x.textBaseline = "alphabetic";
    x.fillText("चर्चगेट", 0, h * 8 * .74);
    const d = x.getImageData(0, 0, cv.width, cv.height).data, out = [];
    let maxc = 0;
    for (let r = 0; r < h; r++) for (let c = 0; c < W; c++) {
      let sum = 0; for (let yy = 0; yy < 8; yy++) for (let xx = 0; xx < 8; xx++) sum += d[((r * 8 + yy) * cv.width + c * 8 + xx) * 4];
      if (sum / 64 > 96) { out.push([c, r]); maxc = Math.max(maxc, c); }
    }
    return { px: out, w: maxc + 1 };
  };
  deva = sampleDeva();

  const mumbaiTime = () => new Intl.DateTimeFormat("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit", hour12: false }).format(new Date());
  let lang = 0;
  const compose = () => {
    grid.fill(0);
    // header: station name, alternating English / Marathi as the real boards do
    if (lang === 0) drawText("CHURCHGATE", 2, 1, 2);
    else deva.px.forEach(([c, r]) => put(2 + c, r, 2));
    const t = mumbaiTime().replace(/\s/g, "");
    drawText(t, COLS - 2 - textW(t), 1, 1);
    // the train: his name, double height
    drawText("MOHIT BAGRI", Math.round((COLS - textW("MOHIT BAGRI", 2)) / 2), 12, 1, 2);
    // footer row
    drawText("AC", 2, 31, 1);
    drawText("12", COLS - 2 - textW("12"), 31, 1);
  };

  const cv = document.getElementById("led"), ctx = cv.getContext("2d");
  let pitch = 7, sprites = {};
  const makeSprite = (col, glow) => {
    const s = document.createElement("canvas"), n = Math.ceil(pitch * 3); s.width = s.height = n;
    const x = s.getContext("2d"), c = n / 2;
    if (glow) { const g = x.createRadialGradient(c, c, 0, c, c, n / 2); g.addColorStop(0, col + "55"); g.addColorStop(1, col + "00"); x.fillStyle = g; x.fillRect(0, 0, n, n); }
    x.fillStyle = col; x.beginPath(); x.arc(c, c, pitch * .36, 0, Math.PI * 2); x.fill();
    if (glow) { x.fillStyle = "#fff3d0"; x.globalAlpha = .55; x.beginPath(); x.arc(c - pitch * .08, c - pitch * .08, pitch * .14, 0, Math.PI * 2); x.fill(); }
    return s;
  };
  const size = () => {
    const w = cv.parentElement.clientWidth - parseFloat(getComputedStyle(cv.parentElement).paddingLeft) * 2;
    const dpr = Math.min(2, devicePixelRatio || 1);
    pitch = w / COLS * dpr;
    cv.width = Math.round(w * dpr); cv.height = Math.round(pitch * ROWS);
    cv.style.height = (cv.height / dpr) + "px";
    sprites = { 0: makeSprite("#2a1c12", false), 1: makeSprite("#ffb02e", true), 2: makeSprite("#ff4a2a", true) };
  };
  // reveal sweep when the header changes language
  let sweep = COLS;
  const paint = () => {
    ctx.fillStyle = "#0b0b0c"; ctx.fillRect(0, 0, cv.width, cv.height);
    const n = sprites[0].width, o = n / 2 - pitch / 2;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      let v = grid[r * COLS + c];
      if (r < 10 && c > sweep) v = 0;
      ctx.drawImage(sprites[v], c * pitch - o, r * pitch - o);
    }
  };
  size(); compose(); paint();
  addEventListener("resize", () => { size(); paint(); window.__layout && window.__layout(); });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setInterval(() => {
    lang = 1 - lang; compose();
    if (reduce) { paint(); return; }
    sweep = -1;
    const step = () => { sweep += 3; paint(); if (sweep < 90) requestAnimationFrame(step); else { sweep = COLS; paint(); } };
    step();
  }, 4200);
  setInterval(() => { compose(); paint(); }, 20000);
  window.__boardReady = true;
})();
</script>
<script>
(() => {
  const sec = document.getElementById("intro");
  const board = document.getElementById("board"), hang = document.getElementById("hang");
  const scene = document.getElementById("scene"), soft = document.getElementById("sceneSoft");
  const copy = document.getElementById("copy"), name = document.getElementById("name");
  const line = document.getElementById("line"), note = document.getElementById("note");
  const sheen = document.getElementById("sheen");
  const rods = [...document.querySelectorAll(".rod")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  let target = 0, cur = 0, boardBottom = 400, nameH = 90;
  const read = () => { const r = sec.getBoundingClientRect(); target = clamp(-r.top / (r.height - innerHeight), 0, 1); };
  window.__layout = () => {
    const b = board.getBoundingClientRect();
    boardBottom = hang.offsetTop + parseFloat(getComputedStyle(hang).getPropertyValue("--rodH")) / 100 * innerHeight + board.offsetHeight;
    nameH = name.offsetHeight + 18;
  };
  addEventListener("scroll", read, { passive: true }); addEventListener("resize", read);
  read(); cur = target; setTimeout(window.__layout, 60); window.__layout();
  const T = { x: 1010, y: 455 };
  function frame(t) {
    cur += (target - cur) * (reduce ? 1 : .085);
    const p = cur, s = t / 1000;
    const W = innerWidth, H = innerHeight, aspect = W / H, narrow = aspect < .9;
    // 1. the board tips up and away on its rods
    const f = ease(seg(p, .1, .42));
    board.style.transform = `rotateX(${(-f * 84).toFixed(2)}deg)`;
    rods.forEach(r => r.style.opacity = (1 - seg(p, .3, .46)).toFixed(3));
    board.style.opacity = (1 - seg(p, .36, .46)).toFixed(3);
    // 2. the scene comes into focus behind it
    scene.style.opacity = f.toFixed(3); soft.style.opacity = (1 - f).toFixed(3);
    // 3. then the camera walks up to his window
    const z = ease(seg(p, .38, .9));
    const w0 = narrow ? 760 : 1440, h0 = w0 / aspect;
    const cx0 = narrow ? 900 : 720, cy0 = narrow ? 470 : 450;
    const h1 = narrow ? 300 : 330, w1 = h1 * aspect;
    const cx1 = narrow ? T.x - 6 : T.x - w1 * .2, cy1 = narrow ? T.y - h1 * .2 : 344 - h1 * .4 + h1 / 2;
    const w = w0 * Math.pow(w1 / w0, z), k = (w0 - w) / (w0 - w1), h = w / aspect;
    const cx = cx0 + (cx1 - cx0) * k, cy = cy0 + (cy1 - cy0) * k;
    const vb = `${(cx - w / 2).toFixed(2)} ${(cy - h / 2).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`;
    scene.setAttribute("viewBox", vb); scene.setAttribute("preserveAspectRatio", "xMidYMid meet");
    soft.setAttribute("viewBox", `${720 - w0 / 2} ${cy0 - h0 / 2} ${w0} ${h0}`); soft.setAttribute("preserveAspectRatio", "xMidYMid meet");
    // copy: under the board, then glides to the top as the board leaves
    const topStart = boardBottom + (narrow ? 22 : 34), topEnd = narrow ? 26 : Math.max(40, H * .09);
    const g = ease(seg(p, .2, .5));
    copy.style.top = "0px";
    copy.style.transform = `translateY(${(topStart - nameH + (topEnd - (topStart - nameH)) * g).toFixed(1)}px)`;
    name.style.opacity = seg(g, .55, 1).toFixed(3);
    const a = seg(p, .52, .64), b = seg(p, .74, .9);
    line.style.opacity = 1 - a; line.style.transform = `translateY(${-a * 12}px)`;
    note.style.opacity = b; note.style.transform = `translateY(${(1 - b) * 12}px)`;
    if (!reduce) sheen.setAttribute("x", (-140 + ((s * 26) % 300)).toFixed(1));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
