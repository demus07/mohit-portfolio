<!-- Direction 05: On the parapet — Mohit seen from behind, sitting on the Marine Drive wall facing the sea, the afternoon wind in his shirt; scrolling walks you closer -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promenade, on the parapet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#efe8da; --ink:#1f2a33; }

  body { font-family:"Manrope",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .scroller { height:340vh; position:relative; }
  .stage { position:sticky; top:0; height:100vh; height:100svh; overflow:hidden; }
  svg.scene { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .grain { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; opacity:.45; }
  .copy { position:absolute; left:6.2vw; top:10.5vh; max-width:560px; z-index:5; }
  h1 { font-family:"Spectral",serif; font-weight:300; font-size:clamp(42px,4.6vw,74px); line-height:1.02; letter-spacing:-.02em; text-wrap:balance; }
  h1 em { font-style:italic; }
  .line { margin-top:24px; font-size:clamp(15.5px,1.15vw,18px); line-height:1.6; max-width:36ch; color:#33404a; }
  .aside { margin-top:20px; font-family:"Spectral",serif; font-style:italic; font-weight:300; font-size:clamp(19px,1.5vw,24px); line-height:1.38; max-width:30ch; color:#6a4a32; opacity:0; transform:translateY(12px); }
  @media (max-width:700px){
    .copy { left:20px; right:20px; top:48px; }
    h1 { font-size:40px; }
    .line { margin-top:12px; font-size:15.5px; }
    .aside { margin-top:10px; font-size:18px; }
  }
</style>
</head>
<body>
<div class="scroller" id="scroller">
  <div class="stage">

      <defs>

        </radialGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a7b8b2"/><stop offset=".15" stop-color="#7aa0a8"/><stop offset=".6" stop-color="#3f7b92"/><stop offset="1" stop-color="#2c6d8c"/>
        </linearGradient>
        <radialGradient id="glare" cx="1010" cy="480" r="300" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 480) scale(.7 1) translate(-1010 -480)">
          <stop offset="0" stop-color="#fff5d8" stop-opacity=".9"/><stop offset=".5" stop-color="#f8e4b8" stop-opacity=".3"/><stop offset="1" stop-color="#f8e4b8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="pTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dcc2"/><stop offset="1" stop-color="#c9b896"/></linearGradient>
        <linearGradient id="pFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f8370"/><stop offset="1" stop-color="#6e6454"/></linearGradient>

        <linearGradient id="skinArmR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#c88a5e"/><stop offset=".35" stop-color="#9a6444"/><stop offset="1" stop-color="#7d4f35"/></linearGradient>

        <clipPath id="torsoClip"><path id="torsoClipPath" d=""/></clipPath>
        <clipPath id="armLClip"><path id="armLClipPath" d=""/></clipPath>

      <g id="bg">
        <rect y="-900" width="1440" height="1800" fill="#ddd3bf"/><rect y="-400" width="1440" height="1300" fill="url(#sky)"/>
        <rect y="-400" width="1440" height="1300" fill="url(#sun)"/>
        <!-- the far end of the curve and Malabar Hill -->

        <rect y="470" width="1440" height="460" fill="url(#glare)"/>
        <g id="glints" fill="#fff6dc"></g>
        <g id="boat" fill="#5f6d6f" opacity=".6"><path d="M0 0 L30 0 L26 5 L4 5 Z"/><path d="M13 0 L13 -18 L22 -2 Z" opacity=".8"/></g>
      </g>

      <g id="near">
        <!-- the parapet runs the whole width; its top face, then the face toward us -->
        <path d="M-200 700 L1640 694 L1640 742 L-200 748 Z" fill="url(#pTop)"/>
        <path d="M-200 700 L1640 694 L1640 742 L-200 748 Z" fill="#000" filter="url(#concrete)" opacity=".35"/>
        <path d="M-200 700 L1640 694 L1640 698 L-200 704 Z" fill="#fbf0d8" opacity=".85"/>
        <path d="M-200 748 L1640 742 L1640 1100 L-200 1100 Z" fill="url(#pFace)"/>
        <path d="M-200 748 L1640 742 L1640 1100 L-200 1100 Z" fill="#000" filter="url(#concrete)" opacity=".4"/>
        <path d="M-200 748 L1640 742" stroke="#e9dcc2" stroke-width="2" opacity=".6"/>
        <path d="M402 746 L398 1100 M1302 742 L1306 1100" stroke="#5a5144" stroke-width="2" opacity=".5"/>
        <g id="streaks" opacity=".5"></g>
        <rect x="-200" y="746" width="1840" height="40" fill="url(#lip)"/>

        <!-- a cutting chai beside him -->
        <g transform="translate(1186 690)">
          <ellipse cx="0" cy="26" rx="26" ry="5" fill="#7a6c58" opacity=".35"/>
          <path d="M-15 -14 L-11 24 Q0 27 11 24 L15 -14 Z" fill="#a8693a" opacity=".9"/>
          <path d="M-15 -14 L-14.2 -4 Q0 -1 14.2 -4 L15 -14 Z" fill="#e8ded0" opacity=".5"/>
          <ellipse cx="0" cy="-4" rx="14.2" ry="2.6" fill="#d9a674"/>
          <path d="M-15 -14 L-11 24 M15 -14 L11 24" stroke="#fff" stroke-width="1.2" opacity=".7"/>
          <ellipse cx="0" cy="-14" rx="15" ry="3" fill="none" stroke="#fff" stroke-width="1.2" opacity=".8"/>
          <path d="M-6 -12 L-5 22 M0 -11 L0 24 M6 -12 L5 22" stroke="#fff" stroke-width=".8" opacity=".35"/>
        </g>

        <!-- Mohit -->
        <g id="fig">
          <!-- his shadow on the parapet top, thrown toward us by the sun over the sea -->
          <path d="M800 728 C860 744 1020 744 1086 728 L1110 748 L776 748 Z" fill="#5e5242" opacity=".35" filter="url(#soft)"/>
          <!-- forearms and hands on the parapet -->
          <path id="foreL" fill="url(#skinArmL)"/>
          <path id="handL" fill="#93603f"/>
          <path id="foreR" fill="url(#skinArmR)"/>
          <path id="handR" fill="#875736"/>
          <path id="foreRim" fill="none" stroke="#f2b583" stroke-width="2" opacity=".8" filter="url(#rim)"/>
          <!-- torso -->
          <path id="torso" fill="url(#shirt)"/>
          <g clip-path="url(#torsoClip)">
            <rect x="700" y="360" width="480" height="420" fill="url(#pin)"/>
            <ellipse cx="942" cy="560" rx="90" ry="150" fill="#a69fbf" opacity=".22" filter="url(#soft)"/>
            <rect x="700" y="360" width="480" height="420" fill="url(#shirtGlow)"/>
            <path id="folds" fill="none" stroke="#a199b8" stroke-linecap="round" filter="url(#rim)"/>
            <path id="foldLight" fill="none" stroke="#fff7e8" stroke-linecap="round" opacity=".5" filter="url(#rim)"/>
            <path id="billow" fill="#fff5e6" opacity=".14" filter="url(#soft)"/>
            <path id="yoke" fill="none" stroke="#a69fbd" stroke-width="1.3" opacity=".75"/>
            <path d="M942 432 L942 462 M936 432 L936 458 M948 432 L948 458" stroke="#a69fbd" stroke-width="1" opacity=".6"/>
            <path d="M800 736 C860 722 1020 722 1086 734" stroke="#8d86a6" stroke-width="10" opacity=".25" filter="url(#soft)" fill="none"/>
          </g>
          <path id="torsoRim" fill="none" stroke="#fff3da" stroke-width="3" filter="url(#rim)" opacity=".95"/>
          <!-- sleeves, rolled to the elbow -->
          <path id="armL" fill="url(#shirt)"/>
          <g clip-path="url(#armLClip)"><rect x="700" y="400" width="200" height="260" fill="url(#pin)" transform="rotate(6 800 520)"/><rect x="700" y="400" width="200" height="260" fill="url(#shirtGlow)"/><path d="M838 506 C830 540 826 570 826 596" stroke="#9f98b6" stroke-width="5" fill="none" opacity=".45" filter="url(#rim)"/></g>
          <path id="cuffL" fill="#e6e2ee"/>
          <path id="cuffLp" fill="url(#pinH)"/>
          <path id="armR" fill="url(#shirt)"/>
          <g clip-path="url(#armRClip)"><rect x="984" y="400" width="200" height="260" fill="url(#pin)" transform="rotate(-6 1084 520)"/><rect x="984" y="400" width="200" height="260" fill="url(#shirtGlow)"/><path d="M1046 506 C1054 540 1058 570 1058 596" stroke="#9f98b6" stroke-width="5" fill="none" opacity=".45" filter="url(#rim)"/></g>
          <path id="cuffR" fill="#dcd7e6"/>
          <path id="cuffRp" fill="url(#pinH)"/>
          <path id="armRim" fill="none" stroke="#fff3da" stroke-width="2.8" filter="url(#rim)" opacity=".9"/>
          <!-- neck -->
          <path d="M910 404 C908 380 906 362 906 346 L982 346 C982 362 980 380 978 404 Z" fill="url(#skin)"/>
          <path d="M906 348 C905 368 907 388 910 404" stroke="#e6a575" stroke-width="2.6" fill="none" opacity=".7" filter="url(#rim)"/>
          <path d="M920 372 C934 378 954 378 970 372" stroke="#6e432c" stroke-width="2" fill="none" opacity=".35" filter="url(#rim)"/>
          <!-- collar -->
          <path id="collar" fill="#e6e2ee"/>
          <path id="collarEdge" fill="none" stroke="#fff6e4" stroke-width="2" opacity=".85"/>
          <!-- cheek and jaw beyond the ear: he has turned a little toward the city -->
          <path d="M898 268 C884 274 876 292 876 312 C876 330 884 346 900 354 L912 350 L908 272 Z" fill="#94603f"/>
          <path d="M898 268 C884 274 876 292 876 312 C876 330 884 346 900 354" fill="none" stroke="#f0b27e" stroke-width="2.2" opacity=".9" filter="url(#rim)"/>
          <!-- glasses: the edge of the frame and the temple -->
          <path d="M877 279 C872 288 872 304 877 312" stroke="#38343a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M876 282 C873 290 873 302 876 309" stroke="#f3eee6" stroke-width="1" fill="none" opacity=".55"/>
          <!-- head and hair -->
          <path id="head" d="M916 344 C902 328 893 300 894 270 C896 240 916 220 946 218 C976 218 996 238 998 268 C1000 300 991 328 976 344 C958 350 934 350 916 344 Z" fill="#16120e"/>
          <path id="hairTop" fill="#16120e"/>
          <g fill="none" stroke-linecap="round" id="strands"></g>
          <path id="hairRim" fill="none" stroke="#c9a57c" stroke-width="2.2" opacity=".85" filter="url(#rim)"/>
          <!-- nape: hair fades into skin -->
          <path d="M916 342 C934 350 958 350 976 342 L974 352 C958 358 934 358 918 352 Z" fill="#4a3222" opacity=".75"/>
          <!-- ear, the sun comes through it -->
          <path d="M900 280 C890 280 885 294 886 306 C887 318 893 328 902 330 C905 316 905 294 900 280 Z" fill="#b5704a"/>
          <path d="M900 280 C890 280 885 294 886 306 C887 318 893 328 902 330" fill="none" stroke="#ff9d66" stroke-width="2.4" opacity=".9" filter="url(#rim)"/>
          <path d="M897 291 C893 298 893 310 897 317" stroke="#7a4630" stroke-width="1.3" fill="none" opacity=".7"/>
          <path d="M878 288 L902 290" stroke="#2d2a2c" stroke-width="2.6" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    <svg class="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .22 0"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg>
    <div class="copy">
      <h1>One year in,<br><em>here's what I shipped</em></h1>
      <p class="line">An LLM gateway that replaced OpenRouter. A terminal tool 500+ developers open daily. A live auction SaaS I built alone.</p>
      <p class="aside" id="aside">9.45 CGPA taught me less than shipping did. Still early. Still building.</p>
    </div>
  </div>
</div>
<!-- direction: Promenade 05, Mohit on the parapet, wind in his shirt -->
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), range=(p,a,b)=>clamp((p-a)/(b-a),0,1);
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  let seed=3; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); p&&p.appendChild(e); return e;};
  const f=n=>n.toFixed(1);

  // far shore
  const hill=$('hill');
  el('path',{d:'M1150 470 C1210 452 1280 430 1340 424 C1390 420 1420 426 1440 432 L1440 470 Z',fill:'#a3ada8'},hill);
  for(let x=1120;x<1440;){ const w=6+rnd()*12, base= x<1200?470: 470-(Math.min(x,1340)-1200)/140*40; const h=6+rnd()*(rnd()<.3?40:16);
    el('rect',{x,y:base-h,width:w,height:h+2,fill:'#9aa5a2',opacity:(.5+rnd()*.4).toFixed(2)},hill); x+=w+rnd()*5; }
  for(let x=0;x<1120;){ const w=8+rnd()*14, h=2+rnd()*5; el('rect',{x,y:470-h,width:w,height:h,fill:'#a8aea6',opacity:(.25+x/1120*.4).toFixed(2)},hill); x+=w+1+rnd()*3; }

  { const sg=$('streaks'); for(let i=0;i<34;i++){ const x=rnd()*1440, l=30+rnd()*120; el('rect',{x:f(x),y:f(748+rnd()*4),width:f(1.5+rnd()*5),height:f(l),fill:'url(#drip)',opacity:(.2+rnd()*.3).toFixed(2)},sg);} }
  // glints
  const gl=[]; for(let i=0;i<130;i++){ const y=474+Math.pow(rnd(),1.5)*230, n=(y-470)/230; const x=1010+(rnd()-.5)*(200+n*700);
    const r=el('rect',{x:f(x),y:f(y),width:f(3+n*24*rnd()),height:f(.8+n*1.4)},$('glints')); gl.push({r,b:.2+.75*Math.max(0,1-Math.abs(x-1010)/(160+n*320)),ph:rnd()*6.28,sp:.5+rnd()}); }

  // ---- the figure, rebuilt each frame so the wind can move the cloth ----
  const P={};
  ['billow','foreRim','torso','torsoRim','folds','foldLight','yoke','armL','armR','cuffL','cuffR','cuffLp','cuffRp','armRim','foreL','foreR','handL','handR','collar','collarEdge','hairTop','hairRim','torsoClipPath','armLClipPath','armRClipPath'].forEach(id=>P[id]=$(id));
  const strands=[]; { const sg=$('strands');
    for(let i=0;i<16;i++){ const u=i/15; const x0=918+u*56+(rnd()-.5)*6, y0=338-Math.sin(u*Math.PI)*6; const x1=914+u*66+(rnd()-.5)*10, y1=214+Math.abs(u-.5)*20;
      const pth=el('path',{stroke: i%3? '#2a221b':'#4a3a2b','stroke-width':(.7+rnd()*.7).toFixed(1),opacity:(.12+rnd()*.14).toFixed(2)},sg); pth.x0=+f(x0); pth.y0=+f(y0); pth.x1=+f(x1); pth.y1=+f(y1); pth.dx=x1-x0; strands.push(pth);} }
  function drawFigure(t){
    const g = Math.sin(t*1.7)*.6 + Math.sin(t*2.9+1)*.3 + Math.sin(t*.6)*.5;  // gusts off the sea
    const g2 = Math.sin(t*3.6+.4);
    const b = 5 + g*4, sl = g2*1.8;
    // sloped shoulders, back tapering to the waist, the hem spreading on the parapet
    const torso = `M912 398 C880 404 846 418 822 436 C806 448 800 462 800 476 C808 540 820 600 ${830-sl} 660 C${824-b*.3} 694 ${816-b*.7} 716 ${804-b} 736 L${1080+b} 734 C${1068+b*.7} 714 ${1056+b*.3} 692 ${1054+sl} 660 C1064 600 1076 540 1084 476 C1084 462 1078 448 1062 436 C1038 418 1004 404 976 398 C960 404 928 404 912 398 Z`;
    P.torso.setAttribute('d',torso); P.torsoClipPath.setAttribute('d',torso);
    P.torsoRim.setAttribute('d',`M912 398 C880 404 846 418 822 436 C806 448 800 462 800 476 M976 398 C1004 404 1038 418 1062 436 C1078 448 1084 462 1084 476`);
    const w = g*3;
    P.folds.setAttribute('d',`M858 480 C872 550 ${878+w} 620 ${870+w} 712 M1026 480 C1012 550 ${1006-w} 620 ${1014-w} 712 M${880} 690 C${910} ${682-w} ${974} ${682-w} ${1004} 690`);
    P.folds.setAttribute('stroke-width',(4+g*.8).toFixed(2)); P.folds.setAttribute('opacity','.4');
    P.foldLight.setAttribute('d',`M868 484 C882 552 ${890+w} 620 ${884+w} 708 M1016 484 C1002 552 ${994-w} 620 ${1000-w} 708`);
    P.foldLight.setAttribute('stroke-width','3');
    P.billow.setAttribute('d',`M${900+w*2} 600 C${930+w*2} ${580-b} ${970+w*2} ${580-b} ${990+w*2} 610 C${970+w*2} ${640+b} ${920+w*2} ${640+b} ${900+w*2} 600 Z`);
    P.yoke.setAttribute('d','M808 460 C860 474 1024 474 1076 460');
    // sleeves
    const fl = g2*1.4;
    const armL=`M822 436 C804 444 794 460 792 480 C786 520 780 556 776 590 L${828+fl} 596 C828 566 832 536 838 506 C840 488 838 470 832 458 Z`;
    const armR=`M1062 436 C1080 444 1090 460 1092 480 C1098 520 1104 556 1108 590 L${1056-fl} 596 C1056 566 1052 536 1046 506 C1044 488 1046 470 1052 458 Z`;
    P.armL.setAttribute('d',armL); P.armLClipPath.setAttribute('d',armL);
    P.armR.setAttribute('d',armR); P.armRClipPath.setAttribute('d',armR);
    const cuffL=`M772 584 C786 578 812 578 ${830+fl} 588 L${829+fl} 610 C814 604 790 604 773 608 Z`;
    const cuffR=`M1112 584 C1098 578 1072 578 ${1054-fl} 588 L${1055-fl} 610 C1070 604 1094 604 1111 608 Z`;
    P.cuffL.setAttribute('d',cuffL); P.cuffLp.setAttribute('d',cuffL); P.cuffR.setAttribute('d',cuffR); P.cuffRp.setAttribute('d',cuffR);
    P.armRim.setAttribute('d','M822 436 C804 444 794 460 792 480 C789 500 787 516 785 530 M1062 436 C1080 444 1090 460 1092 480 C1095 500 1097 516 1099 530');
    // forearms angle out to the hands, wrists bent, palms on the stone
    P.foreL.setAttribute('d','M776 606 C772 632 764 662 756 692 L784 698 C790 670 806 638 826 608 Z');
    P.handL.setAttribute('d','M752 688 C742 694 738 704 742 712 C756 718 778 718 792 712 C794 704 790 696 784 692 Z');
    P.foreR.setAttribute('d','M1108 606 C1112 632 1120 662 1128 692 L1100 698 C1094 670 1078 638 1058 608 Z');
    P.handR.setAttribute('d','M1132 688 C1142 694 1146 704 1142 712 C1128 718 1106 718 1092 712 C1090 704 1094 696 1100 692 Z');
    P.foreRim.setAttribute('d','M776 606 C772 632 764 662 756 692 M1108 606 C1112 632 1120 662 1128 692');
    const c = g*2.5;
    P.collar.setAttribute('d',`M906 410 C904 398 908 386 ${918} ${378-c*.5} C934 372 958 372 ${972} ${378-c*.3} C980 386 984 398 982 410 C962 402 926 402 906 410 Z`);
    P.collarEdge.setAttribute('d',`M${918} ${378-c*.5} C934 372 958 372 ${972} ${378-c*.3}`);
    // hair swept up at the front; from behind we see it rise above the crown, lifting in the gusts
    const h = g*2.6, h2 = g2*1.2;
    const hair=`M894 270 C894 248 906 230 ${922+h2} ${218-h*.6} C${930} ${208-h} ${942+h2} ${205-h*1.2} ${954} ${208-h} C${966+h2} ${204-h} ${980} ${209-h*.8} ${988} ${219-h*.5} C998 230 1002 250 998 270 C980 256 914 256 894 270 Z`;
    P.hairTop.setAttribute('d',hair);
    P.hairRim.setAttribute('d',`M894 270 C894 248 906 230 ${922+h2} ${218-h*.6} C${930} ${208-h} ${942+h2} ${205-h*1.2} ${954} ${208-h} C${966+h2} ${204-h} ${980} ${209-h*.8} ${988} ${219-h*.5} C998 230 1002 250 998 270 C1000 300 991 328 976 344`);
    strands.forEach((s,i)=>{ const sw=Math.sin(t*2+i)*1.2 + g*1.5; s.setAttribute('d',`M${s.x0} ${s.y0} C${s.x0+s.dx*.2 - (s.x0-946)*.25} ${s.y0-50} ${s.x1+(s.x1-946)*.35+sw*.5} ${s.y1+40} ${s.x1+sw} ${s.y1-h*.6}`); });
  }

  function frame(){ const sc=$('scene'), ar=innerWidth/innerHeight;
    if(ar<.9){ const w=720, h=w/ar; sc.setAttribute('viewBox',`${940-w/2} ${200-.47*h} ${w} ${h}`); } else sc.setAttribute('viewBox','0 0 1440 900'); }
  frame(); addEventListener('resize',frame);

  const scr=$('scroller'); let target=0,cur=0;
  const read=()=>{const r=scr.getBoundingClientRect(); target=clamp(-r.top/(r.height-innerHeight),0,1);};
  addEventListener('scroll',read,{passive:true}); read(); cur=target;
  const bg=$('bg'), near=$('near'), boat=$('boat'), aside=$('aside'); const t0=performance.now();
  function tick(now){
    cur+=(target-cur)*.08; const p=cur, t=reduce?0:(now-t0)/1000;
    // we walk up behind him: near layers grow faster than the sea
    const d=ease(range(p,.05,.85));
    near.setAttribute('transform',`translate(940 720) scale(${(1+d*.2).toFixed(4)}) translate(-940 -720)`);
    bg.setAttribute('transform',`translate(940 470) scale(${(1+d*.05).toFixed(4)}) translate(-940 -470)`);
    drawFigure(t);
    for(const g of gl) g.r.setAttribute('opacity',(g.b*(.5+.5*Math.sin(t*g.sp+g.ph))).toFixed(3));
    const bx=((200+t*4)%1600)-80; boat.setAttribute('transform',`translate(${f(bx)} 470)`);
    const a=range(p,.78,.94); aside.style.opacity=a.toFixed(3); aside.style.transform=`translateY(${(1-a)*12}px)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
