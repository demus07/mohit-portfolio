<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const rays = document.getElementById("rays");
  for (let i = 0; i < 36; i++) {
    const a0 = (i / 36) * Math.PI * 2, a1 = a0 + Math.PI / 72;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M0,0 L${Math.cos(a0) * 1100},${Math.sin(a0) * 1100} L${Math.cos(a1) * 1100},${Math.sin(a1) * 1100} Z`);
    p.setAttribute("fill", "#fff3d6");
    rays.appendChild(p);
  }
  const sc = document.getElementById("scallop");
  for (let x = -400; x < 1300; x += 40) {
    const c = document.createElementNS(NS, "path");
    c.setAttribute("d", `M${x},96 A20,20 0 0 0 ${x + 40},96 Z`);
    sc.appendChild(c);
  }
  const cols = document.getElementById("cols");
  [110, 456, 812].forEach(x => {
    cols.insertAdjacentHTML("beforeend",
      `<rect x="${x - 13}" y="96" width="26" height="640"/>
       <rect x="${x - 24}" y="96" width="48" height="12"/><rect x="${x - 19}" y="108" width="38" height="10"/>
       <rect x="${x - 24}" y="724" width="48" height="12"/>
       <rect x="${x - 4}" y="130" width="3" height="580" fill="#3e7259"/>`);
  });

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const track = document.getElementById("track");
  const far = document.getElementById("far"), mid = document.getElementById("mid"), near = document.getElementById("near");
  const note = document.getElementById("note"), hint = document.getElementById("hint"), glint = document.getElementById("glint");
  const W = { x: 545, y: 487 };
  let target = 0, cur = 0, t0 = performance.now();
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function progress() {
    const r = track.getBoundingClientRect();
    return Math.min(1, Math.max(0, -r.top / (track.offsetHeight - innerHeight)));
  }
  function setT(g, s, cx, cy) { g.setAttribute("transform", `translate(450 450) scale(${s}) translate(${-cx} ${-cy})`); }
  function frame(now) {
    target = progress();
    cur += (target - cur) * (reduce ? 1 : .12);
    const z = ease(Math.min(1, cur / .78));
    const S = innerWidth < 700 ? 4.1 : 4.9;
    const cx = 450 + (W.x - 450) * z, cy = 450 + (W.y - 450) * z;
    setT(mid, 1 + (S - 1) * z, cx, cy);
    setT(far, 1 + (S - 1) * z * .28, 450 + (W.x - 450) * z * .5, 450 + (W.y - 450) * z * .5);
    setT(near, 1 + (S * 1.7 - 1) * z, cx, cy);
    const n = Math.min(1, Math.max(0, (cur - .8) / .15));
    note.style.opacity = n; note.style.transform = `translateY(${16 * (1 - n)}px)`;
    hint.style.opacity = 1 - Math.min(1, cur * 6);
    if (!reduce) {
      const t = (now - t0) / 1000;
      rays.setAttribute("transform", `rotate(${t * 1.2})`);
      glint.setAttribute("transform", `translate(${((t * 26) % 520) - 60} 0)`);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
