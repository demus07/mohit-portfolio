<script>/* collage kit: seeded randomness and torn-paper edges */
const KIT = (() => {
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  // torn rectangle path: edges listed in `sides` are torn, others straight
  function torn(x, y, w, h, o = {}) {
    const amp = o.amp ?? 3, step = o.step ?? 9, r = rng(o.seed ?? 7), sides = o.sides ?? "tblr";
    const pts = [];
    const edge = (x0, y0, x1, y1, t, nx, ny) => {
      const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(len / step));
      for (let i = 0; i < n; i++) {
        const f = i / n, j = t ? (r() - .5) * 2 * amp + (r() < .12 ? amp * 1.6 : 0) : 0;
        pts.push([x0 + (x1 - x0) * f + nx * j, y0 + (y1 - y0) * f + ny * j]);
      }
    };
    edge(x, y, x + w, y, sides.includes("t"), 0, 1);
    edge(x + w, y, x + w, y + h, sides.includes("r"), -1, 0);
    edge(x + w, y + h, x, y + h, sides.includes("b"), 0, -1);
    edge(x, y + h, x, y, sides.includes("l"), 1, 0);
    return "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
  }
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { rng, torn, clamp, seg, ease, reduce };
})();
</script>

  <path d="${torn(-20, 716, 1480, 200, { amp: 2, step: 12, seed: 41, sides: "t" })}" fill="#bdb6a8"/>
  <rect x="-20" y="730" width="1480" height="190" fill="url(#dG)" opacity=".45"/>
  <path d="${torn(-20, 700, 1480, 22, { amp: 1.6, step: 10, seed: 42, sides: "b" })}" fill="#f2c230"/>
  <rect x="-20" y="700" width="1480" height="22" fill="url(#dO)" opacity=".25"/>`;

// columns (in front of the rake), with knee braces under the canopy
$("columns").innerHTML = COLS.map(x => `
  <rect x="${x}" y="350" width="15" height="380" fill="#2f5a44"/>
  <rect x="${x}" y="350" width="5" height="380" fill="#3f7457"/>
  <path d="M${x - 34},354 L${x},354 L${x},392 Z M${x + 15},354 L${x + 49},354 L${x + 15},392 Z" fill="#24483a"/>
  <rect x="${x - 6}" y="724" width="27" height="10" fill="#24483a"/>`).join("");

// station board fragment: yellow, Marathi over English, torn at the bottom, taped
$("board").innerHTML = `
  <line x1="400" y1="352" x2="400" y2="376" stroke="#24483a" stroke-width="3"/><line x1="540" y1="352" x2="540" y2="376" stroke="#24483a" stroke-width="3"/>
  <path d="${torn(372, 372, 196, 74, { amp: 2.4, step: 8, seed: 51, sides: "b" })}" fill="#f5c62c"/>
  <path d="${torn(372, 372, 196, 74, { amp: 2.4, step: 8, seed: 51, sides: "b" })}" fill="url(#dO)" opacity=".18"/>
  <text x="470" y="404" text-anchor="middle" font-family="Tiro Devanagari Marathi" font-size="27" fill="#141414">चर्चगेट</text>
  <text x="470" y="434" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="22" style="font-variation-settings:'wdth' 72" letter-spacing="1.5" fill="#141414">CHURCHGATE</text>
  <rect x="520" y="362" width="58" height="18" fill="rgb(238 228 200 / .78)" transform="rotate(14 549 371)"/>`;

/* ---------- camera ---------- */
const world = $("world"), stage = $("stage"), intro = $("intro"), note = $("note"), ticket = $("ticket"), ring = $("ring"), glass = $("glass"), arrowPath = $("arrowPath");
const WIN = { x: 647.5, y: 515, w: 105 };
let W, H, cam0, cam1, phone;
function layout() {
  W = stage.clientWidth; H = stage.clientHeight; phone = W < 720;
  const s0 = Math.max(W / 1440, H / 900);
  let x0 = (W - 1440 * s0) / 2 + WIN.x * s0, y0 = (H - 900 * s0) / 2 + WIN.y * s0;
  if (phone) { x0 = W * .5; y0 = (H - 900 * s0) * .5 + WIN.y * s0; }
  cam0 = { s: s0, x: x0, y: y0 };
  const s1 = phone ? W * .86 / WIN.w : Math.min(W * .33, H * .66 * 105 / 74) / WIN.w;
  cam1 = { s: s1, x: phone ? W * .5 : W * .64, y: phone ? H * .6 : H * .5 };
  frame();
}
function cam(k) {
  const s = cam0.s * Math.pow(cam1.s / cam0.s, k);
  const x = cam0.x + (cam1.x - cam0.x) * k, y = cam0.y + (cam1.y - cam0.y) * k;
  let tx = x - WIN.x * s, ty = y - WIN.y * s;
  if (k === 0 && !phone) { tx = Math.min(0, Math.max(W - 1440 * s, tx)); }
  if (phone) tx = Math.min(0, Math.max(W - 1440 * s, tx)) * (1 - k) + tx * k;
  world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  return { s, tx, ty };
}
let arrowLen = 0;
function frame() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = KIT.reduce ? 1 : (max > 0 ? scrollY / max : 0);
  const k = KIT.ease(KIT.seg(p, .06, .72));
  const c = cam(k);
  const t = KIT.seg(p, .04, .2);
  intro.style.opacity = KIT.reduce ? 1 : 1 - t;
  intro.style.transform = `translateY(${-30 * t}px)`;
  ticket.style.transform = `translateY(${k * 520}px) rotate(${-7 - k * 8}deg)`;
  ring.style.transform = `translateY(${k * 560}px)`;
  glass.style.opacity = 1 - .94 * KIT.ease(KIT.seg(p, .42, .8));
  const n = KIT.ease(KIT.seg(p, .78, .9));
  note.style.transform = phone
    ? `translate(0,${(-160 + 160 * n)}%) rotate(-2deg)`
    : `translate(${-140 + 140 * n}%,-50%) rotate(${-3 + n * 1}deg)`;
  // marker arrow from the note to his face
  const a = KIT.seg(p, .86, .97);
  if (a > 0) {
    const r = note.getBoundingClientRect();
    const fx = c.tx + 612 * c.s, fy = c.ty + 500 * c.s;
    let d;
    if (phone) { const sx = r.left + r.width * .7, sy = r.bottom + 10; d = `M${sx},${sy} C${sx + 30},${sy + 50} ${fx + 40},${fy - 80} ${fx + 10},${fy - 40}`; }
    else { const sx = r.right + 14, sy = r.top + r.height * .35; d = `M${sx},${sy} C${sx + 90},${sy - 70} ${fx - 120},${fy - 140} ${fx - 40},${fy - 52} m-2,2 l-4,-24 m4,24 l-22,-8`; }
    if (arrowPath.getAttribute("d") !== d) { arrowPath.setAttribute("d", d); arrowLen = arrowPath.getTotalLength(); arrowPath.style.strokeDasharray = arrowLen; }
    arrowPath.style.strokeDashoffset = arrowLen * (1 - a);
    arrowPath.style.opacity = 1;
  } else arrowPath.style.opacity = 0;
}
let raf = 0;
addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; frame(); }); }, { passive: true });
addEventListener("resize", layout);
document.fonts && document.fonts.ready.then(layout);
layout();
</script>
