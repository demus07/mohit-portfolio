h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(56px,7vw,120px);line-height:.9;letter-spacing:-.01em;margin:0 0 .34em}
.line{font-size:clamp(16px,1.18vw,19px);line-height:1.6;max-width:40ch;margin:0 0 1.5em;color:rgba(29,35,64,.86)}
.cta{font-size:clamp(16px,1.18vw,19px);font-weight:500;color:#7a2f3a;text-decoration:none;display:inline-flex;gap:.5em;align-items:baseline;padding-bottom:3px;background:linear-gradient(currentColor,currentColor) 0 100%/0% 1.5px no-repeat;transition:background-size .5s cubic-bezier(.2,.7,.2,1)}
.cta span{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.cta:hover{background-size:100% 1.5px}.cta:hover span{transform:translateX(6px)}
.note{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:clamp(24px,2vw,32px);line-height:1.25;max-width:19ch;margin:2em 0 0;opacity:0;transform:translateY(14px)}
@media (max-width:700px){
  .copy{left:20px;right:20px;top:26px;width:auto}
  h1{font-size:54px}
  .line{font-size:16px;margin-bottom:1em}
  .note{font-size:22px;margin-top:.9em;max-width:26ch}
}
</style>
</head>

<script>
(() => {
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.getElementById('world'), track=document.getElementById('track'), note=document.getElementById('note');
  const clouds=document.getElementById('clouds'), flock=document.getElementById('flock'), tail=document.getElementById('kiteTail'), kite=document.getElementById('kite'), bob=document.getElementById('bob');
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t, seg=(p,a,b)=>clamp((p-a)/(b-a));
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

  // droppers under the sagging messenger wire
  const msg=x=> x<60 ? -640 : x>1370 ? -640 : (()=>{const t=(x-60)/1310;return (1-t)*(1-t)*-640+2*(1-t)*t*-500+t*t*-640;})();
  let d=''; for(let x=110;x<1340;x+=78) d+=`M${x},${msg(x).toFixed(1)} V-430 `;
  document.getElementById('droppers').setAttribute('d',d);
  let fd=''; for(let x=-140;x<1640;x+=90){const t=(x+200)/1840; const y=(1-t)*(1-t)*-880+2*(1-t)*t*-640+t*t*-880; fd+=`M${x},${y.toFixed(1)} V-800 `;}
  document.getElementById('farDroppers').setAttribute('d',fd);

  document.querySelectorAll('#pigeons [data-x]').forEach(g=>{const x=+g.dataset.x;g.dataset.y=(msg(x+16)-12).toFixed(1);g.setAttribute('transform',`translate(${x} ${g.dataset.y})${g.dataset.flip?' scale(-1 1)':''}`);});
  // flock: crows drifting across, wrapping off-frame
  const birds=Array.from({length:7},(_,i)=>{const p=document.createElementNS(NS,'path');flock.appendChild(p);return {p,x:-300+i*70+Math.random()*60,y:-760+Math.random()*60+i*6,s:.6+Math.random()*.6,ph:Math.random()*6};});

  const CAM={
    wide:{x:720,y:-800,w:1440,fx:.5,fy:.5},
    close:{x:1000,y:4,w:700,fx:.64,fy:.56},
    wideP:{x:820,y:-760,w:760,fx:.5,fy:.5},
    closeP:{x:1000,y:4,w:420,fx:.5,fy:.72}
  };
  function camera(t){
    const ph=innerWidth<700, A=ph?CAM.wideP:CAM.wide, B=ph?CAM.closeP:CAM.close;
    const w=Math.exp(lerp(Math.log(A.w),Math.log(B.w),t)), h=w*innerHeight/innerWidth;
    return [lerp(A.x,B.x,t)-lerp(A.fx,B.fx,t)*w, lerp(A.y,B.y,t)-lerp(A.fy,B.fy,t)*h, w, h];
  }

  let sp=null, last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    const r=track.getBoundingClientRect(), p=clamp(-r.top/(r.height-innerHeight));
    sp = sp===null||rm ? p : sp+(p-sp)*Math.min(1,dt*6);
    const t=ease(seg(sp,.03,.8));
    const vb=camera(t); svg.setAttribute('viewBox',vb.map(v=>v.toFixed(2)).join(' '));
    // sky is far: it moves less than the wires as the camera tilts
    const cy0=camera(0)[1];
    clouds.setAttribute('transform',`translate(0 ${((vb[1]-cy0)*.55).toFixed(1)})`);
    flock.setAttribute('transform',`translate(0 ${((vb[1]-cy0)*.4).toFixed(1)})`);
    const n=seg(sp,.84,.97); note.style.opacity=n; note.style.transform=`translateY(${(1-n)*14}px)`;
    const T=rm?0:now/1000;
    birds.forEach(b=>{ if(!rm){b.x+=dt*(26+b.s*18); if(b.x>1800) b.x=-400;}
      const f=Math.sin(T*5*b.s+b.ph)*6*b.s, w=12*b.s;
      b.p.setAttribute('d',`M${(b.x-w).toFixed(1)},${(b.y+f*.4).toFixed(1)} Q${(b.x-w/2).toFixed(1)},${(b.y-f).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)} Q${(b.x+w/2).toFixed(1)},${(b.y-f).toFixed(1)} ${(b.x+w).toFixed(1)},${(b.y+f*.4).toFixed(1)}`);});
    const s1=Math.sin(T*1.7)*14, s2=Math.sin(T*1.7+1.3)*20;
    tail.setAttribute('d',`M0,96 C${(10+s1*.5).toFixed(1)},130 ${(-12+s1).toFixed(1)},160 ${(4+s2).toFixed(1)},200`);
    kite.setAttribute('transform',`translate(960 -800) rotate(${(Math.sin(T*.9)*4).toFixed(2)})`);
    bob.setAttribute('transform',`translate(1316 ${(+bob.dataset.y+Math.max(0,Math.sin(T*2.3))*-2).toFixed(1)})`);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
