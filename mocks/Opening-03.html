<!-- Direction 03: Inside the coach — we sit across the aisle from him; his profile is silhouetted against the window with Churchgate soft beyond, grab straps sway in the foreground, and scrolling racks focus from the straps to him. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohit Bagri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1c2330;color:#efe8da}
  body{font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .intro{position:relative;height:420vh}
  .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#1c2330}
  .scene{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
  .scene > svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  #bg{filter:blur(6px) saturate(1.05)}
  #midBlur{filter:blur(9px)}
  .strap{position:absolute;top:-14px;transform-origin:50% 0;will-change:transform}
  .strap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .strap .soft{filter:blur(10px);opacity:0}
  #barSharp,#barSoft{position:absolute;left:-20px;right:-20px;top:-18px;height:60px}
  #barSoft{filter:blur(10px);opacity:0}
  .grain{position:absolute;inset:-50%;pointer-events:none;opacity:.2;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:g 1.2s steps(4) infinite}
  @keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-2%,3%)}50%{transform:translate(3%,-1%)}75%{transform:translate(-1%,-2%)}}
  .copy{position:absolute;z-index:5;left:clamp(24px,5.4vw,92px);top:clamp(40px,14vh,150px);width:min(24rem,30vw)}
  h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(3.2rem,6.6vw,6.6rem);line-height:.9;letter-spacing:-.015em;color:#f3ecdf;text-wrap:balance}
  .slot{position:relative;margin-top:1.5rem;min-height:7.2em}
  .line{font-size:clamp(1rem,1.12vw,1.1rem);line-height:1.55;color:#c9c3b8;max-width:20rem}
  .note{position:absolute;inset:0;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:clamp(1.45rem,1.9vw,1.85rem);line-height:1.22;color:#f3ecdf;opacity:0}
  .cta{display:inline-flex;gap:.5em;font-size:1.05rem;font-weight:500;color:#f2c58a;text-decoration:none;padding-bottom:3px;
    background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s cubic-bezier(.2,.7,.2,1)}
  .cta span{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .cta:hover,.cta:focus-visible{background-size:100% 1px}
  .cta:hover span,.cta:focus-visible span{transform:translateX(5px)}
  @media (max-width:720px){
    .copy{left:20px;right:20px;top:26px;width:auto}
    h1{font-size:clamp(2.8rem,13vw,3.6rem)}
    .slot{margin-top:1rem;min-height:6.4em}
  }
  @media (prefers-reduced-motion:reduce){.grain{animation:none}}
</style>
</head>
<body>
<!-- direction: 03 inside the coach -->
<section class="intro" id="intro">
  <div class="stage">
    <div class="scene" id="scene">
      <!-- BEYOND THE GLASS: Churchgate platform in daylight, always soft -->
      <svg id="bg" viewBox="0 0 1440 900" aria-hidden="true">
        <defs>
          <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbf4e4"/><stop offset=".5" stop-color="#f2e7cf"/><stop offset="1" stop-color="#d9cfb8"/>
          </linearGradient>
        </defs>
        <rect x="400" y="100" width="1100" height="600" fill="url(#day)"/>
        <!-- canopy underside and its edge -->
        <path d="M400,100 L1500,100 L1500,214 L400,236 Z" fill="#6b7a74"/>
        <path d="M400,236 L1500,214 L1500,226 L400,248 Z" fill="#9aa69c"/>
        <!-- green steel columns -->
        <g fill="#3f6b55">
          <rect x="930" y="226" width="22" height="424"/><rect x="918" y="226" width="46" height="16"/>
          <rect x="1180" y="220" width="22" height="440"/><rect x="1168" y="220" width="46" height="16"/>
        </g>
        <!-- hanging station board -->
        <g transform="translate(610 300)">
          <rect x="0" y="0" width="300" height="104" fill="#ecc63a"/>
          <rect x="0" y="0" width="300" height="104" fill="none" stroke="#1d1d1d" stroke-width="5"/>
          <text x="150" y="46" text-anchor="middle" font-family="Noto Sans Devanagari, sans-serif" font-weight="700" font-size="38" fill="#1b1b1b">चर्चगेट</text>
          <text x="150" y="88" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-weight="500" font-size="32" letter-spacing="3" fill="#1b1b1b">CHURCHGATE</text>
          <rect x="60" y="-70" width="4" height="70" fill="#3b3b3b"/><rect x="236" y="-70" width="4" height="70" fill="#3b3b3b"/>
        </g>
        <!-- people on the platform -->
        <g fill="#5b6470">
          <circle cx="960" cy="470" r="17"/><path d="M936,640 C936,560 944,500 960,492 C976,500 986,560 984,640 Z"/>
          <circle cx="1290" cy="456" r="18"/><path d="M1264,640 C1262,550 1272,488 1290,480 C1310,488 1318,550 1316,640 Z" fill="#7f5b59"/>
          <circle cx="1340" cy="476" r="15" fill="#4f5866"/><path d="M1320,640 C1320,570 1326,512 1340,504 C1356,512 1362,570 1360,640 Z" fill="#4f5866"/>
        </g>
        <!-- platform and its yellow edge -->
        <rect x="400" y="600" width="1100" height="100" fill="#bcb3a0"/>
        <rect x="400" y="640" width="1100" height="14" fill="#e8c23a"/>
        <!-- sun spill -->
        <rect x="400" y="100" width="1100" height="600" fill="#fff4dc" opacity=".25"/>
      </svg>

      <!-- MID: the coach wall, the window, Mohit. Two copies: sharp and soft. -->
      <svg id="midSharp" viewBox="0 0 1440 900" aria-hidden="true">
        <defs>
          <linearGradient id="wallG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#232b38"/><stop offset=".45" stop-color="#3a4250"/><stop offset="1" stop-color="#4c5260"/>
          </linearGradient>
          <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a303c"/><stop offset="1" stop-color="#4a505c"/>
          </linearGradient>
          <linearGradient id="seatG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3f6f9c"/><stop offset=".12" stop-color="#2d5680"/><stop offset="1" stop-color="#16263a"/>
          </linearGradient>
          <radialGradient id="spill" cx="960" cy="420" r="640" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffe8c4" stop-opacity=".35"/><stop offset="1" stop-color="#ffe8c4" stop-opacity="0"/>
          </radialGradient>
          <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
            <feMorphology operator="dilate" radius="4"/><feGaussianBlur stdDeviation="10"/>
          </filter>
          <pattern id="pinD" width="7" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
            <line x1="1" y1="0" x2="1" y2="12" stroke="#a79ac0" stroke-width="1" stroke-opacity=".28"/>
          </pattern>
          <!-- Mohit in profile, facing right, chin on his fist -->
          <g id="profile">
            <!-- torso, backlit shirt -->
            <path id="torsoP" d="M138,262 C150,246 176,240 204,242 L246,248 C268,258 284,290 290,340 L306,720 L96,720 C92,560 100,320 138,262 Z"/>
            <path id="headP" d="M190,246 C186,230 176,214 160,202 C140,186 132,150 140,116 C148,82 176,60 214,58 C244,58 262,74 266,98 L270,122 C270,128 268,132 268,136 C274,144 282,152 286,158 C282,162 276,164 270,164 C272,170 274,174 270,178 C273,182 274,186 270,190 C268,196 272,202 270,208 C262,216 250,220 238,222 C236,232 236,240 240,252 Z"/>
            <path id="hairP" d="M140,128 C134,96 150,62 186,48 C200,40 220,38 236,42 C244,36 256,38 262,46 C270,52 272,64 268,78 C266,86 262,94 258,98 C246,88 230,86 214,92 C204,96 198,108 196,120 C186,120 176,128 172,140 L160,176 C148,166 142,148 140,128 Z"/>
            <!-- arm: elbow down at the seat, fist under the chin -->
            <path id="armP" d="M262,262 C258,240 266,220 282,216 C298,212 312,222 312,240 C312,254 306,262 300,266 C304,330 312,380 318,420 C318,440 294,446 284,434 C278,380 270,320 262,262 Z"/>
            <path id="sleeveP" d="M168,262 C190,246 230,250 246,276 L326,410 C332,434 310,450 286,440 L196,330 C184,306 170,286 168,262 Z"/>
          </g>
        </defs>
        <!-- wall and ceiling of the coach -->
        <path fill-rule="evenodd" fill="url(#wallG)" d="M-300,-900 L1800,-900 L1800,1200 L-300,1200 Z M590,150 L1390,150 Q1420,150 1420,180 L1420,612 Q1420,640 1390,640 L590,640 Q560,640 560,612 L560,180 Q560,150 590,150 Z"/>
        <path d="M-300,-900 L1800,-900 L1800,40 C1300,70 600,70 -300,40 Z" fill="url(#ceil)"/>
        <rect x="-300" y="40" width="2100" height="10" fill="#d8e2ea" opacity=".85"/>
        <rect x="-300" y="50" width="2100" height="40" fill="#d8e2ea" opacity=".08"/>
        <!-- luggage rack -->
        <rect x="-300" y="108" width="2100" height="6" fill="#8b929c"/>
        <rect x="-300" y="122" width="2100" height="3" fill="#6f7782"/>
        <!-- window gasket -->
        <rect x="560" y="150" width="860" height="490" rx="30" fill="none" stroke="#151a22" stroke-width="10"/>
        <rect x="550" y="140" width="880" height="510" rx="38" fill="none" stroke="#5c6470" stroke-width="3" opacity=".7"/>
        <!-- light from the window falls on the wall and sill -->
        <rect x="-300" y="-200" width="2100" height="1400" fill="url(#spill)"/>
        <rect x="550" y="640" width="880" height="14" fill="#7b828c"/>
        <!-- seat back along the window -->
        <path d="M420,652 C700,642 1100,642 1600,652 L1600,1100 L420,1100 Z" fill="url(#seatG)"/>
        <path d="M420,652 C700,642 1100,642 1600,652 L1600,660 C1100,650 700,650 420,660 Z" fill="#8fb2d0" opacity=".7"/>
        

        <!-- Mohit: halo from the bright glass, then the backlit figure -->
        <g transform="translate(800 150) scale(1.12)">
          <g filter="url(#halo)" fill="#fff3d8" opacity=".5"><use href="#torsoP"/><use href="#headP"/><use href="#hairP"/><use href="#armP"/></g>
          <use href="#torsoP" fill="#5f5a6b"/>
          <use href="#torsoP" fill="url(#pinD)"/>
          <path d="M138,262 C150,246 176,240 204,242 L214,244 C186,250 160,262 146,290 C128,330 118,500 118,720 L96,720 C92,560 100,320 138,262 Z" fill="#b5adc4" opacity=".5"/>
          <!-- collar -->
          <path d="M196,244 L232,250 L246,272 L222,268 Z" fill="#6c6779"/>
          <use href="#headP" fill="#46322a"/>
          <path d="M240,100 C254,104 262,120 262,140 C260,160 252,176 240,190 C252,186 266,170 268,150 C270,128 260,108 240,100 Z" fill="#5e4337" opacity=".7"/>
          <path d="M252,131 C256,133 260,133 263,131" stroke="#120c0a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M246,112 C252,110 260,110 266,113" stroke="#110d0b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- warm rim along the face profile -->
          <path d="M266,98 L270,122 C270,128 268,132 268,136 C274,144 282,152 286,158 C282,162 276,164 270,164 C272,170 274,174 270,178 C273,182 274,186 270,190 C268,196 272,202 270,208" fill="none" stroke="#ffd9a6" stroke-width="2.4" stroke-linejoin="round" opacity=".9"/>
          <!-- ear -->
          <path d="M198,128 C190,122 182,128 184,142 C186,154 194,160 200,154 Z" fill="#2c201c"/>
          <use href="#hairP" fill="#110d0b"/>
          <path d="M150,96 C164,66 196,46 236,42 C248,38 258,40 264,48" fill="none" stroke="#ffe0b0" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
          <!-- glasses, catching the window -->
          <path d="M248,118 L274,118 L272,134 C270,140 264,142 258,142 L250,140 Z" fill="#fff1d6" fill-opacity=".22" stroke="#0f0d0d" stroke-width="2.6"/>
          <path d="M250,120 L200,128" stroke="#0f0d0d" stroke-width="2.6"/>
          <path d="M262,121 L270,121" stroke="#fff6e4" stroke-width="2" stroke-linecap="round" opacity=".9"/>
          <!-- near arm: sleeve down to the elbow, forearm up to the fist under the chin -->
          <use href="#sleeveP" fill="#686378"/>
          <use href="#sleeveP" fill="url(#pinD)"/>
          <path d="M168,262 C190,246 230,250 246,276 L252,292 C232,266 196,262 176,280 Z" fill="#c8bfd8" opacity=".5"/>
          <use href="#armP" fill="#3b2a23"/>
          <path d="M300,266 C304,330 312,380 318,420" fill="none" stroke="#ffd9a6" stroke-width="2.2" opacity=".7"/>
          <path d="M282,216 C298,212 312,222 312,240 C312,254 306,262 300,266" fill="none" stroke="#ffd9a6" stroke-width="2.4" opacity=".9"/>
          <path d="M270,234 C280,230 292,230 302,234 M268,246 C278,242 292,242 304,246" stroke="#1e1512" stroke-width="2" fill="none" opacity=".7"/>
          <!-- rolled cuff near the elbow -->
          <path d="M276,368 C290,362 310,362 322,368 L326,402 C312,408 292,408 280,402 Z" fill="#77728a"/>
          <path d="M276,368 C290,362 310,362 322,368" stroke="#d7cfe4" stroke-width="2" fill="none" opacity=".7"/>
        </g>
      </svg>
      <svg id="midBlur" viewBox="0 0 1440 900" aria-hidden="true"><use href="#midSharpContent"/></svg>
      <div id="straps"></div>
      <svg id="barSharp" viewBox="0 0 1480 60" preserveAspectRatio="none" aria-hidden="true">
        <rect x="0" y="22" width="1480" height="20" rx="10" fill="#b9c1ca"/>
        <rect x="0" y="25" width="1480" height="5" rx="2" fill="#f0f4f7"/>
        <rect x="0" y="36" width="1480" height="6" rx="3" fill="#69717c"/>
      </svg>
      <svg id="barSoft" viewBox="0 0 1480 60" preserveAspectRatio="none" aria-hidden="true">
        <rect x="0" y="22" width="1480" height="20" rx="10" fill="#b9c1ca"/>
        <rect x="0" y="25" width="1480" height="5" rx="2" fill="#f0f4f7"/>
        <rect x="0" y="36" width="1480" height="6" rx="3" fill="#69717c"/>
      </svg>
    </div>
    <div class="grain"></div>
    <div class="copy">
      <h1>Mohit Bagri</h1>
      <div class="slot">
        <p class="line" id="line">Software engineer at Sypha AI and founder of AuctionXI. I build things and learn how they work.</p>
        <p class="note" id="note">That's me. Can't wait to get home and fix what blocked production.</p>
      </div>
      <a class="cta" href="mailto:mailmohitbagri@gmail.com">Write to me <span>→</span></a>
    </div>
  </div>
</section>
<template id="strapTpl">
  <svg viewBox="0 0 120 420" aria-hidden="true">
    <defs>
      <linearGradient id="SID-band" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1f2a3a"/><stop offset=".5" stop-color="#34465e"/><stop offset="1" stop-color="#1a2230"/>
      </linearGradient>
      <linearGradient id="SID-loop" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f4f1ea"/><stop offset="1" stop-color="#b9b6ae"/>
      </linearGradient>
    </defs>
    <path d="M40,0 L80,0 L78,40 L42,40 Z" fill="#8f98a3"/>
    <rect x="44" y="30" width="32" height="250" rx="6" fill="url(#SID-band)"/>
    <rect x="50" y="34" width="4" height="240" fill="#5d7090" opacity=".7"/>
    <rect x="40" y="268" width="40" height="22" rx="6" fill="#d7d2c8"/>
    <path d="M60,284 C24,286 10,316 12,350 C14,392 40,412 60,412 C80,412 106,392 108,350 C110,316 96,286 60,284 Z M60,306 C84,306 92,328 92,352 C92,378 78,394 60,394 C42,394 28,378 28,352 C28,328 36,306 60,306 Z" fill="url(#SID-loop)" fill-rule="evenodd"/>
    <path d="M20,330 C24,306 40,294 58,292" stroke="#ffffff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>
  </svg>
</template>
<script>
(() => {
  // the soft copy of the mid layer reuses the sharp layer's content
  const sharp = document.getElementById("midSharp"), blur = document.getElementById("midBlur");
  blur.innerHTML = "";
  [...sharp.childNodes].forEach(n => { if (n.nodeName !== "defs") blur.appendChild(n.cloneNode(true)); });

  // straps: right of the text zone, near the lens
  const holder = document.getElementById("straps"), tpl = document.getElementById("strapTpl").innerHTML;
  const spots = [{ x: 560, w: 150, h: 525, ph: 0 }, { x: 900, w: 170, h: 595, ph: 1.7 }, { x: 1250, w: 160, h: 560, ph: 3.1 }];
  window.__straps = spots.map((s, i) => {
    const d = document.createElement("div");
    d.className = "strap";
    d.style.cssText = `left:${s.x - s.w / 2}px;width:${s.w}px;height:${s.h}px`;
    const a = tpl.replaceAll("SID", "s" + i + "a"), b = tpl.replaceAll("SID", "s" + i + "b");
    d.innerHTML = `<div class="sharp" style="position:absolute;inset:0">${a}</div><div class="soft" style="position:absolute;inset:0">${b}</div>`;
    holder.appendChild(d);
    return { el: d, sharp: d.querySelector(".sharp"), soft: d.querySelector(".soft"), ph: s.ph };
  });
})();
(() => {
  const sec = document.getElementById("intro"), scene = document.getElementById("scene");
  const midBlur = document.getElementById("midBlur"), barSoft = document.getElementById("barSoft"), barSharp = document.getElementById("barSharp");
  const line = document.getElementById("line"), note = document.getElementById("note");
  const straps = window.__straps;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  let target = 0, cur = 0, S = 1, ox = 0, oy = 0, narrow = false;
  const read = () => { const r = sec.getBoundingClientRect(); target = clamp(-r.top / (r.height - innerHeight), 0, 1); };
  const fit = () => {
    const W = innerWidth, H = innerHeight; narrow = W / H < .9;
    if (narrow) { const top = Math.min(280, H * .3); S = (H - top) / 840; ox = W / 2 - 1020 * S; oy = top + 20 * S; }
    else { S = Math.max(W / 1440, H / 900); ox = (W - 1440 * S) / 2; oy = (H - 900 * S) / 2; }
  };
  addEventListener("scroll", read, { passive: true }); addEventListener("resize", () => { fit(); read(); });
  fit(); read(); cur = target;
  function frame(t) {
    cur += (target - cur) * (reduce ? 1 : .08);
    const p = cur, s = t / 1000;
    const f = ease(seg(p, .14, .7));              // focus pull: 0 = straps, 1 = him
    const z = 1 + ease(seg(p, .1, .92)) * .08;    // a slow push toward him
    const fx = 1080, fy = 380;
    scene.style.transform = `translate(${ox + fx * S * (1 - z)}px, ${oy + fy * S * (1 - z)}px) scale(${S * z})`;
    midBlur.style.opacity = (1 - f).toFixed(3);
    barSoft.style.opacity = f.toFixed(3); barSharp.style.opacity = (1 - f).toFixed(3);
    straps.forEach((st, i) => {
      st.soft.style.opacity = f.toFixed(3); st.sharp.style.opacity = (1 - f).toFixed(3);
      const sw = reduce ? 0 : Math.sin(s * .9 + st.ph) * 3.2 + Math.sin(s * 2.3 + st.ph * 2) * .6;
      st.el.style.transform = `rotate(${sw.toFixed(3)}deg)`;
    });
    const a = seg(p, .3, .46), b = seg(p, .62, .8);
    line.style.opacity = 1 - a; line.style.transform = `translateY(${-a * 12}px)`;
    note.style.opacity = b; note.style.transform = `translateY(${(1 - b) * 12}px)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
