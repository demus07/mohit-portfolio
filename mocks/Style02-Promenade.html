<script>/* collage kit: seeded randomness and torn-paper edges */
const KIT = (() => {
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  // torn rectangle path: edges listed in `sides` are torn, others straight
  function torn(x, y, w, h, o = {}) {
    const amp = o.amp ?? 3, step = o.step ?? 9, r = rng(o.seed ?? 7), sides = o.sides ?? "tblr";
    const pts = [];
    const edge = (x0, y0, x1, y1, t, nx, ny) => {
      const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(len / step));
      for (let i = 0; i < n; i++) {
        const f = i / n, j = t ? (r() - .5) * 2 * amp + (r() < .12 ? amp * 1.6 : 0) : 0;
        pts.push([x0 + (x1 - x0) * f + nx * j, y0 + (y1 - y0) * f + ny * j]);
      }
    };
    edge(x, y, x + w, y, sides.includes("t"), 0, 1);
    edge(x + w, y, x + w, y + h, sides.includes("r"), -1, 0);
    edge(x + w, y + h, x, y + h, sides.includes("b"), 0, -1);
    edge(x, y + h, x, y, sides.includes("l"), 1, 0);
    return "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
  }
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { rng, torn, clamp, seg, ease, reduce };
})();
</script>

</svg>`;

  window.mohitCut = el => { el.innerHTML = window.mohitSVG({ ...el.dataset, gx: el.dataset.gx, gy: el.dataset.gy }); };
  document.querySelectorAll("[data-mohit]").forEach(window.mohitCut);
})();
</script>
<script>
const $ = id => document.getElementById(id);
const { torn, rng } = KIT;

/* far shore: Malabar Hill, then the Deco blocks of the necklace curving toward us on the right */
(function () {
  let s = `
           <path d="M500,432 C560,392 640,376 720,380 C790,384 840,404 900,432Z" fill="#8aa292"/>
           <path d="M500,432 C560,392 640,376 720,380 C790,384 840,404 900,432Z" fill="url(#dN)" opacity=".18"/>`;
  // tower blocks on the hill
  const r = rng(9);
  for (let i = 0; i < 9; i++) { const x = 560 + i * 34 + r() * 12, h = 18 + r() * 30; s += `<rect x="${x}" y="${412 - h * .35 + Math.abs(i - 4) * 3}" width="${12 + r() * 8}" height="${h * .35 + 14}" fill="${["#d9d1bf", "#c8c3b6", "#e2d6c0"][i % 3]}"/>`; }
  // the curve of the drive: Deco blocks from far (small, left) to near (large, right)
  const cols = ["#efe0bf", "#f1d98f", "#e8b8a6", "#d9e2cf", "#f3e6cf", "#eccda2", "#e6c3b8"];
  const N = 12;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), sc = .36 + Math.pow(t, 1.7) * 1.5;
    const x = 840 + Math.pow(t, 1.2) * 640, base = 436 + Math.pow(t, 2) * 112;
    const w = 86 * sc, h = (96 + (i * 41) % 46) * sc, c = cols[i % cols.length];
    const curved = i % 2 === 0, R = 18 * sc;
    s += curved
      ? `<path d="M${x},${base} V${base - h + R} A${R},${R} 0 0 1 ${x + R},${base - h} H${x + w} V${base}Z" fill="${c}"/>`
      : `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="${c}"/>`;
    // stepped parapet tower
    if (i % 3 === 1) s += `<rect x="${x + w * .62}" y="${base - h - 12 * sc}" width="${w * .26}" height="${12 * sc}" fill="${c}"/><rect x="${x + w * .68}" y="${base - h - 20 * sc}" width="${w * .14}" height="${8 * sc}" fill="${c}"/>`;
    // windows with eyebrow sunshades, ribbon balcony at the corner
    const rows = 5, rh = (h - 14 * sc) / rows;
    for (let f = 0; f < rows; f++) {
      const y = base - h + 10 * sc + f * rh;
      s += `<rect x="${x + 4 * sc}" y="${y}" width="${w - 8 * sc}" height="${Math.max(1, 2.2 * sc)}" fill="#fbf6ea"/>`;
      for (let k = 0; k < 4; k++) s += `<rect x="${x + (8 + k * 20) * sc}" y="${y + 3.5 * sc}" width="${10 * sc}" height="${rh * .5}" fill="#3d4352" opacity=".7"/>`;
    }
    if (curved) s += `<rect x="${x}" y="${base - h + R}" width="${5 * sc}" height="${h - R}" fill="#fbf6ea" opacity=".6"/>`;
  }
  // the drive and its sea wall along the curve
  s += `<path d="M760,434 C1000,440 1240,480 1460,560 L1460,574 C1240,494 1000,452 760,442Z" fill="#8c8a84"/>
        <path d="M760,442 C1000,452 1240,494 1460,574 L1460,584 C1240,506 1000,462 760,448Z" fill="#d8d2c4"/>`;
  $("far").innerHTML = s;
})();

/* sea: torn strips, far to near */
(function () {
  const bands = [[430, 26, "#a9c8d0"], [452, 30, "#8fb8c6"], [478, 36, "#6aa0b5"], [508, 42, "#4f8ba5"], [544, 48, "#3c7c98"], [584, 56, "#2c6d8c"], [630, 70, "#245c78"]];
  $("sea").innerHTML = bands.map(([y, h, c], i) => `<g class="strip"><path d="${torn(-40, y, 1520, h + 14, { amp: 2 + i * .4, step: 10 + i, seed: 100 + i, sides: "t" })}" fill="${c}"/></g>`).join("")
    + `<rect x="-40" y="584" width="1520" height="130" fill="url(#dN)" opacity=".1"/>`;
})();

/* tetrapods: four-legged concrete armour, cut from grey paper with halftone shade */
(function () {
  const r = rng(33);
  let s = "";
  const leg = (cx, cy, a, L, w0, w1) => {
    const ca = Math.cos(a), sa = Math.sin(a), ex = cx + ca * L, ey = cy + sa * L, nx = -sa, ny = ca;
    return `<path d="M${cx + nx * w0},${cy + ny * w0} L${ex + nx * w1},${ey + ny * w1} A${w1},${w1} 0 0 1 ${ex - nx * w1},${ey - ny * w1} L${cx - nx * w0},${cy - ny * w0}Z"/>`;
  };
  for (let i = 0; i < 26; i++) {
    const cx = -20 + (i % 13) * 118 + (i > 12 ? 58 : 0) + r() * 24, cy = (i > 12 ? 690 : 668) + r() * 10, sc = 1.05 + r() * .3, rot = r() * 6.28;
    const tone = ["#c4c0b6", "#b3afa5", "#cfcbc1"][i % 3];
    let legs = "";
    [0, 2.094, 4.188].forEach(k => legs += leg(cx, cy, rot + k, 30 * sc, 21 * sc, 16 * sc));
    s += `<g fill="${tone}">${legs}<circle cx="${cx}" cy="${cy}" r="${15 * sc}"/></g>
          <g fill="url(#dG)" opacity=".6">${leg(cx, cy, rot + 2.094, 30 * sc, 21 * sc, 16 * sc)}</g>
          <circle cx="${cx + 3}" cy="${cy + 3}" r="${17 * sc}" fill="#dedad0"/><circle cx="${cx + 3}" cy="${cy + 3}" r="${17 * sc}" fill="url(#dG)" opacity=".25"/>`;
  }
  // spray scraps that rise between the tetrapods now and then
  [[260, 660], [620, 664], [1010, 668]].forEach(([x, y], i) => {
    s += `<g class="spray" style="animation-delay:${-i * 3}s">${[[0, 0, 16, 10], [22, -14, 12, 8], [-14, -22, 10, 7], [8, -36, 9, 6], [34, -30, 7, 5], [-4, -50, 6, 4]].map(([dx, dy, w, h], j) => `<path d="${torn(x + dx, y - 20 + dy, w, h, { amp: 1.6, step: 3, seed: 300 + i * 9 + j })}" fill="#fbf8f0"/>`).join("")}</g>`;
  });
  $("tetra").innerHTML = s;
})();

/* the parapet and promenade */
$("wall").innerHTML = `
  <path d="${torn(-30, 690, 1500, 26, { amp: 1.5, step: 9, seed: 61, sides: "tb" })}" fill="#ddd6c6"/>
  <path d="${torn(-30, 712, 1500, 84, { amp: 1.4, step: 9, seed: 62, sides: "b" })}" fill="#c9c1ae"/>
  <rect x="-30" y="712" width="1500" height="84" fill="url(#dG)" opacity=".28"/>
  <path d="${torn(-30, 792, 1500, 120, { amp: 2, step: 12, seed: 63, sides: "t" })}" fill="#a9a293"/>
  <rect x="-30" y="800" width="1500" height="110" fill="url(#dN)" opacity=".08"/>`;

/* cutting chai: a fluted glass on the parapet, cut out with a paper margin */
$("chai").innerHTML = `
  <path d="M-30,8 L30,8 L24,92 L-24,92Z" fill="#fbf8ef" transform="translate(0 0) scale(1.18) translate(0 -8)"/>
  <path d="M-24,14 L24,14 L19,86 L-19,86Z" fill="#e8dcc6"/>
  <path d="M-22,34 L22,34 L19,86 L-19,86Z" fill="#b8742f"/>
  <path d="M-22,34 L22,34 L21.6,40 L-21.6,40Z" fill="#d79a52"/>
  ${[-15, -7, 1, 9, 17].map(x => `<path d="M${x},16 L${x * .8},84" stroke="#fff" stroke-width="2" opacity=".55"/>`).join("")}
  <path d="M-24,14 L24,14" stroke="#fff" stroke-width="2.5"/>
  <g class="steam"><path d="M-8,4 C-16,-8 0,-16 -8,-30"/><path d="M4,2 C-4,-12 12,-18 4,-34"/><path d="M14,4 C8,-6 20,-14 12,-26"/></g>`;

/* Mohit at the parapet */
const him = $("him");
him.innerHTML = mohitSVG({ vb: "140 200 560 800", tone: "day", gx: 18, gy: 12, par: "xMidYMax meet" });

/* ---------- camera ---------- */
const world = $("world"), stage = $("stage"), copy = $("copy"), aside = $("aside"), ring = $("ring");
const strips = [...document.querySelectorAll("#sea .strip")];
let W, H, s0, tx0, ty0, phone;
function layout() {
  W = stage.clientWidth; H = stage.clientHeight; phone = W < 720;
  s0 = Math.max(W / 1440, H / 900);
  tx0 = phone ? Math.min(0, Math.max(W - 1440 * s0, W * .5 - 900 * s0)) : (W - 1440 * s0) / 2;
  ty0 = (H - 900 * s0) / 2;
  world.style.transform = `translate(${tx0}px,${ty0}px) scale(${s0})`;
  // him: lower right on desktop, centred on the phone
  const hh = phone ? H * .62 : H * .9, hw = hh * 560 / 800;
  Object.assign(him.style, { height: hh + "px", width: hw + "px", left: (phone ? (W - hw) / 2 + 20 : W * .6) + "px", bottom: "0px" });
  him.firstElementChild.style.cssText = "width:100%;height:100%;display:block";
  Object.assign(aside.style, phone ? { left: "14px", right: "auto", top: "auto", bottom: "36px" } : { left: (W * .6 - 290) + "px", top: H * .14 + "px", right: "auto", bottom: "auto" });
  Object.assign(ring.style, { left: (tx0 + 650 * s0) + "px", top: (ty0 + 676 * s0) + "px", width: 120 * s0 + "px", height: 120 * s0 + "px" });
  frame();
}
function frame() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = KIT.reduce ? 1 : (max > 0 ? scrollY / max : 0);
  const rise = KIT.ease(KIT.seg(p, 0, .6));
  him.style.transform = `translateY(${(1 - rise) * 26}%)`;
  // walking along the wall: the far shore and sea drift at different speeds
  world.style.transform = `translate(${tx0 - p * 60 * s0}px,${ty0}px) scale(${s0})`;
  strips.forEach((g, i) => g.parentNode && (g.style.translate = `${-p * (i + 1) * 14}px 0`));
  const a = KIT.ease(KIT.seg(p, .5, .8));
  aside.style.opacity = a; aside.style.transform = `translateY(${(1 - a) * 40}px) rotate(${3 - a}deg)`;
}
let raf = 0;
addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; frame(); }); }, { passive: true });
addEventListener("resize", layout);
document.fonts && document.fonts.ready.then(layout);
layout();
</script>
</body>
