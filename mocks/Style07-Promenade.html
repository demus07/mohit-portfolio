    const a0 = (i / 28) * Math.PI * 2, a1 = a0 + Math.PI / 56;

  // necklace: little deco blocks along the curve toward Malabar Hill
  const nk = $("necklace");
  for (let i = 0; i < 26; i++) {
    const t = i / 25, x = 620 + t * 420, y = 556 - Math.pow(t, 2.2) * 26, h = 6 + (1 - t) * 5;
    nk.insertAdjacentHTML("beforeend", `<rect x="${x.toFixed(1)}" y="${(y - h).toFixed(1)}" width="${(12 - t * 5).toFixed(1)}" height="${h.toFixed(1)}"/>`);

  // scalloped wave rows
  const waves = $("waves"), rows = [];
  const cols = ["#3a7e9b", "#2f7593", "#4a8ca6", "#357a97", "#5797ae"];
  for (let r = 0; r < 7; r++) {
    const y = 572 + r * r * 3.4 + r * 6, rad = 6 + r * 3.2, g = document.createElementNS(NS, "g");
    let d = "";
    for (let x = -480; x < 1900; x += rad * 2) d += `M${x},${y} A${rad},${rad} 0 0 1 ${x + rad * 2},${y} `;
    g.innerHTML = `<path d="${d}" fill="none" stroke="${cols[r % 5]}" stroke-width="${1.6 + r * .5}"/>`;
    waves.appendChild(g); rows.push({ g, sp: (r % 2 ? -1 : 1) * (4 + r * 2.2), w: rad * 2 });
  }
  // tetrapods: four legs from a centre, flat lit/shadow faces
  const tet = $("tetra");
  const leg = (ang, L, c) => { const a = ang * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca;
    const w0 = 15, w1 = 9, ex = ca * L, ey = sa * L;
    return `<path d="M${px * w0},${py * w0} L${ex + px * w1},${ey + py * w1} A${w1},${w1} 0 0 0 ${ex - px * w1},${ey - py * w1} L${-px * w0},${-py * w0} Z" fill="${c}"/>`; };
  const tp = (x, y, s, rot) => `<g transform="translate(${x} ${y}) scale(${s})">
     ${leg(rot + 90, 40, "#6f685b")}${leg(rot + 210, 40, "#a39b8a")}${leg(rot + 330, 40, "#8a8273")}
     <circle r="17" fill="#b3ab99"/><circle cx="-3" cy="-3" r="11" fill="#c4bca9"/></g>`;
  let h = "";
  for (let i = 0; i < 30; i++) h += tp(-40 + i * 52 + (i % 3) * 8, 690 + (i % 2) * 10, .78 + (i % 3) * .06, (i * 47) % 120);
  for (let i = 0; i < 26; i++) h += tp(-20 + i * 60 + (i % 2) * 22, 724, 1, (i * 71) % 120);
  tet.innerHTML = h;
  const st = $("steps");
  for (let x = -400; x < 1840; x += 120) st.insertAdjacentHTML("beforeend", `<rect x="${x}" y="774" width="3" height="66"/>`);

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const smile = $("smile"), track = $("track"), sun = $("sun"), away = $("away"), aside = $("aside"), clouds = $("clouds"), mohit = $("mohit");
  let cur = 0, t0 = performance.now();
  const clamp = v => Math.min(1, Math.max(0, v));
  const sm = t => t * t * (3 - 2 * t);
  function layout() {
    const mob = innerWidth < 700;
    mohit.setAttribute("transform", mob ? "translate(547 420) scale(.8)" : "translate(820 318) scale(1)");
    sun.dataset.x = mob ? 735 : 1010; sun.dataset.y = mob ? 470 : 330; sun.dataset.k = mob ? .62 : 1;
  }
  addEventListener("resize", layout); layout();
  function frame(now) {
    const r = track.getBoundingClientRect();
    const target = clamp(-r.top / (track.offsetHeight - innerHeight));
    cur += (target - cur) * (reduce ? 1 : .1);
    const turn = sm(clamp((cur - .18) / .32));
    away.style.opacity = 1 - turn;
    away.setAttribute("transform", `translate(${-8 * turn} 0)`);
    smile.style.opacity = turn; smile.setAttribute("transform", `translate(${-30 + 8 * (1 - turn)} -6)`);
    sun.setAttribute("transform", `translate(${sun.dataset.x} ${+sun.dataset.y + cur * 70}) scale(${sun.dataset.k})`);
    const a = sm(clamp((cur - .55) / .25));
    aside.style.opacity = a; aside.style.transform = `translateY(${14 * (1 - a)}px)`;
    if (!reduce) {
      const t = (now - t0) / 1000;
      rows.forEach(o => o.g.setAttribute("transform", `translate(${((t * o.sp) % o.w).toFixed(2)} 0)`));
      $("fan").setAttribute("transform", `rotate(${t * 1.5})`);
      [...clouds.children].forEach((c, i) => { const b = [380, 1180, 760][i], y = [210, 150, 270][i]; const x = ((b + t * (5 + i * 2) + 400) % 2240) - 400; c.setAttribute("transform", `translate(${x.toFixed(1)} ${y})`); c.style.opacity = innerWidth < 700 ? 0 : clamp((x - 640) / 180); });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
