/* ---------- Style 03 shared kit: low-poly helpers + the Mohit figure ---------- */
const T = THREE;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const _mats = {};
function mat(color, o = {}) {

function hash3(x, y, z) {

// deform every vertex with a pure function of its position: keeps non-indexed geometry watertight
function deform(g, fn) {

function jitter(g, a, ay) {

function mesh(g, m, x = 0, y = 0, z = 0, parent) {

}
function lerp(a, b, t) { return a + (b - a) * t; }

function smooth(a, b, x) { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); }

// text drawn to a canvas texture (station boards, LED, marathi)
function textTex(lines, o = {}) {
  const w = o.w || 512, h = o.h || 128, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = o.bg || '#f2c230'; x.fillRect(0, 0, w, h);
  x.fillStyle = o.color || '#1c1a17'; x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach((l, i) => { x.font = l.font; x.fillText(l.t, w / 2, l.y * h); });
  if (o.dots) { // dot-matrix mask
    const d = x.getImageData(0, 0, w, h); const g = o.dots;
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
      const i = (yy * w + xx) * 4; if ((xx % g) === g - 1 || (yy % g) === g - 1) { d.data[i] *= .15; d.data[i + 1] *= .15; d.data[i + 2] *= .15; }
    } x.putImageData(d, 0, 0);
  }
  const t = new T.CanvasTexture(c); t.anisotropy = 4; return t;
}

// sky dome with a soft vertical gradient (stops: [[y01,color],...])
function skyDome(stops, r = 900) {
  const g = new T.SphereGeometry(r, 24, 16); const col = []; const p = g.attributes.position; const c = new T.Color();
  const cs = stops.map(s => [s[0], new T.Color(s[1])]);
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) / r + 1) / 2; let k = 0; while (k < cs.length - 2 && t > cs[k + 1][0]) k++;
    const a = cs[k], b = cs[k + 1]; c.copy(a[1]).lerp(b[1], clamp((t - a[0]) / (b[0] - a[0]))); col.push(c.r, c.g, c.b);

  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  const m = new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -10; return m;
}
function recolorSky(sky, stops) {
  const g = sky.geometry, p = g.attributes.position, col = g.attributes.color, r = g.parameters.radius, c = new T.Color();
  const cs = stops.map(s => [s[0], s[1] instanceof T.Color ? s[1] : new T.Color(s[1])]);
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) / r + 1) / 2; let k = 0; while (k < cs.length - 2 && t > cs[k + 1][0]) k++;
    const a = cs[k], b = cs[k + 1]; c.copy(a[1]).lerp(b[1], clamp((t - a[0]) / (b[0] - a[0]))); col.setXYZ(i, c.r, c.g, c.b);
  }
  col.needsUpdate = true;
}

// faceted sea: a jittered grid whose vertices bob; returns {mesh, tick(t)}
function makeSea(w, d, sx, sz, color, amp = .25) {
  const g = new T.PlaneGeometry(w, d, sx, sz); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, base = Float32Array.from(p.array), ph = [];
  for (let i = 0; i < p.count; i++) { const x = base[i * 3], z = base[i * 3 + 2]; base[i * 3] += (hash3(x, 1, z) - .5) * w / sx * .6; base[i * 3 + 2] += (hash3(z, 2, x) - .5) * d / sz * .6; ph.push(hash3(x, z, 3) * 6.28); }
  const nonIdx = g.toNonIndexed(); // flat facets
  const m = new T.Mesh(g, mat(color, { shininess: 30, specular: 0x334455 }));
  function tick(t) {
    for (let i = 0; i < p.count; i++) {
      const x = base[i * 3], z = base[i * 3 + 2];
      p.setXYZ(i, x, Math.sin(t * .9 + ph[i] + x * .05) * amp + Math.sin(t * .6 + z * .08) * amp * .6, z);
    }
    p.needsUpdate = true;
  }
  tick(0); return { mesh: m, tick };
}

// concrete tetrapod: four legs from a centre
function tetrapod(s = 1, color = 0xb9b2a7) {
  const g = new T.Group(); const leg = new T.CylinderGeometry(.22 * s, .42 * s, 1.15 * s, 6, 1); leg.translate(0, .58 * s, 0);
  const dirs = [[0, 1, 0], [.943, -.333, 0], [-.471, -.333, .816], [-.471, -.333, -.816]];
  dirs.forEach(d => { const m = new T.Mesh(leg, mat(color)); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), new T.Vector3(...d)); g.add(m); });
  g.add(new T.Mesh(new T.IcosahedronGeometry(.45 * s, 0), mat(color)));
  return g;
}
function palm(h = 6, lean = .15) {
  const g = new T.Group(); let y = 0, x = 0;
  for (let i = 0; i < 5; i++) { const s = mesh(new T.CylinderGeometry(.16 - i * .015, .2 - i * .015, h / 5, 5), mat(0x8a7560), x, y + h / 10, 0, g); s.rotation.z = -lean; y += h / 5 * Math.cos(lean); x += h / 5 * Math.sin(lean); }
  for (let i = 0; i < 7; i++) {
    const f = new T.ConeGeometry(.35, 2.6, 3); f.translate(0, 1.3, 0); f.scale(1, 1, .25);
    const m = mesh(f, mat(i % 2 ? 0x5f8a5a : 0x6f9a63), x, y, 0, g); m.rotation.set(0, i / 7 * Math.PI * 2, 1.25 + (i % 3) * .12, 'YXZ');
  }

}
function rainTree(s = 1, col = 0x6d8f5f) {
  const g = new T.Group();
  mesh(new T.CylinderGeometry(.18 * s, .3 * s, 2.4 * s, 5), mat(0x6e5a48), 0, 1.2 * s, 0, g);
  [[0, 3.1, 0, 2.1], [1.3, 2.8, .3, 1.5], [-1.3, 2.9, -.2, 1.6], [.2, 3.0, 1.1, 1.3]].forEach(([x, y, z, r], i) => {
    const c = jitter(new T.IcosahedronGeometry(r * s, 0), .35 * s); c.scale(1, .62, 1);
    mesh(c, mat(i % 2 ? col : new T.Color(col).offsetHSL(0, 0, .05).getHex()), x * s, y * s, z * s, g);
  });
  return g;
}
// marine drive lamp post (curved arm), returns {group, bulb, glow}
function lampPost(h = 5.2, lit = 0xffc46b) {
  const g = new T.Group();
  mesh(new T.CylinderGeometry(.07, .12, h, 6), mat(0x3c4652), 0, h / 2, 0, g);
  mesh(new T.CylinderGeometry(.2, .24, .35, 6), mat(0x3c4652), 0, .18, 0, g);
  const arm = mesh(new T.BoxGeometry(.9, .06, .06), mat(0x3c4652), .4, h - .05, 0, g); arm.rotation.z = .08;
  const head = mesh(new T.CylinderGeometry(.08, .26, .2, 6), mat(0x3c4652), .85, h - .1, 0, g);
  const bulb = mesh(new T.IcosahedronGeometry(.16, 0), basic(0x6a6560), .85, h - .25, 0, g);
  const glow = new T.Sprite(new T.SpriteMaterial({ map: glowTex(), color: lit, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending }));

}
let _glow;
function glowTex() {
  if (_glow) return _glow; const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const r = x.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');

// 1930s Art Deco block: curved corner, eyebrow shades, ribbon balconies, stepped parapet
function decoBlock(w = 8, h = 10, d = 6, color = 0xeadcc0, o = {}) {
  const g = new T.Group(); const body = mat(color); const trim = mat(new T.Color(color).offsetHSL(0, -.05, .07).getHex());
  const shade = mat(new T.Color(color).offsetHSL(0, 0, -.12).getHex());
  mesh(new T.BoxGeometry(w - 1.2, h, d), body, -.6, h / 2, 0, g);
  const corner = mesh(new T.CylinderGeometry(1.2, 1.2, h, 8, 1, false, 0, Math.PI / 2), body, w / 2 - 1.2, h / 2, d / 2 - 1.2, g);
  mesh(new T.BoxGeometry(1.2, h, d - 1.2), body, w / 2 - .6, h / 2, -.6, g);
  const floors = Math.floor(h / 2.2);
  const win = o.win || mat(0x4d5866);
  for (let f = 0; f < floors; f++) {
    const y = 1.6 + f * 2.2;
    mesh(new T.BoxGeometry(w + .2, .14, .7), trim, 0, y + .95, d / 2 + .2, g); // eyebrow
    for (let i = 0; i < Math.floor((w - 2) / 1.6); i++) { const wm = mesh(new T.BoxGeometry(.9, 1.1, .05), win, -w / 2 + 1.1 + i * 1.6, y, d / 2 + .03, g); wm.userData.win = true; }

  }

/* ---------- stage: renderer + sticky scroll progress + pause offscreen ---------- */
function makeStage(o) {
  const canvas = o.canvas, R = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  R.setPixelRatio(Math.min(devicePixelRatio, o.dpr || 1.6));
  if (o.shadows) { R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; }
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(o.fov || 35, 1, .1, 2000);
  const st = { R, scene, cam, p: 0, pt: 0, t: 0, visible: true, frames: [], w: 1, h: 1 };
  function size() { const w = canvas.clientWidth, h = canvas.clientHeight; st.w = w; st.h = h; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); st.dirty = true; }
  addEventListener('resize', size); size();
  const track = o.track;
  function prog() { const r = track.getBoundingClientRect(); const span = r.height - innerHeight; st.pt = clamp(-r.top / Math.max(1, span)); }
  addEventListener('scroll', prog, { passive: true }); prog(); st.p = st.pt;
  new IntersectionObserver(e => { st.visible = e[0].isIntersecting; }).observe(canvas);
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!st.visible) return;
    const dp = st.pt - st.p; st.p += dp * (REDUCED ? 1 : Math.min(1, dt * 6));
    if (!REDUCED) st.t += dt; else if (Math.abs(dp) < 1e-4 && !st.dirty) return;
    st.dirty = false;
    st.frames.forEach(f => f(st.p, st.t, dt));
    R.render(scene, cam);
  }

}
function camKeys(keys, p) { // keys: [[p, [px,py,pz], [tx,ty,tz], fov?], ...] -> eased interpolation
  let i = 0; while (i < keys.length - 2 && p > keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1], t = ease(clamp((p - a[0]) / (b[0] - a[0])));
  const L = (u, v) => u.map((x, k) => lerp(x, v[k], t));
  return { pos: L(a[1], b[1]), tgt: L(a[2], b[2]), fov: lerp(a[3] || 35, b[3] || 35, t) };
}

/* bake a static group into one mesh per (untextured) material: far fewer draw calls */
function bake(root, o = {}) {

    let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    g.applyMatrix4(new T.Matrix4().multiplyMatrices(inv, m.matrixWorld));
    if (!byMat.has(m.material)) byMat.set(m.material, []);
    byMat.get(m.material).push(g.attributes.position.array);

  const out = new T.Group(); out.position.copy(root.position); out.quaternion.copy(root.quaternion); out.scale.copy(root.scale);
  byMat.forEach((arrs, material) => {
    const n = arrs.reduce((s, a) => s + a.length, 0), pos = new Float32Array(n); let k = 0;
    arrs.forEach(a => { pos.set(a, k); k += a.length; });
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.computeVertexNormals();
    const mm = new T.Mesh(g, material); mm.castShadow = !!o.cast; mm.receiveShadow = !!o.receive; out.add(mm);
  });

}
// merge a few transformed geometries into one (for instancing)
function mergeGeos(list) {
  const arrs = list.map(([g, m]) => { const q = (g.index ? g.toNonIndexed() : g.clone()); q.applyMatrix4(m); return q.attributes.position.array; });
  const n = arrs.reduce((s, a) => s + a.length, 0), pos = new Float32Array(n); let k = 0; arrs.forEach(a => { pos.set(a, k); k += a.length; });
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
}
function tetrapodGeo(s = 1) {
  const leg = new T.CylinderGeometry(.22 * s, .42 * s, 1.15 * s, 6, 1); leg.translate(0, .58 * s, 0);
  const dirs = [[0, 1, 0], [.943, -.333, 0], [-.471, -.333, .816], [-.471, -.333, -.816]];
  const list = dirs.map(d => [leg, new T.Matrix4().makeRotationFromQuaternion(new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), new T.Vector3(...d)))]);

  return mergeGeos(list);

/* ---------------- THE CHARACTER: low-poly Mohit ---------------- */

let _shirtTex;
function shirtTex() {

  function kalash(r, parent, x, y, z, m = gold) {
    mesh(new T.CylinderGeometry(r * .5, r * .8, r * .4, 8), m, x, y + r * .2, z, parent);
    mesh(new T.SphereGeometry(r, 8, 6), m, x, y + r * 1.1, z, parent);
    mesh(new T.CylinderGeometry(r * .35, r * .55, r * .4, 8), m, x, y + r * 2.0, z, parent);
    mesh(new T.ConeGeometry(r * .42, r * 1.4, 8), m, x, y + r * 2.9, z, parent);
  }
  function spire(x, z, h, r) {
    const n = Math.max(4, Math.round(h / 1.6)), seg = h / n;
    for (let i = 0; i < n; i++) {
      const y = 16.6 + i * seg, rr = r * (1 - i / n * .32);
      mesh(new T.CylinderGeometry(rr * .97, rr, seg * .78, 8), mat([stone, tan, brown][i % 3]), x, y + seg * .39, z, TP);
      mesh(new T.CylinderGeometry(rr * .82, rr * .82, seg * .22, 8), mat(dark), x, y + seg * .89, z, TP);
    }
    const top = 16.6 + h;
    mesh(new T.CylinderGeometry(r * .75, r * .85, .35, 8), mat(tan), x, top + .17, z, TP);
    mesh(new T.CylinderGeometry(r * .5, r * .62, .3, 8), mat(stone), x, top + .5, z, TP);
    kalash(r * .32, TP, x, top + .65, z);
  }
  // the dense cluster around the centre
  const ring = [[-12, 7, 9, 1.25], [-8.5, 8.5, 11, 1.2], [-4.2, 9, 8, 1.0], [4.2, 9, 8, 1.0], [8.5, 8.5, 11, 1.2], [12, 7, 9, 1.25],
    [-13, 0, 12, 1.35], [13, 0, 12, 1.35], [-12, -7, 10, 1.25], [-7, -8.5, 13, 1.3], [0, -9, 11, 1.2], [7, -8.5, 13, 1.3], [12, -7, 10, 1.25],
    [-9, 3.5, 14, 1.45], [9, 3.5, 14, 1.45], [-9.5, -3.5, 15, 1.45], [9.5, -3.5, 15, 1.45], [-5.5, 6, 6, .9], [5.5, 6, 6, .9]];
  ring.forEach(([x, z, h, r]) => spire(x, z, h, r));
  // central stepped pyramidal shikhara, gold-plated, crowned with large kalash and the saffron flag
  const tiers = 11; let y = 16.6;
  for (let i = 0; i < tiers; i++) {
    const r0 = 6.2 * (1 - i / tiers * .78), r1 = r0 * .93, h = 1.55;
    mesh(new T.CylinderGeometry(r1, r0, h * .8, 8), i % 2 ? gold : goldBright, 0, y + h * .4, 0, TP).rotation.y = Math.PI / 8;
    mesh(new T.CylinderGeometry(r1 * .9, r1 * .9, h * .2, 8), mat(0x6a4416), 0, y + h * .9, 0, TP).rotation.y = Math.PI / 8;
    y += h;
  }
  const crownY = y;
  mesh(new T.SphereGeometry(1.7, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), goldBright, 0, crownY, 0, TP);
  kalash(.95, TP, 0, crownY + 1.4, 0, goldBright);
  // flag pole + waving bhagwa
  mesh(new T.CylinderGeometry(.07, .07, 7, 5), mat(0x8a6a3a), 1.1, crownY + 3.5, 0, TP);
  const flagG = new T.PlaneGeometry(4.2, 2.6, 8, 3); flagG.translate(2.1, 0, 0);
  deform(flagG, v => { v.y *= 1 - v.x / 4.2 * .98; });
  const flagBase = Float32Array.from(flagG.attributes.position.array);
  const flag = mesh(flagG, new T.MeshPhongMaterial({ color: 0xff7a1a, emissive: 0x7a2a00, side: T.DoubleSide, flatShading: true, shininess: 0 }), 1.15, crownY + 5.6, 0, TP);
  // the small orange stepped dome over the entrance, with its own gold finial
  const ent = new T.Group(); ent.position.set(0, 0, 12.5); TP.add(ent);
  mesh(new T.BoxGeometry(9, 7, 5), mat(stone), 0, 3.5, 0, ent);
  mesh(new T.BoxGeometry(3.2, 4.6, .3), mat(0x2a1a12, { emissive: 0x5a2c00 }), 0, 2.3, 2.55, ent);
  mesh(new T.CylinderGeometry(1.6, 1.6, .3, 10, 1, false, 0, Math.PI).rotateX(Math.PI / 2).rotateZ(Math.PI / 2), mat(0x2a1a12, { emissive: 0x5a2c00 }), 0, 4.6, 2.55, ent);
  mesh(new T.BoxGeometry(9.6, .5, 5.6), mat(tan), 0, 7.2, 0, ent);
  [[3.6, 1.0], [2.9, 1.0], [2.1, .9], [1.3, .8]].forEach(([r, h], i) => mesh(new T.CylinderGeometry(r * .88, r, h, 8), mat(i % 2 ? 0xe46a25 : 0xf07a2e), 0, 7.95 + i * .95, 0, ent).rotation.y = Math.PI / 8);
  mesh(new T.SphereGeometry(1.0, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xf07a2e), 0, 11.6, 0, ent);
  kalash(.42, ent, 0, 12.4, 0);
  // marigold garlands draped across the entrance + on the eave
  const mari = [mat(0xff9a1a, { emissive: 0x5a2600 }), mat(0xffc21a, { emissive: 0x5a3a00 })];
  function garland(a, b, sag, parent, n = 18) {
    for (let i = 0; i <= n; i++) { const t = i / n; const p = a.clone().lerp(b, t); p.y -= Math.sin(t * Math.PI) * sag; mesh(new T.IcosahedronGeometry(.17, 0), mari[i % 2], p.x, p.y, p.z, parent); }
  }
  garland(new T.Vector3(-4.5, 6.8, 2.7), new T.Vector3(0, 6.8, 2.7), .9, ent); garland(new T.Vector3(0, 6.8, 2.7), new T.Vector3(4.5, 6.8, 2.7), .9, ent);
  for (let i = 0; i < 6; i++) garland(new T.Vector3(-15 + i * 5, 15.3, 10.6), new T.Vector3(-10 + i * 5, 15.3, 10.6), .8, TP, 12);
  flag.userData.keep = true;
  const templeB = bake(TP);

  // ---------- Prabhadevi around it: dense blocks with lit windows ----------
  const city = new T.Group(); scene.add(city);
  const winOn = basic(0xffc979), winOff = basic(0x1c2638);
  for (let i = 0; i < 40; i++) {
    const side = i % 2 ? 1 : -1, x = side * (28 + (i % 5) * 9 + hash3(i, 1, 1) * 5), z = -30 + Math.floor(i / 10) * 18 - hash3(i, 2, 1) * 8, h = 14 + hash3(i, 3, 1) * 26, w = 8 + hash3(i, 4, 1) * 5;
    mesh(new T.BoxGeometry(w, h, 8), mat(side < 0 ? 0x1f2a40 : [0x56607a, 0x4d566e, 0x5d5a6c, 0x485468][i % 4]), x, h / 2, z, city);
    if (side < 0) continue;
    for (let f = 0; f < Math.floor(h / 2.6); f++) for (let k = 0; k < Math.floor(w / 1.8); k++) {
      if (hash3(i, f, k) < .55) continue;
      mesh(new T.PlaneGeometry(.8, 1.1), hash3(k, i, f) < .7 ? winOn : winOff, x - w / 2 + 1 + k * 1.8, 1.8 + f * 2.6, z + 4.02, city);
    }
  }
  for (let i = 0; i < 26; i++) { const x = -110 + i * 9, h = 20 + hash3(i, 9, 9) * 30; mesh(new T.BoxGeometry(8, h, 8), mat(0x3a445a), x, h / 2, -90 - (i % 3) * 14, city); }
  // the street, flower stalls with marigold and modak boxes, diyas
  mesh(new T.PlaneGeometry(400, 200).rotateX(-Math.PI / 2), mat(0x2a2c35), 0, 0, 40, city);
  mesh(new T.BoxGeometry(60, .2, 6), mat(0x6d6460), 0, .1, 20, city);
  const stalls = [];
  [14, 21, 28].forEach((x, i) => {
    const g = new T.Group(); g.position.set(x, 0, 19); g.rotation.y = -.25; city.add(g);
    mesh(new T.BoxGeometry(5, 1.1, 2.2), mat(0x7a4b2c), 0, .55, 0, g);
    for (let k = 0; k < 14; k++) mesh(new T.IcosahedronGeometry(.32, 0), mari[k % 2], -2 + (k % 7) * .65, 1.3, -.5 + Math.floor(k / 7) * .7, g);
    for (let k = 0; k < 3; k++) mesh(new T.BoxGeometry(.7, .4, .5), mat(0xf6e6c4), 1.6 - k * .8, 1.3, .7, g);
    [-2.4, 2.4].forEach(px => mesh(new T.BoxGeometry(.1, 3, .1), mat(0x3a2a20), px, 1.5, -1, g));
    mesh(new T.BoxGeometry(5.6, .12, 3), mat(i % 2 ? 0xd8452a : 0xe08a1a), 0, 3, -.2, g).rotation.x = -.15;
    for (let k = 0; k < 5; k++) { const s = k / 4; mesh(new T.IcosahedronGeometry(.12, 0), mari[k % 2], -2.4 + s * 4.8, 2.7 - Math.sin(s * Math.PI) * .4, 1.2, g); }
  });
  const cityB = bake(city);
  const diyas = [];
  for (let i = 0; i < 12; i++) {
    const x = -11 + i * 2; const d = new T.Group(); d.position.set(x, .2, 16.6); scene.add(d);
    mesh(new T.CylinderGeometry(.22, .12, .14, 7), mat(0xa0522d), 0, .07, 0, d);
    const fl = mesh(new T.ConeGeometry(.07, .26, 5), basic(0xffd27a), 0, .3, 0, d);
    const gw = new T.Sprite(new T.SpriteMaterial({ map: glowTex(), color: 0xffa94d, transparent: true, opacity: .8, depthWrite: false, blending: T.AdditiveBlending })); gw.scale.set(1.3, 1.3, 1); gw.position.y = .3; d.add(gw);
    diyas.push({ fl, gw, ph: hash3(i, 5, 5) * 6 });
  }

  const belief = document.getElementById('belief');
  const keysW = [[0, [-10, 7, 92], [6, 20, 0], 34], [1, [-6, 4.5, 62], [5, 19, 0], 36]];
  const keysT = [[0, [0, 8, 170], [0, 22, 0], 44], [1, [0, 6, 128], [0, 20, 0], 44]];
  S.frames.push((p, t) => {
    const tall = S.w / S.h < .9, k = camKeys(tall ? keysT : keysW, p);
    cam.position.set(...k.pos); cam.lookAt(...k.tgt); cam.fov = k.fov;
    if (!tall) cam.setViewOffset(S.w, S.h, -.17 * S.w, 0, S.w, S.h); else cam.setViewOffset(S.w, S.h, 0, -.04 * S.h, S.w, S.h);
    cam.updateProjectionMatrix();
    belief.classList.toggle('on', p > .35);
    // flag
    const fp = flagG.attributes.position;
    for (let i = 0; i < fp.count; i++) { const x = flagBase[i * 3], yy = flagBase[i * 3 + 1]; fp.setXYZ(i, x, yy + Math.sin(t * 3 - x * 1.4) * .08 * x, Math.sin(t * 3.4 - x * 1.6) * .25 * x / 4.2 * 1.6); }
    fp.needsUpdate = true;
    diyas.forEach(d => { const f = .85 + Math.sin(t * 9 + d.ph) * .08 + Math.sin(t * 13.7 + d.ph) * .05; d.fl.scale.set(1, f, 1); d.gw.material.opacity = .55 + f * .25; });
  });
})();
</script>
