<script>
/* ---------- Siddhivinayak, drawn on a 1000x1000 grid, ground at y=1000 ---------- */
function buildTemple(){
  const out=[];const f=n=>Math.round(n*10)/10;
  const ord=y=>Math.max(0,Math.min(1,(1000-y)/900)).toFixed(3);
  const P=(d,c,y)=>out.push(`<path class="${c}" d="${d}" pathLength="1" style="--o:${ord(y)}"/>`);
  const trap=(cx,y0,h0,y1,h1)=>`M${f(cx-h0)} ${f(y0)}L${f(cx+h0)} ${f(y0)}L${f(cx+h1)} ${f(y1)}L${f(cx-h1)} ${f(y1)}Z`;
  const quad=(a0,b0,y0,a1,b1,y1)=>`M${f(a0)} ${f(y0)}L${f(b0)} ${f(y0)}L${f(b1)} ${f(y1)}L${f(a1)} ${f(y1)}Z`;
  const ell=(cx,cy,rx,ry)=>`M${f(cx-rx)} ${f(cy)}a${f(rx)} ${f(ry)} 0 1 0 ${f(2*rx)} 0a${f(rx)} ${f(ry)} 0 1 0 ${f(-2*rx)} 0Z`;
  const kal=(cx,y,s)=>`M${f(cx-s*.5)} ${f(y)}L${f(cx+s*.5)} ${f(y)}L${f(cx+s*.36)} ${f(y-s*.16)}C${f(cx+s*.95)} ${f(y-s*.3)} ${f(cx+s*.9)} ${f(y-s*1.1)} ${f(cx+s*.26)} ${f(y-s*1.2)}L${f(cx+s*.2)} ${f(y-s*1.36)}L${f(cx+s*.46)} ${f(y-s*1.44)}L${f(cx+s*.12)} ${f(y-s*1.56)}Q${f(cx)} ${f(y-s*2.5)} ${f(cx-s*.12)} ${f(y-s*1.56)}L${f(cx-s*.46)} ${f(y-s*1.44)}L${f(cx-s*.2)} ${f(y-s*1.36)}L${f(cx-s*.26)} ${f(y-s*1.2)}C${f(cx-s*.9)} ${f(y-s*1.1)} ${f(cx-s*.95)} ${f(y-s*.3)} ${f(cx-s*.36)} ${f(y-s*.16)}Z`;
  const arch=(x,y,w,h)=>`M${f(x)} ${f(y+h)}V${f(y+w/2)}A${f(w/2)} ${f(w/2)} 0 0 1 ${f(x+w)} ${f(y+w/2)}V${f(y+h)}Z`;
  function spire(cx,w,top,base){
    const hb=w/2,ht=w*.4,L=y=>ht+(hb-ht)*(y-top)/(base-top);
    P(trap(cx,base,hb,top,ht),'t-stone',base);
    P(quad(cx+hb*.2,cx+hb,base,cx+ht*.2,cx+ht,top),'t-sh',base);
    P(quad(cx-hb*.74,cx-hb*.46,base,cx-ht*.74,cx-ht*.46,top),'t-hi',base);
    const seg=Math.max(w*.82,13);
    for(let y=top+w*.5;y<base-seg*.5;y+=seg){const h=L(y);
      P(trap(cx,y-seg*.36,h,y-seg*.46,h),'t-tan',y);
      P(trap(cx,y+seg*.2,h*1.1,y,h*1.1),'t-band',y);}
    const m=w*.13,c=top;
    P(trap(cx,c,ht*1.36,c-m,ht*1.36),'t-band',c);
    P(trap(cx,c-m,ht*1.12,c-m-w*.24,ht*.82),'t-stone',c);
    P(trap(cx,c-m-w*.24,ht*.9,c-m-w*.31,ht*.9),'t-band',c);
    P(trap(cx,c-m-w*.31,ht*.78,c-m-w*.46,ht*.5),'t-tan',c);
    P(ell(cx,c-m-w*.49,ht*.72,w*.07),'t-gold',c);
    P(kal(cx,c-m-w*.53,w*.3),'t-gold',c);
  }
  function stepped(cx,base,top,h0,h1,n,cl,dome){
    for(let i=0;i<n;i++){
      const t0=i/n,t1=(i+1)/n,y0=base-(base-top)*t0,y1=base-(base-top)*t1,th=y0-y1;
      const a=dome?h1+(h0-h1)*Math.cos(t0*Math.PI/2*.92):h1+(h0-h1)*Math.pow(1-t0,1.12);
      P(trap(cx,y0,a*.92,y1+th*.26,a*.86),cl[0],y0);
      P(quad(cx+a*.34,cx+a*.92,y0,cx+a*.3,cx+a*.86,y1+th*.26),cl[1],y0);
      P(trap(cx,y1+th*.26,a,y1,a*.95),cl[2],y1);
      if(cl[3]) for(const k of [-.6,-.2,.2,.6]) P(`M${f(cx+a*.9*k)} ${f(y0)}L${f(cx+a*.86*k)} ${f(y1+th*.26)}`,cl[3],y0);
    }
  }
  const CX=500;
  // two side groups of banded spires; in each, the tallest stand at the outer edge
  [[-110,30,452],[112,30,458],[-150,32,424],[152,32,430],[-192,32,392],[196,32,398],[-232,32,362],[236,32,368],[-268,30,338],[272,30,344]].forEach(([dx,w,t])=>spire(CX+dx,w,t,668));
  [[-304,30,316,746],[306,30,322,746]].forEach(([dx,w,t,bs])=>spire(CX+dx,w,t,bs));
  // the central shikhara: eight tiers narrowing upward
  stepped(CX,580,300,150,34,8,['t-tier','t-tiersh','t-tierlip','t-rib']);
  P(ell(CX,296,42,8),'t-goldd',296);P(ell(CX,290,32,7),'t-gold',290);
  P(kal(CX,284,36),'t-gold',284);
  P(`M${CX+40} 300V96`,'t-pole',300);
  // dark band under the eaves, with its row of seven small spires
  P(trap(CX,668,198,580,180),'t-eave',668);
  for(let i=0;i<7;i++){const x=CX-150+i*50;P(trap(x,668,9,616,7),'t-stone',668);P(trap(x,616,8.6,600,1.6),'t-tan',616);P(ell(x,597,3.4,3.4),'t-gold',597);}
  // front ring
  [[-172,36,470],[174,36,476],[-252,34,430],[256,34,436]].forEach(([dx,w,t])=>spire(CX+dx,w,t,668));
  // upper storey
  P(`M236 746V666H764V746Z`,'t-wall',746);
  for(let x=252;x<750;x+=28) P(arch(x,682,13,38),(x*7%5===1)?'t-winl':'t-win',720);
  P(trap(CX,672,276,664,276),'t-band',672);
  // main block
  P(`M180 1000V746H820V1000Z`,'t-wall',1000);
  P(trap(CX,754,332,744,332),'t-band',754);P(trap(CX,838,326,830,326),'t-band',838);P(trap(CX,918,326,910,326),'t-band',918);
  for(const r of [[762,56],[846,54]]) for(let x=196;x<806;x+=30){ if(x>360&&x<578) continue; P(arch(x,r[0],14,r[1]),((x+r[0])%7===2)?'t-winl':'t-win',r[0]+r[1]);}
  for(let x=198;x<806;x+=44){ if(x>350&&x<590) continue; P(arch(x,930,22,70),'t-win',1000);}
  // entrance porch and the small orange stepped dome
  const EX=468;
  P(`M${EX-92} 1000V876H${EX+92}V1000Z`,'t-wall2',1000);
  P(arch(EX-32,910,64,90),'t-door',1000);
  P(trap(EX,884,106,870,106),'t-band',884);
  stepped(EX,870,756,104,16,6,['t-orange','t-orangesh','t-olip'],true);
  P(ell(EX,754,18,4.5),'t-gold',754);P(kal(EX,750,19),'t-gold',750);
  // the low compound wall, sloping across the front
  P(`M-60 1000L-60 984L1060 956L1060 1000Z`,'t-cwall',1000);
  P(`M-60 984L1060 956L1060 949L-60 977Z`,'t-ccope',1000);
  out.push(`<path id="flag" class="t-flag" d="" style="--o:1"/>`);
  return out.join('');
}
const FLAG={x:540,y:96,L:80,H:46};
function flagD(t){const {L,H}=FLAG;const X=FLAG.x,Y=FLAG.y;const w1=Math.sin(t*2.3)*H*.14,w2=Math.sin(t*2.3+1.4)*H*.18,tx=L*(.94+.06*Math.sin(t*1.2)),ny=Math.sin(t*1.7)*H*.08;
 return `M${X} ${Y}Q${X+L*.5} ${Y+w1} ${X+tx} ${Y+H*.06+w1*.6}L${X+L*.55} ${Y+H*.5+ny}L${X+tx*.97} ${Y+H*.96+w2*.6}Q${X+L*.5} ${Y+H+w2} ${X} ${Y+H}Z`;}
function mumbaiTime(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(new Date());const g=k=>(p.find(x=>x.type===k)||{}).value;return `${g('hour')}:${g('minute')} ${(g('dayPeriod')||'').toLowerCase()}`;}

/* ---------- scene ---------- */
const NS='http://www.w3.org/2000/svg';
document.getElementById('temple').innerHTML=buildTemple();
function blocks(id,list,col,lit){let s='';for(const [x,y,w] of list){s+=`<rect x="${x}" y="${y}" width="${w}" height="${800-y}" fill="${col}"/>`;
 if(lit) for(let r=0;r<Math.floor((780-y)/38);r++)for(let c=0;c<Math.floor((w-16)/28);c++){const k=x<620?3:(r*13+c*7+x)%17;s+=`<rect x="${x+12+c*28}" y="${y+18+r*38}" width="12" height="15" fill="${k===0?'#f2b766':k===5?'#9fb4c8':'#1a2436'}" opacity="${k===0?.9:k===5?.35:1}"/>`;}}
 document.getElementById(id).innerHTML=s;}
blocks('far',[[40,300,120],[300,250,90],[520,330,110],[1260,240,100],[1440,310,130],[1120,350,70]],'#1c2639',false);
blocks('near',[[0,700,180],[170,730,160],[330,690,150],[480,650,150],[1270,600,120],[1390,520,210]],'#121b2b',true);
// umbrellas
const walkers=document.getElementById('walkers');const W=[];
function person(sc,col){return `<g transform="scale(${sc})"><path d="M-46 -118Q0 -168 46 -118Q38 -112 31 -117Q23 -110 15 -116Q8 -110 0 -116Q-8 -110 -15 -116Q-23 -110 -31 -117Q-38 -112 -46 -118Z" fill="${col}"/><path d="M0 -150V-120" stroke="${col}" stroke-width="2"/><path d="M0 -118V-84" stroke="#0a0f18" stroke-width="2.4"/><circle cx="2" cy="-104" r="8" fill="#0a0f18"/><path d="M-12 -94Q2 -100 14 -94L18 -40H-14Z" fill="#0b111b"/><path class="lg" d="M-8 -42L-12 0M8 -42L12 0" stroke="#0b111b" stroke-width="7" stroke-linecap="round"/></g>`}
[[0.95,'#141820',870,0],[0.78,'#3a1f22',845,.37],[1.08,'#10141c',905,.62],[0.7,'#1a2230',832,.84]].forEach(([sc,c,y,ph])=>{
 const g=document.createElementNS(NS,'g');g.innerHTML=person(sc,c)+`<ellipse cx="0" cy="${4}" rx="${40*sc}" ry="4" fill="#f2a145" opacity=".08"/>`;walkers.appendChild(g);W.push({g,y,ph,sc});});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const flag=document.getElementById('flag');
const art=document.getElementById('art'),cam=document.getElementById('cam');
const mq=matchMedia('(max-width:720px)');
function setView(){art.setAttribute('viewBox',mq.matches?'560 -640 880 1640':'0 0 1600 1000');}
setView();mq.addEventListener('change',setView);
// rain
const cv=document.getElementById('rain'),cx=cv.getContext('2d');let drops=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;drops=Array.from({length:Math.round(innerWidth*innerHeight/5200)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:8+Math.random()*16,v:9+Math.random()*9,a:.08+Math.random()*.22}));}
size();addEventListener('resize',size);
let p=0;
function onScroll(){const el=document.getElementById('page');const max=el.offsetHeight-innerHeight;p=Math.max(0,Math.min(1,scrollY/max));}
addEventListener('scroll',onScroll,{passive:true});onScroll();
const belief=document.getElementById('belief'),foot=document.getElementById('foot');
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frame(ts){const t=ts/1000;
 flag.setAttribute('d',flagD(reduce?0:t));
 const e=ease(p);
 cam.setAttribute('transform',`translate(0 ${(-e*(mq.matches?30:46)).toFixed(1)})`);
 const b=Math.max(0,Math.min(1,(p-.3)/.3)),fo=Math.max(0,Math.min(1,(p-.6)/.25));
 belief.style.opacity=b;belief.style.transform=`translateY(${(1-b)*14}px)`;foot.style.opacity=fo;
 // walkers: right to left, fading before they reach the text column
 const vw=mq.matches?{x0:560,x1:1440}:{x0:700,x1:1640};
 W.forEach((w,i)=>{const span=vw.x1-vw.x0+120;const u=((reduce?w.ph:(t*0.012*(1+i*.15))+w.ph)%1);const x=vw.x1+60-u*span;
  const fade=Math.min(1,(x-vw.x0)/140,(vw.x1+60-x)/60);const bob=Math.sin(t*5+i)*1.5;
  w.g.setAttribute('transform',`translate(${x.toFixed(1)} ${(w.y+bob).toFixed(1)})`);w.g.style.opacity=Math.max(0,fade);});
 // rain, thinning as the invitation settles
 cx.clearRect(0,0,cv.width,cv.height);
 if(!reduce){const n=Math.round(drops.length*(1-.55*e));cx.lineWidth=1;
  for(let i=0;i<n;i++){const d=drops[i];d.y+=d.v;d.x-=d.v*.12;if(d.y>cv.height){d.y=-20;d.x=Math.random()*cv.width*1.1;}
   const lampish=d.x>cv.width*.8&&d.y<cv.height*.85;cx.strokeStyle=lampish?`rgba(255,196,120,${d.a+.15})`:`rgba(190,205,225,${d.a})`;
   cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x+d.l*.12,d.y-d.l);cx.stroke();}}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
function tick(){document.getElementById('clock').textContent=`It's ${mumbaiTime()} in Mumbai.`;}tick();setInterval(tick,15000);
</script>
</body>
