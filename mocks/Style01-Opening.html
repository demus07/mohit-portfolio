<!-- Direction 01: Swiss editorial — Churchgate drawn as a precise side elevation of the AC local inside a gridded frame; scroll dollies the camera into the one lit window until Mohit, chin on fist, fills the frame and a callout line ties him to his note. -->

<style>
:root{
  --paper:#efe8da; --ink:#16202c; --sea:#2c6d8c; --navy:#0d1a2b; --sodium:#f2a145;
  --rule:rgba(22,32,44,.22); --mute:rgba(22,32,44,.62);
  --serif:"Newsreader",Georgia,serif; --sans:"Inter Tight",system-ui,sans-serif;
  --m:48px; --g:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.run{height:420vh;position:relative}
.stage{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--g);padding:var(--m);overflow:hidden}
.copy{grid-column:1 / span 4;display:flex;flex-direction:column;position:relative;z-index:2}
h1{font-family:var(--serif);font-weight:350;font-size:clamp(56px,6.6vw,112px);line-height:.92;letter-spacing:-.025em;font-variation-settings:"opsz" 72}
.lede{margin-top:28px;font-size:clamp(16px,1.2vw,19px);line-height:1.5;max-width:31ch;color:var(--ink)}
.cta{margin-top:22px;display:inline-flex;gap:.45em;align-items:baseline;font-family:var(--serif);font-size:22px;text-decoration:none;width:max-content;border-bottom:1px solid transparent;transition:border-color .3s}
.cta span{display:inline-block;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.cta:hover{border-color:var(--ink)} .cta:hover span{transform:translateX(6px)}
.note{margin-top:auto;font-family:var(--serif);font-style:italic;font-weight:350;font-size:clamp(24px,2.1vw,34px);line-height:1.2;max-width:15ch;opacity:0;transform:translateY(14px);text-wrap:balance}
.note-wrap{margin-top:auto;position:relative}
.place{font-size:14px;color:var(--mute);margin-top:18px;line-height:1.4;opacity:0}
.frame{grid-column:5 / span 8;position:relative;overflow:hidden;background:var(--sodium)}
.frame svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.lead{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lead line{stroke:var(--ink);stroke-width:1}
.lead circle{fill:var(--ink)}
.after{height:40vh}
.ln,.ln *{vector-effect:non-scaling-stroke}.ln{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.led{font-family:var(--sans);font-weight:600;letter-spacing:.06em}
@media (max-width:760px){
  :root{--m:20px;--g:12px}
  .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;row-gap:18px;padding:28px var(--m) 24px}
  .copy{grid-column:1;display:block}
  h1{font-size:52px}
  .lede{margin-top:14px;font-size:15px}
  .cta{margin-top:10px;font-size:19px}
  .frame{grid-column:1;grid-row:2}
  .note-wrap{grid-row:3}
  .note{font-size:22px;max-width:22ch}
  .place{display:none}
  .lead{display:none}
}
</style>
</head>

<!-- direction: Style01 Opening — Swiss editorial elevation, dolly into the window -->
<script>
(() => {
  const run = document.getElementById('run'), frame = document.getElementById('frame');
  const cam = document.getElementById('cam'), refl = document.getElementById('refl');
  const notes = [document.getElementById('note'), document.getElementById('note2')];
  const leadL = document.getElementById('leadL'), leadC = document.getElementById('leadC');
  const mob = matchMedia('(max-width:760px)');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const setMob = () => { document.querySelector('.note-wrap.mob').style.display = mob.matches ? 'block' : 'none'; document.querySelector('.note-wrap.desk').style.display = mob.matches ? 'none' : 'block'; };
  setMob(); mob.addEventListener('change', () => { setMob(); measure(); });
  // camera target: his face inside the window
  const W = 900, H = 800, TX = 575, TY = 404, S = 7.4;
  let fr, top0, span, cur = 0, tgt = 0;
  function measure(){
    fr = frame.getBoundingClientRect();
    const r = run.getBoundingClientRect();
    top0 = r.top + scrollY; span = run.offsetHeight - innerHeight;
  }
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  function frameTick(){
    tgt = clamp((scrollY - top0) / span, 0, 1);
    cur += (tgt - cur) * (reduce ? 1 : .12);
    if (Math.abs(tgt - cur) < .0004) cur = tgt;
    const z = ease(clamp(cur / .78, 0, 1));
    const s = Math.exp(Math.log(S) * z);
    // frame centre in viewBox units (slice mapping)
    const k = Math.max(fr.width / W, fr.height / H);
    const cx = W/2, cy = H/2;
    // window centre travels from where it is to the frame centre (nudged right so the face sits off-centre)
    const fx = cx + (mob.matches ? -6 : 40) * z, fy = cy + 10 * z;
    const px = TX + (fx - TX) * z, py = TY + (fy - TY) * z;
    const tx = px - TX * s, ty = py - TY * s;
    cam.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${s.toFixed(4)})`);
    refl.style.opacity = (1 - clamp((cur - .35) / .35, 0, 1)).toFixed(3);
    const n = clamp((cur - .74) / .16, 0, 1);
    notes.forEach(el => { el.style.opacity = n; el.style.transform = `translateY(${(1-n)*14}px)`; });
    // callout: from the note to his temple (Swiss diagram leader)
    if (!mob.matches) {
      const ln = clamp((cur - .84) / .12, 0, 1);
      const nr = notes[0].getBoundingClientRect();
      const ox = (fr.width - W*k)/2, oy = (fr.height - H*k)/2;
      // his glasses hinge in scene units: symbol (512,371) + (372-250, 337-200)*96/440
      const hx = 545 + (292-250)*86/440, hy = 374 + (372-200)*86/440;
      const sx = fr.left + ox + (hx * s + tx) * k, sy = fr.top + oy + (hy * s + ty) * k;
      const x1 = nr.left + Math.min(nr.width, 15*16) + 18, y1 = nr.top + 18;
      const ex = x1 + (sx - x1) * ln, ey = y1 + (sy - y1) * ln;
      leadL.setAttribute('x1', x1); leadL.setAttribute('y1', y1); leadL.setAttribute('x2', ex); leadL.setAttribute('y2', ey);
      leadL.style.opacity = ln > 0 ? 1 : 0;
      leadC.setAttribute('cx', ex); leadC.setAttribute('cy', ey); leadC.style.opacity = ln >= 1 ? 1 : 0;
    }
    requestAnimationFrame(frameTick);
  }
  // live Mumbai time on the indicator
  const t = document.getElementById('ledTime');
  const clock = () => { t.textContent = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); };
  clock(); setInterval(clock, 15000);
  // ambient: the second LED line scrolls slowly, wrapping off the board
  const runEl = document.getElementById('ledRun');
  let lx = 0; const lw = 420;
  if (!reduce) (function led(){ lx -= .35; if (lx < -lw) lx = 256; runEl.setAttribute('transform', `translate(${lx.toFixed(1)} 0)`); requestAnimationFrame(led); })();
  addEventListener('resize', measure);
  measure(); requestAnimationFrame(frameTick);
})();
</script>
