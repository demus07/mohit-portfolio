<!-- Direction 10: Chai stall at the wall — we stand with our backs to the sea; the chaiwala's cart, the Deco fronts behind, a kaali-peeli rolling past; scrolling pours one cutting chai. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promenade — Chai stall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#efe8da; }
  body { font-family:"Work Sans",system-ui,sans-serif; color:#24303a; }
  .track { height:380vh; position:relative; }
  .stage { position:sticky; top:0; height:100vh; height:100svh; overflow:hidden; }
  .layer { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .copy { position:absolute; left:clamp(24px,6.2vw,96px); top:clamp(28px,9.5vh,96px); width:min(700px,46vw); z-index:5; }
  h1 { font-family:"Fraunces",Georgia,serif; font-weight:300; font-variation-settings:"SOFT" 100; font-size:clamp(42px,4.7vw,78px); line-height:1.0; letter-spacing:-0.02em; color:#22303c; text-wrap:balance; }
  h1 em { font-style:italic; color:#7a3e1c; }
  .line { margin-top:22px; font-size:clamp(16px,1.15vw,18.5px); line-height:1.55; max-width:40ch; color:#33414c; }
  .aside { margin-top:22px; max-width:26ch; font-family:"Fraunces",serif; font-style:italic; font-weight:300; font-size:clamp(20px,1.55vw,25px); line-height:1.3; color:#5b3218;
    opacity:0; transform:translateY(14px); transition:opacity 1.2s ease, transform 1.4s cubic-bezier(.2,.7,.2,1); }
  .aside.on { opacity:1; transform:none; }
  .grain { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; opacity:.22; z-index:6; }
  @media (max-width:700px) {
    .copy { width:auto; right:24px; top:26px; }
    h1 { font-size:clamp(36px,10.4vw,46px); }
    .line { margin-top:12px; font-size:15.5px; }
    .aside { margin-top:12px; font-size:18.5px; }
  }
</style>
</head>
<body>
<div class="track" id="track">
  <div class="stage">
    <svg class="layer" id="sv" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-900" x2="0" y2="600">
          <stop offset="0" stop-color="#8fb4c6"/><stop offset=".45" stop-color="#b9cfd2"/><stop offset=".8" stop-color="#e6e2d0"/><stop offset="1" stop-color="#f3e6cc"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d6c6c"/><stop offset="1" stop-color="#85817b"/></linearGradient>
        <linearGradient id="pave" gradientUnits="userSpaceOnUse" x1="0" y1="672" x2="0" y2="900"><stop offset="0" stop-color="#cdb79a"/><stop offset="1" stop-color="#e3cfb2"/></linearGradient>
        <linearGradient id="roundL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".5" stop-color="#000" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="roundR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
        <linearGradient id="ali" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d8a85"/><stop offset=".3" stop-color="#e9e6df"/><stop offset=".55" stop-color="#bdb9b2"/><stop offset="1" stop-color="#77746f"/></linearGradient>

        <path d="M206 600 C204 560 196 530 186 506 M206 600 C210 556 226 528 250 508 M206 560 C180 540 150 530 120 526" stroke="#4a3a2c" stroke-width="9" fill="none" stroke-linecap="round"/>
        <g filter="url(#leaf)">
          <path d="M20 520 C30 470 90 448 160 452 C210 430 290 436 330 466 C380 470 420 498 410 528 C380 540 320 532 280 540 C220 548 150 546 100 540 C60 542 24 538 20 520 Z" fill="#5f6f45"/>
          <path d="M60 500 C90 470 150 462 200 466 C250 452 310 458 350 480 C320 488 260 488 210 492 C150 494 100 500 60 500 Z" fill="#7a8a55"/>
          <path d="M110 476 C150 462 200 462 240 470 C210 474 160 478 110 476 Z" fill="#9aa76a" opacity=".8"/>
        </g>
      </g>
      <!-- compound walls and the kerb -->
      <rect x="-700" y="580" width="2900" height="22" fill="#d9c7a8"/>
      <rect x="-700" y="580" width="2900" height="3" fill="#f2e6cc"/>
      <!-- the road -->
      <rect x="-700" y="602" width="2900" height="66" fill="url(#road)"/>
      <g stroke="#e8e2d4" stroke-width="2.4" opacity=".75"><path id="lane" d="M-700 636 H2200" stroke-dasharray="44 40"/></g>
      <g id="traffic"></g>
      <rect x="-700" y="666" width="2900" height="8" fill="#b9ab96"/>
      <rect x="-700" y="666" width="2900" height="2" fill="#efe2c8"/>
      <!-- the promenade -->
      <rect x="-700" y="674" width="2900" height="240" fill="url(#pave)"/>
      <rect x="-700" y="674" width="2900" height="240" fill="#000" filter="url(#stucco)" opacity=".35"/>
      <g stroke="#b29a7c" stroke-width="1.2" opacity=".5" id="joints"></g>
      <!-- lamp post, the necklace by night -->
      <g id="lamp">
        <rect x="1352" y="300" width="9" height="380" fill="#3d4247"/>
        <rect x="1352" y="300" width="3" height="380" fill="#9aa0a3"/>
        <path d="M1356 304 C1356 270 1340 258 1310 258 L1290 258" stroke="#3d4247" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M1268 252 h40 l-6 12 h-28 z" fill="#3d4247"/>
        <rect x="1346" y="668" width="21" height="14" fill="#3d4247"/>
      </g>
      <!-- long afternoon shadows fall away from us, toward the road -->
      <g fill="#6b5640" opacity=".28">
        <path d="M842 836 L1168 836 L1240 720 L930 720 Z"/>
        <path d="M1352 682 L1366 682 L1600 470 L1590 470 Z" opacity=".6"/>
      </g>
      <!-- the chaiwala, behind his cart -->
      <g id="wala">
        <!-- torso: white banian under an open checked shirt -->
        <path d="M884 712 C880 660 884 620 900 598 C914 580 936 574 956 574 C978 574 996 584 1006 602 C1016 626 1018 666 1014 712 Z" fill="#56687a"/>
        <path d="M904 712 C902 668 908 630 922 606 C934 594 966 592 984 606 C994 632 996 672 994 712 Z" fill="#eee8dc"/>
        <path d="M904 712 C902 668 908 630 922 606 L930 604 C918 640 918 680 920 712 Z" fill="#cfc6b6"/>
        <path d="M884 712 C880 660 884 620 900 598 L912 600 C900 640 900 680 902 712 Z" fill="#46566a"/>
        <path d="M986 604 C998 610 1008 630 1012 660 L1014 712 L996 712 C996 676 994 640 986 604 Z" fill="#6b7d8f"/>
        <!-- gamchha over the shoulder -->
        <path d="M914 596 C926 590 944 590 952 596 C948 616 942 640 936 660 C930 640 922 616 914 596 Z" fill="#b5463a"/>
        <path d="M918 602 h30 M922 616 h22 M926 630 h16" stroke="#e8d3b4" stroke-width="2"/>
        <!-- neck and head, a three-quarter turn toward the glass -->
        <path d="M938 578 C938 566 940 556 944 548 L964 548 C966 558 966 568 966 578 Z" fill="#8a5a3e"/>
        <ellipse cx="955" cy="526" rx="24" ry="28" fill="#93613f"/>
        <path d="M972 516 C980 520 982 534 976 548 C972 540 970 528 972 516 Z" fill="#a87250"/>
        <path d="M930 526 C925 500 940 487 958 487 C970 487 978 493 981 502 C970 497 956 497 946 503 C939 508 934 517 930 526 Z" fill="#cfcac2"/>
        <path d="M962 512 q6 -3 12 -1" stroke="#4a3022" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M977 522 q4 6 1 10" stroke="#6e452c" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M962 538 C968 536 976 537 980 540 C974 543 966 543 962 538 Z" fill="#e3ddd4"/>
        <ellipse cx="933" cy="528" rx="5" ry="7" fill="#7d5034"/>
        <path d="M966 522 l8 -1" stroke="#3a281c" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- his arms are drawn live: one lifts the kettle, one holds the glass -->
      <g id="armBack"></g>

      <!-- the cart -->
      <g id="cart">
        <!-- wheels behind the box -->
        <g id="wheelL" transform="translate(888 790)"></g>
        <g id="wheelR" transform="translate(1122 790)"></g>
        <rect x="826" y="708" width="352" height="16" fill="#6e4628"/>
        <rect x="826" y="708" width="352" height="4" fill="#c4935e"/>
        <rect x="838" y="724" width="328" height="78" fill="url(#wood)"/>
        <g stroke="#5e3b20" stroke-width="1.5" opacity=".6"><path d="M838 750 H1166 M838 776 H1166"/></g>
        <!-- front panel, painted long ago -->
        <rect x="858" y="732" width="288" height="60" fill="#3f6e86"/>
        <rect x="858" y="732" width="288" height="60" fill="#000" filter="url(#stucco)" opacity=".5"/>
        <rect x="866" y="740" width="272" height="44" fill="none" stroke="#e7c36a" stroke-width="2" opacity=".85"/>
        <path d="M884 762 c14 -14 28 14 42 0 s28 14 42 0 M1036 762 c14 -14 28 14 42 0 s28 14 42 0" stroke="#e7c36a" stroke-width="2" fill="none" opacity=".75"/>
        <circle cx="1002" cy="762" r="9" fill="none" stroke="#e7c36a" stroke-width="2" opacity=".85"/>
        <!-- push handles, nearest to us -->
        <path d="M1166 716 L1236 740 M1166 730 L1236 754" stroke="#6e4628" stroke-width="7" stroke-linecap="round"/>
        <!-- stove and the steel tray of glasses -->
        <rect x="868" y="686" width="72" height="22" rx="3" fill="#3a3c40"/>
        <rect x="868" y="686" width="72" height="4" fill="#77797d"/>
        <path d="M876 686 q28 -6 56 0" stroke="#f2a145" stroke-width="3" fill="none" opacity=".8"/>
        <rect x="1046" y="700" width="104" height="8" rx="2" fill="#a9a6a0"/>
        <g id="glasses"></g>
        <!-- an aluminium dabba of rusks -->
        <rect x="976" y="660" width="44" height="48" rx="4" fill="url(#ali)"/>
        <rect x="972" y="654" width="52" height="9" rx="3" fill="#8f8c86"/>
      </g>
      <!-- kettle, lifted on scroll -->
      <g id="kettle">
        <path d="M-34 0 C-38 -30 -30 -54 -16 -62 L16 -62 C30 -54 38 -30 34 0 Z" fill="url(#ali)"/>
        <path d="M-18 -62 C-16 -72 16 -72 18 -62 Z" fill="#9a968f"/>
        <rect x="-4" y="-78" width="8" height="8" rx="2" fill="#4d4b47"/>
        <path d="M30 -30 C46 -36 54 -48 64 -60 L70 -56 C60 -40 50 -24 33 -14 Z" fill="#a9a59e"/>
        <path d="M-28 -50 C-60 -54 -60 -10 -30 -12" stroke="#5c5a55" stroke-width="5" fill="none"/>
        <ellipse cx="0" cy="0" rx="34" ry="4" fill="#66635e"/>
      </g>
      <path id="stream" fill="none" stroke="url(#tea)" stroke-linecap="round"/>
      <g id="armFront"></g>
      <g id="held"></g>
      <g id="steam" filter="url(#steamBlur)" fill="none" stroke="#fffaf0" stroke-linecap="round"></g>
    </svg>
    <svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
    <div class="copy">
      <h1>One year in, here's <em>what I shipped</em></h1>
      <p class="line">An LLM gateway that replaced OpenRouter. A terminal tool 500+ developers open daily. A live auction SaaS I built alone.</p>
      <p class="aside" id="aside">9.45 CGPA taught me less than shipping did. Still early. Still building.</p>
    </div>
  </div>
</div>
<!-- direction: 10 chai stall at the wall -->
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  const ss = t => t*t*(3-2*t);
  const lerp = (a,b,t) => a + (b-a)*t;
  const sv = $('sv'), track = $('track');

  // ---------- the Deco fronts ----------
  const deco = $('deco');
  const fronts = [
    { x:-160, w:310, top:500, c:'#e6d3b2', floors:3, rl:0, rr:40, style:'ribbon' },
    { x:160,  w:450, top:474, c:'#eccabd', floors:4, rl:70, rr:0, style:'ribbon' },
    { x:640,  w:300, top:300, c:'#f0dea6', floors:7, rl:0, rr:0, style:'eyebrow', tower:true },
    { x:960,  w:340, top:272, c:'#f1e6d0', floors:8, rl:110, rr:0, style:'fins' },
    { x:1320, w:350, top:318, c:'#e8c4b5', floors:7, rl:0, rr:60, style:'eyebrow' },
    { x:1690, w:300, top:360, c:'#e6dcc2', floors:6, rl:50, rr:0, style:'ribbon' },
  ];
  const base = 582;
  for (const f of fronts) {
    const g = mk('g', {}, deco);
    const h = base - f.top, rl = f.rl, rr = f.rr;
    const outline = `M${f.x} ${base} L${f.x} ${f.top + rl} ${rl ? `Q${f.x} ${f.top} ${f.x + rl} ${f.top}` : ''} L${f.x + f.w - rr} ${f.top} ${rr ? `Q${f.x + f.w} ${f.top} ${f.x + f.w} ${f.top + rr}` : ''} L${f.x + f.w} ${base} Z`;
    mk('path', { d: outline, fill: f.c }, g);
    // light from the sea, behind us and a little to the left: the curved corners turn away from it
    if (rl) mk('rect', { x: f.x, y: f.top, width: rl*1.1, height: h, fill: 'url(#roundL)' }, g);
    if (rr) mk('rect', { x: f.x + f.w - rr*1.1, y: f.top, width: rr*1.1, height: h, fill: 'url(#roundR)' }, g);
    mk('rect', { x: f.x, y: f.top, width: f.w, height: 5, fill: '#fff8ea', opacity: .5 }, g);
    const fh = (h - 30) / f.floors;
    for (let i = 0; i < f.floors; i++) {
      const y = f.top + 22 + i*fh;
      const L = f.x + 14, R = f.x + f.w - 14;
      if (f.style === 'ribbon') {
        // continuous ribbon windows with a band of wall between
        mk('rect', { x: L + rl*.3, y: y + fh*.22, width: R - L - rl*.3 - rr*.3, height: fh*.4, rx: Math.min(fh*.2, 8), fill: '#6c6a63', opacity: .78 }, g);
        mk('rect', { x: L + rl*.3, y: y + fh*.22, width: R - L - rl*.3 - rr*.3, height: 2, fill: '#2e2d2a', opacity: .4 }, g);
        mk('rect', { x: L - 6 + rl*.2, y: y + fh*.66, width: R - L + 12 - rl*.2 - rr*.2, height: 4, rx: 2, fill: '#fbf2e2' }, g);
        mk('rect', { x: L - 6 + rl*.2, y: y + fh*.66 + 4, width: R - L + 12 - rl*.2 - rr*.2, height: 4, fill: '#000', opacity: .12 }, g);
      } else {
        const n = f.style === 'fins' ? 7 : 5;
        const span = (R - L - rl*.4 - rr*.4) / n;
        for (let j = 0; j < n; j++) {
          const wx = L + rl*.4 + j*span + span*.18;
          mk('rect', { x: wx, y: y + fh*.25, width: span*.64, height: fh*.5, fill: j % 3 === 1 ? '#5e5b55' : '#77726a', opacity: .8 }, g);
          // shutters half drawn in a couple of windows
          if ((i*7 + j*3) % 5 === 0) mk('rect', { x: wx, y: y + fh*.25, width: span*.64, height: fh*.22, fill: '#c9a77a', opacity: .9 }, g);
        }
        // eyebrow sunshade with its shadow under it
        mk('rect', { x: L + rl*.3, y: y + fh*.17, width: R - L - rl*.3 - rr*.3, height: 4, fill: '#fff6e4' }, g);
        mk('rect', { x: L + rl*.3, y: y + fh*.17 + 4, width: R - L - rl*.3 - rr*.3, height: fh*.14, fill: '#3d2c1c', opacity: .17 }, g);
        if (f.style === 'fins') for (let j = 0; j <= 2; j++) mk('rect', { x: f.x + f.w*.55 + j*26, y: f.top - 26, width: 7, height: h + 4, fill: '#fbf3e3' }, g), mk('rect', { x: f.x + f.w*.55 + j*26 + 7, y: f.top - 26, width: 4, height: h + 4, fill: '#000', opacity: .1 }, g);
      }
    }
    if (f.tower) {
      const tx = f.x + f.w/2 - 40;
      mk('path', { d: `M${tx} ${f.top} V${f.top - 40} H${tx + 12} V${f.top - 62} H${tx + 26} V${f.top - 80} H${tx + 54} V${f.top - 62} H${tx + 68} V${f.top - 40} H${tx + 80} V${f.top} Z`, fill: f.c }, g);
      mk('rect', { x: tx + 34, y: f.top - 74, width: 12, height: 64, fill: '#6c6a63', opacity: .6 }, g);
      mk('path', { d: `M${tx + 40} ${f.top - 80} V${f.top - 130}`, stroke: '#4a4440', 'stroke-width': 2 }, g);
    }
    mk('rect', { x: f.x, y: f.top, width: f.w, height: h, fill: '#000', filter: 'url(#stucco)', opacity: .3 }, g);
    // name plate over the entrance
    mk('rect', { x: f.x + f.w*.42, y: base - 34, width: f.w*.16, height: 30, fill: '#4f4a43', opacity: .7 }, g);
  }

  // ---------- paving joints ----------
  for (let i = -6; i < 20; i++) { const x = i*130; mk('path', { d: `M${x} 676 L${x + (x - 1000)*.32} 905` }, $('joints')); }
  [700, 740, 800, 880].forEach(y => mk('path', { d: `M-700 ${y} H2200` }, $('joints')));

  // ---------- wheels ----------
  for (const id of ['wheelL', 'wheelR']) {
    const g = $(id);
    mk('circle', { r: 48, fill: 'none', stroke: '#3c2a1c', 'stroke-width': 8 }, g);
    mk('circle', { r: 48, fill: 'none', stroke: '#8a6a4a', 'stroke-width': 2, opacity: .6 }, g);
    for (let i = 0; i < 12; i++) { const a = i*Math.PI/6; mk('path', { d: `M0 0 L${Math.cos(a)*44} ${Math.sin(a)*44}`, stroke: '#4a3424', 'stroke-width': 2.4 }, g); }
    mk('circle', { r: 7, fill: '#2c2018' }, g);
  }

  // ---------- cutting glasses on the tray ----------
  const glass = (parent, x, y, s, fill) => {
    const g = mk('g', { transform: `translate(${x} ${y}) scale(${s})` }, parent);
    mk('path', { d: 'M-9 -26 L9 -26 L7 0 L-7 0 Z', fill: '#f4efe4', opacity: .35 }, g);
    const tea = mk('path', { d: `M${-9 + 2*(1 - fill)} ${-26*fill} L${9 - 2*(1 - fill)} ${-26*fill} L7 0 L-7 0 Z`, fill: '#b47838' }, g);
    for (let i = -6; i <= 6; i += 3) mk('path', { d: `M${i} -24 L${i*.8} -1`, stroke: '#fffaf0', 'stroke-width': .8, opacity: .5 }, g);
    mk('path', { d: 'M-9 -26 L-7 0 M9 -26 L7 0', stroke: '#fffaf0', 'stroke-width': 1.2, opacity: .7 }, g);
    mk('rect', { x: -9.5, y: -27, width: 19, height: 2, fill: '#fffaf0', opacity: .7 }, g);
    return { g, tea };
  };
  [[1062, 1], [1084, .0], [1106, 1], [1128, 0]].forEach(([x, f]) => glass($('glasses'), x, 700, 1, f ? .8 : 0));

  // ---------- traffic: a kaali-peeli, then later a second one ----------
  function padmini(parent) {
    // Premier Padmini, side on, facing left: black body, yellow roof
    const g = mk('g', {}, parent);
    mk('path', { d: 'M0 -16 C0 -30 6 -38 20 -40 L52 -42 L74 -66 C80 -72 88 -74 98 -74 L160 -74 C172 -74 180 -70 186 -62 L204 -42 L236 -38 C246 -36 250 -30 250 -20 L250 -8 C250 -2 246 0 240 0 L10 0 C4 0 0 -4 0 -10 Z', fill: '#1e1d1c' }, g);
    mk('path', { d: 'M74 -66 C80 -72 88 -74 98 -74 L160 -74 C172 -74 180 -70 186 -62 L204 -42 L52 -42 Z', fill: '#f2c21a' }, g);
    mk('path', { d: 'M84 -46 L96 -64 L132 -64 L132 -46 Z', fill: '#43515a' }, g);
    mk('path', { d: 'M138 -46 L138 -64 L172 -64 C176 -64 178 -62 180 -60 L192 -46 Z', fill: '#43515a' }, g);
    mk('path', { d: 'M92 -60 L100 -64', stroke: '#c9d6dc', 'stroke-width': 2, opacity: .6 }, g);
    mk('rect', { x: 8, y: -28, width: 238, height: 3, fill: '#5a5856', opacity: .8 }, g);
    mk('rect', { x: 2, y: -12, width: 26, height: 5, rx: 2, fill: '#c9c6bf' }, g);
    mk('rect', { x: 226, y: -12, width: 24, height: 5, rx: 2, fill: '#c9c6bf' }, g);
    mk('circle', { cx: 8, cy: -24, r: 5, fill: '#f3ead2' }, g);
    mk('rect', { x: 110, y: -84, width: 40, height: 10, rx: 2, fill: '#2b2a28' }, g);
    for (const cx of [50, 200]) { mk('circle', { cx, cy: 0, r: 17, fill: '#141414' }, g); mk('circle', { cx, cy: 0, r: 8, fill: '#b9b6ae' }, g); }
    return g;
  }
  const cars = [{ g: padmini($('traffic')), off: 0, sp: 150, y: 628 }, { g: padmini($('traffic')), off: 1900, sp: 170, y: 654 }];

  // ---------- arms, kettle, the pour ----------
  const armBack = $('armBack'), armFront = $('armFront'), held = $('held'), kettle = $('kettle'), stream = $('stream');
  const sleeve = '#56687a', skin = '#8a5a3e';
  const limb = (parent, pts, w, c) => mk('path', { d: 'M' + pts.map(p => p.join(' ')).join(' L'), stroke: c, 'stroke-width': w, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
  const two = (s, h, l1, l2, bendDir) => { // simple two-bone IK
    const dx = h[0] - s[0], dy = h[1] - s[1], d = Math.min(Math.hypot(dx, dy), l1 + l2 - .01);
    const a = Math.atan2(dy, dx), c = Math.acos(clamp((l1*l1 + d*d - l2*l2)/(2*l1*d), -1, 1));
    return [s[0] + Math.cos(a + bendDir*c)*l1, s[1] + Math.sin(a + bendDir*c)*l1];
  };
  const heldGlass = glass(held, 0, 0, 1.25, 0);

  const steam = $('steam'); const wisps = [];
  for (let i = 0; i < 9; i++) wisps.push({ e: mk('path', { 'stroke-width': 6 + (i%3)*4 }, steam), ph: i*.7, src: i < 5 ? 'kettle' : 'glass', sp: .18 + (i%4)*.05 });

  let vb = {};
  function fit() {
    const a = innerWidth/innerHeight;
    if (a >= 1) { vb.h = 900; vb.w = 900*a; vb.x = 720 - vb.w/2; vb.y = 0; }
    else { vb.w = 640; vb.h = vb.w/a; vb.x = 1010 - vb.w/2; vb.y = 902 - vb.h; }
    sv.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  }

  let prog = 0, target = 0;
  const read = () => { const r = track.getBoundingClientRect(); target = clamp(-r.top/(r.height - innerHeight), 0, 1); };
  const aside = $('aside');
  function frame(ms) {
    prog += (target - prog)*(reduce ? 1 : .08);
    const p = prog, t = reduce ? 3 : ms/1000;

    // the pour: lift (.12-.36), pour (.36-.78), set down (.8-.94)
    const lift = ss(clamp((p - .12)/.24, 0, 1)) * (1 - ss(clamp((p - .8)/.14, 0, 1)));
    const pour = clamp((p - .36)/.42, 0, 1);
    const pouring = p > .36 && p < .8;
    const tilt = lift * (pouring ? lerp(-12, -30, ss(clamp(pour*3, 0, 1))) : -4);
    const kx = lerp(904, 960, lift), ky = lerp(686, 470, lift) + Math.sin(t*1.3)*1.5*lift;
    kettle.setAttribute('transform', `translate(${kx} ${ky}) rotate(${tilt})`);
    // spout tip in world space
    const th = tilt*Math.PI/180, sp = [70, -58];
    const spx = kx + sp[0]*Math.cos(th) - sp[1]*Math.sin(th), spy = ky + sp[0]*Math.sin(th) + sp[1]*Math.cos(th);
    // the glass is held low, near the tray, steady
    const gx = 1058 + Math.sin(t*.9)*.6, gy = 692;
    held.setAttribute('transform', `translate(${gx} ${gy})`);
    const fill = ss(clamp((pour - .08)/.86, 0, 1))*.82;
    heldGlass.tea.setAttribute('d', `M${-9 + 2*(1 - fill)} ${-26*fill} L${9 - 2*(1 - fill)} ${-26*fill} L7 0 L-7 0 Z`);
    heldGlass.g.setAttribute('transform', 'scale(1.25)');
    // stream: a falling arc from the spout into the glass, thinning as it stretches
    if (pouring && lift > .9) {
      const on = clamp((p - .36)/.03, 0, 1) * clamp((.8 - p)/.03, 0, 1);
      const ex = gx, ey = gy - 32*1.25 + 4 + fill*26;
      const cx = spx + 30, cy = spy + 6;
      const wob = Math.sin(t*14)*1.2;
      stream.setAttribute('d', `M${spx} ${spy} Q ${cx + wob} ${cy} ${ex + wob*.5} ${ey}`);
      stream.setAttribute('stroke-width', (3.2*on).toFixed(2));
      stream.setAttribute('opacity', on.toFixed(2));
    } else { stream.setAttribute('d', ''); }

    // arms: right hand on the kettle handle, left hand round the glass
    armBack.textContent = ''; armFront.textContent = '';
    const shR = [912, 610], shL = [996, 612];
    const handK = [kx - 44*Math.cos(th) + 30*Math.sin(th), ky - 44*Math.sin(th) - 30*Math.cos(th)];
    const elR = two(shR, handK, 62, 60, 1);
    limb(armBack, [shR, elR], 22, sleeve); limb(armBack, [elR, handK], 15, skin);
    mk('circle', { cx: handK[0], cy: handK[1], r: 9, fill: skin }, armBack);
    const handG = [gx + 10, gy - 14];
    const elL = two(shL, handG, 56, 52, -1);
    limb(armFront, [shL, elL], 22, sleeve); limb(armFront, [elL, handG], 15, skin);
    mk('circle', { cx: handG[0] + 2, cy: handG[1], r: 9, fill: '#93613f' }, armFront);

    // traffic passes behind the cart and leaves the frame
    for (const c of cars) {
      const x = 2000 - ((c.off + t*c.sp) % 3200);
      c.g.setAttribute('transform', `translate(${x} ${c.y}) scale(.92)`);
    }

    // steam off the kettle lid (or spout) and later off the full glass
    for (const w of wisps) {
      const src = w.src === 'kettle' ? [kx, ky - 78] : [gx, gy - 34];
      const strength = w.src === 'kettle' ? 1 - lift*.6 : clamp((fill - .4)*2, 0, 1);
      const life = ((t*w.sp + w.ph) % 1);
      const y0 = src[1] - life*120, sway = Math.sin(t*.9 + w.ph*3)*10;
      w.e.setAttribute('d', `M${src[0] + sway*.2} ${y0 + 20} C ${src[0] + sway} ${y0} ${src[0] - sway} ${y0 - 24} ${src[0] + sway*.6} ${y0 - 50}`);
      w.e.setAttribute('opacity', (Math.sin(life*Math.PI)*.8*strength).toFixed(2));
    }

    aside.classList.toggle('on', p > .86);
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { fit(); read(); });
  addEventListener('scroll', read, {passive:true});
  fit(); read(); prog = target;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
