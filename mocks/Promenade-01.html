<!-- Direction 01: Cutting chai — a fluted glass of chai on the Marine Drive parapet, steam over the sea; scroll racks focus to the bay as the glass empties -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promenade, cutting chai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#efe8da; --ink:#1f2b33; --sea:#2c6d8c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--paper); color:var(--ink); }
  body { font-family:"Hanken Grotesk",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .scroller { height:320vh; position:relative; }
  .stage { position:sticky; top:0; height:100vh; height:100svh; overflow:hidden; }
  .layer { position:absolute; inset:0; width:100%; height:100%; will-change:opacity, transform; }
  .layer svg { width:100%; height:100%; display:block; }
  .grain { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; opacity:.5; }
  .copy { position:absolute; left:6.2vw; top:11vh; max-width:560px; z-index:5; }
  h1 { font-family:"Newsreader",serif; font-weight:300; font-size:clamp(40px,4.6vw,76px); line-height:1.02; letter-spacing:-.018em; text-wrap:balance; }
  h1 em { font-style:italic; }
  .line { margin-top:26px; font-size:clamp(16px,1.25vw,19px); line-height:1.55; max-width:36ch; color:#2d3a42; }
  .aside { margin-top:22px; font-family:"Newsreader",serif; font-style:italic; font-weight:300; font-size:clamp(18px,1.45vw,23px); line-height:1.4; max-width:30ch; color:#5a4630; opacity:0; transform:translateY(12px); }
  .hint { position:absolute; left:6.2vw; bottom:5vh; font-size:14px; color:#6b6b62; z-index:5; transition:opacity .6s; }
  .after { height:40vh; background:var(--paper); }
  @media (max-width:700px){
    .copy { left:20px; right:20px; top:56px; }
    h1 { font-size:40px; }
    .line { margin-top:16px; font-size:16px; }
    .aside { font-size:18px; margin-top:14px; }
    .hint { left:20px; }
  }
</style>
</head>
<body>
<div class="scroller" id="scroller">
  <div class="stage">
    <!-- BACKGROUND: sky, bay, sea (sharp) -->
    <div class="layer" id="bgSharp"><svg class="scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6dcc8"/><stop offset=".55" stop-color="#efe5d2"/><stop offset="1" stop-color="#f6ecd8"/>
        </linearGradient>
        <radialGradient id="sun" cx="1170" cy="150" r="520" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#fff8e6" stop-opacity="1"/><stop offset=".25" stop-color="#fbeed2" stop-opacity=".8"/><stop offset="1" stop-color="#f3e4c6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fb4b2"/><stop offset=".12" stop-color="#6f97a3"/><stop offset=".55" stop-color="#3b7790"/><stop offset="1" stop-color="#275f7a"/>
        </linearGradient>
        <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff4d8" stop-opacity="0"/><stop offset=".5" stop-color="#fff4d8" stop-opacity=".75"/><stop offset="1" stop-color="#fff4d8" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="glareR" cx=".5" cy=".35" r=".5"><stop offset="0" stop-color="#fff4d8" stop-opacity=".8"/><stop offset="1" stop-color="#fff4d8" stop-opacity="0"/></radialGradient>
        <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#efe5d2" stop-opacity="0"/><stop offset="1" stop-color="#efe5d2" stop-opacity=".85"/>
        </linearGradient>
      </defs>
      <rect width="1440" height="900" fill="url(#sky)"/>
      <rect width="1440" height="900" fill="url(#sun)"/>
       <!-- distant Malabar Hill and the far end of the curve -->
      <g id="hill"><path d="M1080 432 C1150 420 1210 398 1270 388 C1320 380 1370 384 1440 400 L1440 432 Z" fill="#a9b3ae" opacity=".55"/></g>
      <!-- tiny necklace lamps along the far curve -->
      <g fill="#f8f0dc" opacity=".7">
        <rect x="900" y="428" width="1.5" height="4"/><rect x="940" y="428" width="1.5" height="4"/><rect x="975" y="427" width="1.5" height="4"/><rect x="1008" y="427" width="1.5" height="4"/><rect x="1038" y="426" width="1.5" height="5"/>
      </g>
      <path d="M760 433 C860 430 960 428 1040 426 L1440 430 L1440 434 L760 434 Z" fill="#b9b8a8" opacity=".6"/>
      <!-- sea -->
      <rect y="432" width="1440" height="468" fill="url(#seaG)"/>
      <ellipse cx="1170" cy="560" rx="170" ry="190" fill="url(#glareR)" opacity=".6"/>
      <g id="glints" fill="#fff6df"></g>
      <rect y="424" width="1440" height="16" fill="url(#haze)" opacity=".5"/>
      <!-- fishing boats drifting on the horizon -->
      <g id="boats" fill="#5d6b6c" opacity=".7">
        <g class="boat" data-x="300" data-v="5"><path d="M0 0 L26 0 L22 4 L4 4 Z"/><path d="M11 0 L11 -14 L18 -2 Z" opacity=".8"/></g>
        <g class="boat" data-x="760" data-v="3.2"><path d="M0 0 L18 0 L15 3 L3 3 Z"/></g>
      </g>
    </svg></div>

    <!-- BACKGROUND: blurred copy (focus on the glass) -->
    <div class="layer" id="bgSoft" style="filter:blur(7px); transform:scale(1.04)"></div>

    <!-- FOREGROUND: parapet and the glass -->
    <div class="layer" id="fg"><svg class="scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <filter id="concrete" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="4" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .32  0 0 0 0 .29  0 0 0 0 .25  0 0 0 -1.6 1.05"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
        <filter id="pits" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="turbulence" baseFrequency=".035 .12" numOctaves="2" seed="9"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .31  0 0 0 0 .26  0 0 0 -2.4 1.3"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
        <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d9cdb6"/><stop offset=".4" stop-color="#cdbfa6"/><stop offset="1" stop-color="#a99a82"/>
        </linearGradient>
        <linearGradient id="edgeLight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbf1dc"/><stop offset="1" stop-color="#d6c8ae"/>
        </linearGradient>
        <radialGradient id="caustic" cx="0.5" cy="0.4" r="0.6">
          <stop offset="0" stop-color="#f7b65c" stop-opacity=".95"/><stop offset=".55" stop-color="#e09445" stop-opacity=".45"/><stop offset="1" stop-color="#c58a4b" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="shadowG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6c5d48" stop-opacity=".55"/><stop offset="1" stop-color="#6c5d48" stop-opacity="0"/>
        </linearGradient>
        <!-- glass -->
        <clipPath id="glassClip"><path d="M908 548 Q1000 562 1092 548 L1070 802 Q1000 814 930 802 Z"/></clipPath>
        <linearGradient id="chai" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7d4a22"/><stop offset=".18" stop-color="#a8683a"/><stop offset=".42" stop-color="#c88d58"/><stop offset=".6" stop-color="#d49e68"/><stop offset=".84" stop-color="#a5663a"/><stop offset="1" stop-color="#6e3f1d"/>
        </linearGradient>
        <linearGradient id="chaiDepth" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#3a1e0c" stop-opacity=".35"/>
        </linearGradient>
        <radialGradient id="foam" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#c9925d"/><stop offset=".75" stop-color="#d9ab7a"/><stop offset="1" stop-color="#ead0a8"/>
        </radialGradient>
        <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset=".12" stop-color="#ffffff" stop-opacity=".05"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".02"/><stop offset=".88" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
        </linearGradient>
        <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8e4d4" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity=".6"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
        <filter id="steamBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
        <linearGradient id="steamFade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#fffaf0" stop-opacity=".0"/><stop offset=".15" stop-color="#fffaf0" stop-opacity=".75"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- parapet: sea-side edge, top face receding toward us -->
      <path d="M0 640 L1440 628 L1440 900 L0 900 Z" fill="url(#topFace)"/>
      <path d="M0 640 L1440 628 L1440 900 L0 900 Z" fill="#000" filter="url(#concrete)" opacity=".28"/>
      <path d="M0 640 L1440 628 L1440 900 L0 900 Z" fill="#000" filter="url(#pits)" opacity=".12"/>
      <!-- sunlit arris along the far edge -->
      <path d="M0 640 L1440 628 L1440 634 L0 647 Z" fill="url(#edgeLight)" opacity=".9"/>
      <!-- expansion joint -->
      <path d="M318 642 L250 900" stroke="#7a6c58" stroke-width="2.2" opacity=".55"/>
      <path d="M321 642 L254 900" stroke="#efe2c8" stroke-width="1" opacity=".5"/>
      <!-- old ring from someone else's glass -->
      <ellipse cx="560" cy="742" rx="78" ry="16" fill="none" stroke="#8a7457" stroke-width="3" opacity=".28"/>
      <ellipse cx="566" cy="744" rx="72" ry="14" fill="none" stroke="#8a7457" stroke-width="1.2" opacity=".2"/>

      <!-- a house crow on the parapet -->
      <g id="crow" transform="translate(400 641) scale(1.15)">
        <ellipse cx="0" cy="1" rx="30" ry="3.5" fill="#6c5d48" opacity=".22"/>
        <path d="M3 -11 L1 0 M10 -11 L12 0" stroke="#26262a" stroke-width="2" stroke-linecap="round"/>
        <path d="M-42 -7 L-14 -23 C-6 -35 6 -43 16 -47 C22 -49 28 -45 28 -39 C28 -27 20 -15 8 -11 C0 -9 -10 -11 -16 -15 L-40 -3 Z" fill="#1b1b20"/>
        <path d="M15 -49 C9 -45 7 -37 11 -30 C19 -32 26 -36 28 -41 C25 -47 20 -50 15 -49 Z" fill="#5c5d61"/>
        <path d="M-14 -21 C-2 -31 8 -35 16 -33" fill="none" stroke="#45464c" stroke-width="1.3"/>
        <path d="M-30 -11 L-12 -19" stroke="#3a3b40" stroke-width="1" />
        <g id="crowHead">
          <path d="M14 -52 C14 -60 22 -65 29 -62 C33 -60 34 -57 34 -55 L49 -52 L33 -48 C30 -44 22 -43 18 -46 Z" fill="#1b1b20"/>
          <path d="M33 -55 L49 -52 L34 -50" fill="none" stroke="#3b3c41" stroke-width=".8"/>
          <circle cx="27" cy="-56" r="1.7" fill="#d9d3c4"/>
        </g>
      </g>

      <!-- glass group (sharp) -->
      <g id="glass">
        <!-- cast shadow toward us, with amber caustic -->
        <path d="M930 802 Q1000 812 1070 802 L1140 900 L850 900 Z" fill="url(#shadowG)"/>
        <ellipse cx="1000" cy="852" rx="70" ry="30" fill="url(#caustic)" style="mix-blend-mode:screen" id="caustic"/>
        <!-- body behind liquid: back wall tint -->
        <path d="M908 548 Q1000 562 1092 548 L1070 802 Q1000 814 930 802 Z" fill="#dfe6e4" opacity=".14"/>
        <path d="M920 556 Q1000 548 1080 556" fill="none" stroke="#fff" stroke-width="2" opacity=".35"/>
        <!-- chai -->
        <g clip-path="url(#glassClip)">
          <g id="liquid">
            <rect x="880" y="560" width="240" height="260" fill="url(#chai)"/>
            <rect x="880" y="560" width="240" height="260" fill="url(#chaiDepth)"/>
            <!-- refracted bright streaks through the liquid -->
            <rect x="952" y="560" width="9" height="260" fill="#f2c48e" opacity=".35"/>
            <rect x="1032" y="560" width="5" height="260" fill="#f2c48e" opacity=".25"/>
          </g>
          <ellipse id="meniscus" cx="1000" cy="560" rx="93" ry="14" fill="url(#foam)"/>
          <path id="menLight" d="M0 0" fill="none" stroke="#fff3dc" stroke-width="2.2" opacity=".7" stroke-linecap="round"/>
          <!-- thick glass base -->
          <path d="M924 772 Q1000 786 1076 772 L1070 802 Q1000 814 926 802 Z" fill="url(#baseG)"/>
          <!-- flutes -->
          <g id="flutes" fill="none" stroke-linecap="round"></g>
        </g>
        <!-- glass walls and rim -->
        <path d="M908 548 Q1000 562 1092 548 L1070 802 Q1000 814 930 802 Z" fill="url(#glassBody)"/>
        <path d="M908 548 L930 802" stroke="#ffffff" stroke-width="3" opacity=".55"/>
        <path d="M1092 548 L1070 802" stroke="#ffffff" stroke-width="2.4" opacity=".45"/>
        <ellipse cx="1000" cy="548" rx="92" ry="14" fill="none" stroke="#ffffff" stroke-width="3.2" opacity=".75"/>
        <path d="M910 549 Q1000 565 1090 549" fill="none" stroke="#f7f2e4" stroke-width="5" opacity=".55"/>
        <path d="M930 806 Q1000 818 1070 806" fill="none" stroke="#fffaf0" stroke-width="2" opacity=".8"/>
        <!-- sun on the rim -->
        <ellipse cx="1072" cy="544" rx="8" ry="2.4" fill="#fff" opacity=".95"/>
      </g>

      <!-- steam -->
      <g id="steam" filter="url(#steamBlur)" fill="none" stroke="url(#steamFade)" stroke-linecap="round"></g>
    </svg></div>

    <!-- foreground softened (when focus racks to the bay) -->
    <div class="layer" id="fgSoft" style="filter:blur(3px); opacity:0"></div>

    <svg class="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .28  0 0 0 .22 0"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg>

    <div class="copy">
      <h1>One year in,<br><em>here's what I shipped</em></h1>
      <p class="line">An LLM gateway that replaced OpenRouter. A terminal tool 500+ developers open daily. A live auction SaaS I built alone.</p>
      <p class="aside" id="aside">9.45 CGPA taught me less than shipping did. Still early. Still building.</p>
    </div>
  </div>
</div>
<!-- direction: Promenade 01, cutting chai on the parapet -->
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  const range = (p,a,b)=>clamp((p-a)/(b-a),0,1);

  // glints on the sea
  const glints = $('glints'); const gl = [];
  let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
  for (let i=0;i<120;i++){
    const y = 440 + Math.pow(rnd(),1.6)*440;
    const near = (y-432)/468;
    const xC = 1170 + (rnd()-.5)*(260+near*500);
    const x = rnd()<.6 ? xC : rnd()*1440;
    const r = document.createElementNS(NS,'rect');
    const w = 4 + near*30*rnd() + 3;
    r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',.8+near*1.6);
    const glareness = Math.max(0,1-Math.abs(x-1170)/(300+near*400));
    r.setAttribute('opacity', (.15 + glareness*.7).toFixed(2));
    glints.appendChild(r); gl.push({r, x, ph:rnd()*6.28, sp:.4+rnd()*.9, base:+r.getAttribute('opacity')});
  }

  // Malabar Hill towers and the low Art Deco line of the curve, in haze
  const hill = $('hill');
  const hy = x => x<1080?432: 432 - (x<1270 ? (x-1080)/190*44 : 44 - (x-1270)/170*12);
  for (let x=760; x<1440; ){
    const onHill = x>1080;
    const w = onHill ? 8+rnd()*16 : 10+rnd()*18;
    const h = onHill ? 8 + rnd()*(rnd()<.25?46:18) : 3 + rnd()*6;
    const base = hy(x+w/2);
    const r = document.createElementNS(NS,'rect');
    r.setAttribute('x',x.toFixed(1)); r.setAttribute('y',(base-h).toFixed(1)); r.setAttribute('width',w.toFixed(1)); r.setAttribute('height',(h+2).toFixed(1));
    const far = (x-760)/680;
    r.setAttribute('fill', '#9eaaa7'); r.setAttribute('opacity', (.32 + far*.25 + rnd()*.1).toFixed(2));
    hill.appendChild(r); x += w + (onHill? rnd()*6 : 1+rnd()*3);
  }
  // flutes: vertical facets around the glass, foreshortened toward the sides
  const flutes = $('flutes');
  for (let i=0;i<14;i++){
    const a = -Math.PI/2 + (i+.5)/14*Math.PI; // front half
    const s = Math.sin(a);
    const xt = 1000 + s*92, xb = 1000 + s*70;
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d',`M${xt} ${552+Math.cos(a)*9} L${xb} ${798+Math.cos(a)*8}`);
    const facing = Math.cos(a);
    p.setAttribute('stroke', i%2 ? '#ffffff' : '#3c2a1a');
    p.setAttribute('stroke-width', (1.2+facing*2.6).toFixed(2));
    p.setAttribute('opacity', (i%2 ? .16+ (1-facing)*.35 : .12).toFixed(2));
    flutes.appendChild(p);
  }

  // steam wisps
  const steam = $('steam'); const wisps = [];
  for (let i=0;i<6;i++){
    const p = document.createElementNS(NS,'path');
    p.setAttribute('stroke-width', 10 + i%3*7);
    steam.appendChild(p);
    wisps.push({p, x: 950 + i*20, ph: i*1.7, sp: .22 + (i%3)*.06});
  }
  function drawSteam(t, strength, level){
    for (const w of wisps){
      const life = ((t*w.sp + w.ph) % 4)/4;           // 0..1 rise cycle
      const y0 = level - 6 - life*40;
      const h = 170 + life*150;
      const sway = Math.sin(t*.7 + w.ph)*18;
      const x = w.x + Math.sin(t*.4+w.ph)*6;
      const d = `M${x} ${y0} C${x+sway} ${y0-h*.3}, ${x-sway*1.6} ${y0-h*.55}, ${x+sway*.8+12} ${y0-h*.8} S${x+sway*2} ${y0-h}, ${x+sway*2.4+20} ${y0-h*1.12}`;
      w.p.setAttribute('d', d);
      w.p.setAttribute('opacity', (Math.sin(life*Math.PI)*.95*strength).toFixed(3));
    }
  }

  // clone background into the soft layer, foreground into fgSoft
  const bgSoft = $('bgSoft'), fgSoft = $('fgSoft');
  bgSoft.innerHTML = $('bgSharp').innerHTML.replace(/id="/g,'data-id="').replace(/url\(#/g,'url(#');
  bgSoft.querySelectorAll('.boat').forEach(b=>b.remove());
  fgSoft.innerHTML = '<svg class="scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"><use href="#glass"/></svg>';

  const boats = [...document.querySelectorAll('#bgSharp .boat')].map(g=>({g,x:+g.dataset.x,v:+g.dataset.v}));

  // phone framing: keep the glass centred
  function frame(){
    const ar = innerWidth/innerHeight;
    document.querySelectorAll('svg.scene').forEach(s=>{
      if (ar < .9){ const w = 900*ar*1.25; s.setAttribute('viewBox', `${1000-w/2} ${900-900*1.25 + 0} ${w} ${900*1.25}`); s.setAttribute('preserveAspectRatio','xMidYMax slice'); }
      else { s.setAttribute('viewBox','0 0 1440 900'); s.setAttribute('preserveAspectRatio','xMidYMid slice'); }
    });
  }
  frame(); addEventListener('resize', frame);

  const sc = $('scroller');
  let target = 0, cur = 0;
  const read = () => { const r = sc.getBoundingClientRect(); target = clamp(-r.top/(r.height-innerHeight),0,1); };
  addEventListener('scroll', read, {passive:true}); read(); cur = target;

  const liquid = $('liquid'), men = $('meniscus'), aside = $('aside'), bgSharp = $('bgSharp'), caustic = $('caustic');
  const t0 = performance.now();
  function tick(now){
    cur += (target-cur)*.09;
    const p = cur, t = reduce ? 0 : (now-t0)/1000;
    // the glass empties
    const drink = ease(range(p,.15,.85));
    const level = 612 + drink*160;
    liquid.setAttribute('transform', `translate(0 ${level-560})`);
    const halfW = 90 - (level-548)/254*22;
    men.setAttribute('cy', level);
    $('menLight').setAttribute('d', `M${(1000+halfW*.15).toFixed(1)} ${(level+ (12-drink*3)*.92).toFixed(1)} Q${(1000+halfW*.6).toFixed(1)} ${(level+ (12-drink*3)*.7).toFixed(1)} ${(1000+halfW*.9).toFixed(1)} ${(level+(12-drink*3)*.25).toFixed(1)}`); men.setAttribute('rx', halfW.toFixed(1)); men.setAttribute('ry', (14 - drink*3).toFixed(1));
    caustic.setAttribute('opacity', (1 - drink*.75).toFixed(2));
    // rack focus: glass -> bay
    const focus = ease(range(p,.25,.75));
    bgSoft.style.opacity = (1-focus).toFixed(3);
    fgSoft.style.opacity = (focus*.9).toFixed(3);
    $('fg').querySelector('#glass').style.opacity = (1 - focus*.35).toFixed(3);
    drawSteam(t, 1 - drink*.6, level);
    // sea glints
    for (const g of gl){ g.r.setAttribute('opacity', (g.base*(.55+.45*Math.sin(t*g.sp+g.ph))).toFixed(3)); }
    const hop = (t % 7) / 7; const cr = $('crowHead');
    cr.setAttribute('transform', `rotate(${(Math.sin(t*1.3)>.6 ? -12 : (hop>.8 ? 9 : 0))} 20 -48)`);
    for (const b of boats){ const x = ((b.x + t*b.v) % 1560) - 60; b.g.setAttribute('transform', `translate(${x.toFixed(1)} 431)`); }
    const a = range(p,.72,.9);
    aside.style.opacity = a.toFixed(3); aside.style.transform = `translateY(${(1-a)*12}px)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
