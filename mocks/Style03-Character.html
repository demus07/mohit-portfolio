const T = THREE;

const _mats = {};

// text drawn to a canvas texture (station boards, LED, marathi)
function textTex(lines, o = {}) {
  const w = o.w || 512, h = o.h || 128, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = o.bg || '#f2c230'; x.fillRect(0, 0, w, h);
  x.fillStyle = o.color || '#1c1a17'; x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach((l, i) => { x.font = l.font; x.fillText(l.t, w / 2, l.y * h); });

      const i = (yy * w + xx) * 4; if ((xx % g) === g - 1 || (yy % g) === g - 1) { d.data[i] *= .15; d.data[i + 1] *= .15; d.data[i + 2] *= .15; }

// sky dome with a soft vertical gradient (stops: [[y01,color],...])
function skyDome(stops, r = 900) {
  const g = new T.SphereGeometry(r, 24, 16); const col = []; const p = g.attributes.position; const c = new T.Color();
  const cs = stops.map(s => [s[0], new T.Color(s[1])]);
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) / r + 1) / 2; let k = 0; while (k < cs.length - 2 && t > cs[k + 1][0]) k++;
    const a = cs[k], b = cs[k + 1]; c.copy(a[1]).lerp(b[1], clamp((t - a[0]) / (b[0] - a[0]))); col.push(c.r, c.g, c.b);

  const m = new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -10; return m;
}
function recolorSky(sky, stops) {
  const g = sky.geometry, p = g.attributes.position, col = g.attributes.color, r = g.parameters.radius, c = new T.Color();
  const cs = stops.map(s => [s[0], s[1] instanceof T.Color ? s[1] : new T.Color(s[1])]);

    const t = (p.getY(i) / r + 1) / 2; let k = 0; while (k < cs.length - 2 && t > cs[k + 1][0]) k++;
    const a = cs[k], b = cs[k + 1]; c.copy(a[1]).lerp(b[1], clamp((t - a[0]) / (b[0] - a[0]))); col.setXYZ(i, c.r, c.g, c.b);

// faceted sea: a jittered grid whose vertices bob; returns {mesh, tick(t)}
function makeSea(w, d, sx, sz, color, amp = .25) {

  const p = g.attributes.position, base = Float32Array.from(p.array), ph = [];
  for (let i = 0; i < p.count; i++) { const x = base[i * 3], z = base[i * 3 + 2]; base[i * 3] += (hash3(x, 1, z) - .5) * w / sx * .6; base[i * 3 + 2] += (hash3(z, 2, x) - .5) * d / sz * .6; ph.push(hash3(x, z, 3) * 6.28); }

  const m = new T.Mesh(g, mat(color, { shininess: 30, specular: 0x334455 }));
  function tick(t) {
    for (let i = 0; i < p.count; i++) {

// concrete tetrapod: four legs from a centre
function tetrapod(s = 1, color = 0xb9b2a7) {
  const g = new T.Group(); const leg = new T.CylinderGeometry(.22 * s, .42 * s, 1.15 * s, 6, 1); leg.translate(0, .58 * s, 0);
  const dirs = [[0, 1, 0], [.943, -.333, 0], [-.471, -.333, .816], [-.471, -.333, -.816]];
  dirs.forEach(d => { const m = new T.Mesh(leg, mat(color)); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), new T.Vector3(...d)); g.add(m); });

}
function palm(h = 6, lean = .15) {
  const g = new T.Group(); let y = 0, x = 0;
  for (let i = 0; i < 5; i++) { const s = mesh(new T.CylinderGeometry(.16 - i * .015, .2 - i * .015, h / 5, 5), mat(0x8a7560), x, y + h / 10, 0, g); s.rotation.z = -lean; y += h / 5 * Math.cos(lean); x += h / 5 * Math.sin(lean); }
  for (let i = 0; i < 7; i++) {
    const f = new T.ConeGeometry(.35, 2.6, 3); f.translate(0, 1.3, 0); f.scale(1, 1, .25);
    const m = mesh(f, mat(i % 2 ? 0x5f8a5a : 0x6f9a63), x, y, 0, g); m.rotation.set(0, i / 7 * Math.PI * 2, 1.25 + (i % 3) * .12, 'YXZ');

}
function rainTree(s = 1, col = 0x6d8f5f) {
  const g = new T.Group();
  mesh(new T.CylinderGeometry(.18 * s, .3 * s, 2.4 * s, 5), mat(0x6e5a48), 0, 1.2 * s, 0, g);
  [[0, 3.1, 0, 2.1], [1.3, 2.8, .3, 1.5], [-1.3, 2.9, -.2, 1.6], [.2, 3.0, 1.1, 1.3]].forEach(([x, y, z, r], i) => {

}
// marine drive lamp post (curved arm), returns {group, bulb, glow}
function lampPost(h = 5.2, lit = 0xffc46b) {

  mesh(new T.CylinderGeometry(.2, .24, .35, 6), mat(0x3c4652), 0, .18, 0, g);

  const head = mesh(new T.CylinderGeometry(.08, .26, .2, 6), mat(0x3c4652), .85, h - .1, 0, g);

  const glow = new T.Sprite(new T.SpriteMaterial({ map: glowTex(), color: lit, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending }));

let _glow;
function glowTex() {
  if (_glow) return _glow; const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const r = x.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');

// 1930s Art Deco block: curved corner, eyebrow shades, ribbon balconies, stepped parapet
function decoBlock(w = 8, h = 10, d = 6, color = 0xeadcc0, o = {}) {

  const corner = mesh(new T.CylinderGeometry(1.2, 1.2, h, 8, 1, false, 0, Math.PI / 2), body, w / 2 - 1.2, h / 2, d / 2 - 1.2, g);
  mesh(new T.BoxGeometry(1.2, h, d - 1.2), body, w / 2 - .6, h / 2, -.6, g);
  const floors = Math.floor(h / 2.2);

/* ---------- stage: renderer + sticky scroll progress + pause offscreen ---------- */
function makeStage(o) {
  const canvas = o.canvas, R = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  R.setPixelRatio(Math.min(devicePixelRatio, o.dpr || 1.6));
  if (o.shadows) { R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; }
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(o.fov || 35, 1, .1, 2000);
  const st = { R, scene, cam, p: 0, pt: 0, t: 0, visible: true, frames: [], w: 1, h: 1 };
  function size() { const w = canvas.clientWidth, h = canvas.clientHeight; st.w = w; st.h = h; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); st.dirty = true; }
  addEventListener('resize', size); size();
  const track = o.track;

  addEventListener('scroll', prog, { passive: true }); prog(); st.p = st.pt;
  new IntersectionObserver(e => { st.visible = e[0].isIntersecting; }).observe(canvas);
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!st.visible) return;
    const dp = st.pt - st.p; st.p += dp * (REDUCED ? 1 : Math.min(1, dt * 6));
    if (!REDUCED) st.t += dt; else if (Math.abs(dp) < 1e-4 && !st.dirty) return;

    st.frames.forEach(f => f(st.p, st.t, dt));

function camKeys(keys, p) { // keys: [[p, [px,py,pz], [tx,ty,tz], fov?], ...] -> eased interpolation
  let i = 0; while (i < keys.length - 2 && p > keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1], t = ease(clamp((p - a[0]) / (b[0] - a[0])));
  const L = (u, v) => u.map((x, k) => lerp(x, v[k], t));

/* bake a static group into one mesh per (untextured) material: far fewer draw calls */
function bake(root, o = {}) {

    let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    g.applyMatrix4(new T.Matrix4().multiplyMatrices(inv, m.matrixWorld));
    if (!byMat.has(m.material)) byMat.set(m.material, []);
    byMat.get(m.material).push(g.attributes.position.array);
  });
  const out = new T.Group(); out.position.copy(root.position); out.quaternion.copy(root.quaternion); out.scale.copy(root.scale);
  byMat.forEach((arrs, material) => {
    const n = arrs.reduce((s, a) => s + a.length, 0), pos = new Float32Array(n); let k = 0;
    arrs.forEach(a => { pos.set(a, k); k += a.length; });
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.computeVertexNormals();
    const mm = new T.Mesh(g, material); mm.castShadow = !!o.cast; mm.receiveShadow = !!o.receive; out.add(mm);
  });

// merge a few transformed geometries into one (for instancing)

  const arrs = list.map(([g, m]) => { const q = (g.index ? g.toNonIndexed() : g.clone()); q.applyMatrix4(m); return q.attributes.position.array; });
  const n = arrs.reduce((s, a) => s + a.length, 0), pos = new Float32Array(n); let k = 0; arrs.forEach(a => { pos.set(a, k); k += a.length; });
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
}
function tetrapodGeo(s = 1) {
  const leg = new T.CylinderGeometry(.22 * s, .42 * s, 1.15 * s, 6, 1); leg.translate(0, .58 * s, 0);
  const dirs = [[0, 1, 0], [.943, -.333, 0], [-.471, -.333, .816], [-.471, -.333, -.816]];
  const list = dirs.map(d => [leg, new T.Matrix4().makeRotationFromQuaternion(new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), new T.Vector3(...d)))]);

/* ---------------- THE CHARACTER: low-poly Mohit ---------------- */
const MOHIT_C = { skin: 0xa36d50, skinD: 0x8f573b, hair: 0x15110f, shirt: 0xf7f5fb, cuff: 0xe7e1f1, trouser: 0x2c3444, shoe: 0xf1ede6, sole: 0x5e5650,
  mouth: 0x4a1d1a, teeth: 0xfffbf3, top: 0x1f1a1a, low: 0xc4c9d1, brow: 0x17110f, mous: 0x553629, eye: 0x150f0d };
let _shirtTex;
function shirtTex() {
  if (_shirtTex) return _shirtTex;
  const c = document.createElement('canvas'); c.width = 64; c.height = 64; const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 64, 64); x.fillStyle = '#b9aee0';
  for (let i = 0; i < 64; i += 8) x.fillRect(i, 0, 1.2, 64);

}
function headShape(v) { // v on a radius-.5 sphere -> stylised head (face toward +z)

  if (v.y < -.04) { const t = (-v.y - .04) / .47; v.x *= 1 - .22 * t; v.y *= 1 - .08 * t; if (v.z < .1) v.z *= 1 - .3 * t; else v.z += .02 * t; }

    const kn = J['kn' + s] = new T.Group(); kn.position.y = -1.2; hip.add(kn);
    mesh(new T.CylinderGeometry(.18, .145, 1.18, 7).translate(0, -.58, 0), trou, 0, 0, 0, kn);
    const an = J['an' + s] = new T.Group(); an.position.y = -1.15; kn.add(an);

    deform(shoe, v => { const f = (v.z + .29) / .58; if (v.y > 0) v.y -= f * f * .09; v.x *= 1 - f * .18; if (v.z > .2 && v.y > -.05) v.z -= .04; });
    mesh(shoe, mat(C.shoe), 0, -.1, .1, an);
    mesh(new T.BoxGeometry(.3, .06, .6), mat(C.sole), 0, -.2, .1, an);
  });

  J.spine = new T.Group(); J.hips.add(J.spine);
  const tg = new T.CylinderGeometry(1, 1, 1.9, 8, 6);
  deform(tg, v => {
    const t = (v.y + .95) / 1.9;
    let wx = t < .3 ? lerp(.56, .51, t / .3) : lerp(.51, .57, Math.min(1, (t - .3) / .45));

  for (let i = 0; i < 4; i++) mesh(new T.CylinderGeometry(.022, .022, .02, 6).rotateX(Math.PI / 2), mat(0xd6cfe4), 0, .02 + i * .36, .38, J.spine);

  mesh(tri([-.13, 1.66, .2], [.13, 1.66, .2], [0, 1.32, .33]), two(C.skin), 0, 0, 0, J.spine);
  const col = mesh(new T.CylinderGeometry(.19, .27, .13, 9, 1, true, Math.PI * .7, Math.PI * 1.6), two(0xfbfaff), 0, 1.7, -.03, J.spine);
  [-1, 1].forEach(sx => mesh(tri([.0, 0, 0], [.19 * sx, -.02, -.07], [.05 * sx, -.3, .07]), two(0xfcfbff), .06 * sx, 1.72, .26, J.spine));
  // --- arms
  ['L', 'R'].forEach((s, i) => {
    const sx = i ? -1 : 1;
    const sh = J['sh' + s] = new T.Group(); sh.position.set(.62 * sx, 1.38, 0); J.spine.add(sh);
        mesh(new T.CylinderGeometry(.15, .145, 1.02, 7).translate(0, -.48, 0), shirtA, 0, 0, 0, sh);
    const cap = new T.SphereGeometry(.15, 7, 4, 0, Math.PI * 2, 0, Math.PI / 2); cap.scale(1, .7, 1); mesh(cap, shirtA, 0, -.02, 0, sh);
    const el = J['el' + s] = new T.Group(); el.position.y = -1.0; sh.add(el);
    mesh(new T.IcosahedronGeometry(.145, 0), shirtA, 0, 0, 0, el);
    mesh(new T.CylinderGeometry(.145, .15, .18, 7).translate(0, -.08, 0), shirtA, 0, 0, 0, el);
    mesh(new T.CylinderGeometry(.165, .16, .12, 7).translate(0, -.2, 0), mat(C.cuff), 0, 0, 0, el); // rolled cuff
    mesh(new T.CylinderGeometry(.11, .08, .72, 6).translate(0, -.58, 0), skin, 0, 0, 0, el);
    const wr = J['wr' + s] = new T.Group(); wr.position.y = -.92; el.add(wr);
    const fist = new T.DodecahedronGeometry(.125, 0); fist.scale(.78, 1.1, 1.02);
    mesh(fist, skin, 0, -.07, .01, wr);
    mesh(new T.BoxGeometry(.06, .1, .06), skin, -.03 * sx, -.02, .09, wr).rotation.x = .3; // thumb
  });
  // --- neck + head

  mesh(new T.CylinderGeometry(.14, .16, .38, 7).translate(0, .1, 0), skin, 0, 0, 0, J.neck);
  J.head = new T.Group(); J.head.position.set(0, .08, .02); J.neck.add(J.head);
  const H = new T.Group(); H.position.set(0, .45, .04); H.scale.setScalar(1.05); J.head.add(H); J.face = H;
  const headM = mesh(deform(new T.IcosahedronGeometry(.5, 2), headShape), skin, 0, 0, 0, H);
  const ray = new T.Raycaster(); root.updateMatrixWorld(true);
  const surf = (x, y) => { ray.set(new T.Vector3(x, y, 2).applyMatrix4(H.matrixWorld), new T.Vector3(0, 0, -1)); const h = ray.intersectObject(headM); return h.length ? H.worldToLocal(h[0].point).z : .4; };

  const hair = deform(new T.IcosahedronGeometry(.5, 2), v => {
    const n = v.clone().normalize();
    const line = .07 + .35 * Math.pow(Math.max(n.z, 0), 1.3) - .56 * Math.max(-n.z, 0) + .06 * Math.abs(n.x) * Math.max(n.z, 0);

  mesh(hair, mat(C.hair), 0, 0, 0, H);
  // ears

  // eyes + brows

    const eye = new T.Group(); eye.position.set(ex * sx, ey, z - .004); H.add(eye); (J.eyes = J.eyes || []).push(eye);
    mesh(e, mat(C.eye), 0, 0, 0, eye);
    mesh(new T.IcosahedronGeometry(.008, 0), basic(0xffffff), .01, .012, .014, eye);
    const b = mesh(new T.BoxGeometry(.11, .02, .025), mat(C.brow), ex * sx, .108, surf(ex * sx, .108) + .03, H);
    b.rotation.z = (expr === 'pensive' ? .1 : -.05) * sx; b.rotation.y = -.28 * sx;

    [0, .07, 0], [-.045, -.075, .0], [0, -.065, .07], [0, .07, 0], [0, -.065, .07], [.045, -.075, 0],

  const mu = new T.BoxGeometry(.12, .01, .014, 4, 1, 1); deform(mu, v => { v.z -= v.x * v.x * 2.4; v.y -= Math.abs(v.x) * .14; });
  mesh(mu, mat(C.mous), 0, -.145, mz + .002, H);
  if (expr === 'smile') {
    const sh = new T.Shape(); sh.moveTo(-.105, .012); sh.quadraticCurveTo(0, -.012, .105, .012); sh.quadraticCurveTo(.075, -.075, 0, -.078); sh.quadraticCurveTo(-.075, -.075, -.105, .012);

    const th = new T.Shape(); th.moveTo(-.095, .006); th.quadraticCurveTo(0, -.016, .095, .006); th.quadraticCurveTo(.06, -.03, 0, -.034); th.quadraticCurveTo(-.06, -.03, -.095, .006);
    const tg2 = new T.ShapeGeometry(th, 8); deform(tg2, v => { v.z -= v.x * v.x * 2.6; });

  } else {
    const mg = new T.BoxGeometry(.1, .014, .02, 4, 1, 1); deform(mg, v => { v.z -= v.x * v.x * 2.4; v.y += v.x * v.x * .5; });
    mesh(mg, mat(0x5e2e26), 0, -.205, surf(0, -.205) + .002, H);
  }
  // glasses: thin rectangular frames, dark top rim, light lower rim, a touch oversized
  const G = new T.Group(); H.add(G); J.glasses = G;
  const gz = surf(0, .02) + .03;
  const lens = new T.MeshPhongMaterial({ color: 0xe8f0f6, transparent: true, opacity: .14, shininess: 80, specular: 0xffffff, depthWrite: false });
  [-1, 1].forEach(sx => {
    const L = new T.Group(); L.position.set(.148 * sx, .02, gz - .018); L.rotation.y = .2 * sx; G.add(L);
    const w = .19, h = .12;
    mesh(new T.BoxGeometry(w + .012, .026, .024), dark, 0, h / 2, 0, L);

    mesh(new T.BoxGeometry(.01, h, .014), mat(C.low), w / 2, 0, 0, L);
    mesh(new T.BoxGeometry(.01, h, .014), mat(C.low), -w / 2, 0, 0, L);
    mesh(new T.PlaneGeometry(w, h), lens, 0, 0, 0, L);
    const tmp = mesh(new T.BoxGeometry(.012, .016, .4), dark, sx * (w / 2 + .006), h / 2 - .008, -.2, L); tmp.rotation.y = -.16 * sx;

  // pose helpers

}
// standard poses
function poseStand(m) {
  m.set({ shL: [0, 0, .1], shR: [0, 0, -.1], elL: [-.12], elR: [-.12], hipL: [0], hipR: [0], knL: [0], knR: [0], spine: [0], neck: [0], head: [0] });
}
function poseWalk(m, t) {
  const s = Math.sin(t), c = Math.cos(t);
  m.set({
    hipL: [-s * .45], hipR: [s * .45], knL: [Math.max(0, c) * .85 + .08], knR: [Math.max(0, -c) * .85 + .08],
    anL: [-.05], anR: [-.05],
    shL: [s * .38, 0, .1], shR: [-s * .38, 0, -.1], elL: [-.3 - Math.max(0, s) * .3], elR: [-.3 - Math.max(0, -s) * .3],
    spine: [.05, -s * .07, 0], neck: [0, s * .05, 0], head: [.02, 0, 0]
  });
  m.J.hips.position.y = 2.65 - .07 + Math.abs(s) * .07;
}
// two-bone IK for an arm: shoulder -> elbow -> fist at target, elbow bent toward pole
function ik2(m, s, target, pole) {
  m.root.updateMatrixWorld(true);
  const S = new T.Vector3().setFromMatrixPosition(m.J['sh' + s].matrixWorld);
  const sc = m.root.getWorldScale(new T.Vector3()).x, a = 1.0 * sc, b = .99 * sc;
  const u = target.clone().sub(S); const d = Math.min(u.length(), (a + b) * .999); u.normalize();
  const cosA = (a * a + d * d - b * b) / (2 * a * d), sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
  const v = pole.clone().sub(S); v.sub(u.clone().multiplyScalar(v.dot(u))).normalize();
  const E = S.clone().add(u.clone().multiplyScalar(a * cosA)).add(v.multiplyScalar(a * sinA));
  m.aim(m.J['sh' + s], E); m.root.updateMatrixWorld(true);
  m.aim(m.J['el' + s], S.clone().add(u.multiplyScalar(d))); m.root.updateMatrixWorld(true);
}
// seated facing +z, the window on his right (-x); right elbow on the sill, chin on his right fist, gaze out of the window
function poseChin(m, o = {}) {
  m.set({ hipL: [-1.52, 0, .06], hipR: [-1.5, 0, -.04], knL: [1.5], knR: [1.45], anL: [.05], anR: [0],
    spine: [o.lean ?? .42, 0, o.side ?? .1], neck: [.22, 0, 0], head: [o.nod ?? .02, o.look ?? -.8, o.tilt ?? .12],
    shL: [-.45, 0, .2], elL: [-1.0, 0, 0], wrL: [0, 0, 0], wrR: [0, 0, 0] });
  m.root.updateMatrixWorld(true);
  const chin = new T.Vector3(0, -.46, .22); m.J.face.localToWorld(chin);
  const fwd = new T.Vector3(0, 0, .12).applyQuaternion(m.J.spine.getWorldQuaternion(new T.Quaternion())); chin.add(fwd);
  const pole = new T.Vector3(o.poleX ?? -1.6, -1.5, o.poleZ ?? .3); m.J.spine.localToWorld(pole);
  m.J.wrR.rotation.set(-.2, 0, 0);
  ik2(m, 'R', chin, pole);
  if (0 && window.DEBUGIK) { const w = new T.Vector3().setFromMatrixPosition(m.J.wrR.matrixWorld), e = new T.Vector3().setFromMatrixPosition(m.J.elR.matrixWorld), sh = new T.Vector3().setFromMatrixPosition(m.J.shR.matrixWorld); console.warn('IK', [chin, w, e, sh].map(v => v.toArray().map(n => n.toFixed(2)).join(',')).join(' | ')); }
  m.J.wrR.rotation.set(-.2, 0, 0);
  // settle the fist exactly under the chin: re-aim twice with the measured gap
  for (let it = 0; it < 3; it++) {
    m.root.updateMatrixWorld(true);
    const sc = m.root.getWorldScale(new T.Vector3()).x;
    const fist = new T.Vector3(0, -.07, .01); m.J.wrR.localToWorld(fist);
    const chinW = new T.Vector3(0, -.5, .14); m.J.face.localToWorld(chinW);
    const want = chinW.clone().add(new T.Vector3(0, -.13 * sc, 0)).add(new T.Vector3(0, 0, .04 * sc).applyQuaternion(m.J.spine.getWorldQuaternion(new T.Quaternion())));
    const S0 = new T.Vector3().setFromMatrixPosition(m.J.shR.matrixWorld);
    if (window.DEBUGIK) console.warn('it', it, 'gap', want.distanceTo(fist).toFixed(3), 'reach', (S0.distanceTo(want) / sc).toFixed(3));
    chin.add(want.sub(fist));
    ik2(m, 'R', chin, pole);
  }
}

// tiny life: blink + breathing (call each frame)
function mohitLife(m, t, base) {
  const b = (t % 4.3) < .12 ? .12 : 1; m.J.eyes.forEach(e => e.scale.y = b);
  m.J.spine.position.y = Math.sin(t * 1.6) * .012;
}

const q = new URLSearchParams(location.search), view = q.get('v') || 'sheet';
const R = new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight); R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
function rig(scene) {
  scene.add(new T.HemisphereLight(0xfff4e6, 0x9db2c4, .75));
  const k = new T.DirectionalLight(0xffe2c2, .75); k.position.set(4, 9, 7); k.castShadow = true; k.shadow.mapSize.set(1024, 1024);
  Object.assign(k.shadow.camera, { left: -5, right: 5, top: 8, bottom: -2 }); scene.add(k);
  const r = new T.DirectionalLight(0xc9d8ff, .35); r.position.set(-6, 4, -5); scene.add(r);
  const fl = mesh(new T.CircleGeometry(4, 10).rotateX(-Math.PI / 2), mat(0xe2d8c4), 0, 0, 0, scene); fl.receiveShadow = true;
}
const views = [];
function addView(build, cam, look, rect) { const s = new T.Scene(); s.background = new T.Color(0xefe8da); rig(s); const m = build(s); const c = new T.PerspectiveCamera(cam[3] || 30, 1, .1, 100); c.position.set(cam[0], cam[1], cam[2]); c.lookAt(...look); views.push({ s, c, rect, m }); }
const A = s => { const m = makeMohit({ expression: 'smile' }); poseStand(m); s.add(m.root); return m; };
const B = s => { const m = makeMohit({ expression: 'smile' }); poseStand(m); m.set({ spine: [0, .35, 0], neck: [0, .4, 0], head: [-.05, .55, -.08] }); s.add(m.root); return m; };
const Cc = s => { const m = makeMohit({ expression: 'pensive' }); m.root.position.y = -1.2; s.add(m.root); poseChin(m);
  mesh(new T.BoxGeometry(1.5, .4, 1.3), mat(0x4f6f96), 0, .9, -.05, s); mesh(new T.BoxGeometry(1.5, 2, .3), mat(0x4f6f96), 0, 1.9, -.75, s);
  mesh(new T.BoxGeometry(.5, .12, 2.2), mat(0xd9d4cc), -1.05, 2.45, .2, s); return m; };
const W = s => { const m = makeMohit({ expression: 'smile' }); s.add(m.root); return m; };
if (view === 'sheet') {
  addView(A, [5, 4.6, 14], [0, 3.2, 0], [0, 0, .25, 1]);
  addView(A, [14, 4.6, 0], [0, 3.2, 0], [.25, 0, .25, 1]);
  addView(B, [-6, 5, -13], [0, 3.4, 0], [.5, 0, .25, 1]);
  addView(Cc, [7, 4.4, 9], [0, 3, 0], [.75, 0, .25, 1]);
} else if (view === 'face') {
  addView(A, [1.0, 4.95, 3.0], [0, 4.85, 0], [0, 0, .5, 1]);
  addView(B, [-1.4, 5.0, -3.2], [0, 4.85, 0], [.5, 0, .5, 1]);
} else if (view === 'chin') {
  addView(Cc, [-3.2, 3.5, 1.8], [0, 3.2, .3], [0, 0, .5, 1]);
  addView(Cc, [-1.5, 3.8, 5.6], [0, 3.1, 0], [.5, 0, .5, 1]);
} else if (view === 'walk') {
  [0, 1.6, 3.2, 4.7].forEach((t, i) => addView(s => { const m = W(s); poseWalk(m, t); return m; }, [12, 4, 4], [0, 3, 0], [i / 4, 0, .25, 1]));
}
R.setScissorTest(true);
function frame() {
  const w = innerWidth, h = innerHeight;
  views.forEach(v => { const [x, y, ww, hh] = v.rect; R.setViewport(x * w, y * h, ww * w, hh * h); R.setScissor(x * w, y * h, ww * w, hh * h); v.c.aspect = ww * w / (hh * h); v.c.updateProjectionMatrix(); R.render(v.s, v.c); });

frame();
