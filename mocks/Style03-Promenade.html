  // a few clouds over the bay
  for (let i = 0; i < 7; i++) {
    const c = new T.Group(); for (let k = 0; k < 3; k++) { const g = jitter(new T.IcosahedronGeometry(9 + k * 3, 0), 3); g.scale(1.7, .38, 1); mesh(g, mat(0xffffff, { emissive: 0x5d6d78 }), k * 13 - 13, k === 1 ? 3 : 0, 0, c); }
    c.position.set(-260 + i * 90, 70 + (i % 3) * 16, -360 - (i % 2) * 40); scene.add(c);
  }

  // ---------- Mohit on the parapet, facing the sea ----------
  const mo = makeMohit({ expression: 'smile' });
  mo.root.scale.setScalar(.3); mo.root.rotation.y = Math.PI;
  mo.root.position.set(2.4, .84 - .7, -.05); scene.add(mo.root);
  function seatPose(turn) {
    mo.set({ hipL: [-1.5, 0, .08], hipR: [-1.45, 0, -.08], knL: [1.35], knR: [1.15], anL: [.1], anR: [.05],
      spine: [-.05, -.4 * turn, 0], neck: [0, -.38 * turn, 0], head: [-.04 + .04 * turn, -.12 - 1.05 * turn, .08 * turn],
      shL: [.12, 0, .34], elL: [-.15], wrL: [0], shR: [.12, 0, -.34], elR: [-.15], wrR: [0] });
  }
  seatPose(0);
  const moShirt = []; mo.root.traverse(o => { if (o.isMesh && o.material.map) moShirt.push(o); });

  // spray at the tetrapods
  const spray = []; const sprM = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8 });
  for (let i = 0; i < 40; i++) { const s = mesh(new T.IcosahedronGeometry(.04 + hash3(i, 1, 9) * .06, 0), sprM.clone(), 0, -9, 0, scene); s.userData = { ph: hash3(i, 2, 9) * 6, x: -12 + hash3(i, 3, 9) * 30, z: -3.6 - hash3(i, 4, 9) * 1.2 }; spray.push(s); }

  // ---------- camera ----------
  const MX = 2.4;
  const keysW = [
    [0, [-7, 5.6, 10], [4, .2, -26], 40],
    [.55, [1.0, 2.2, 4.4], [4.2, 1.35, -10], 36],
    [1, [4.0, 1.62, 1.75], [2.05, 1.32, -1.3], 34],
  ];
  const keysT = [
    [0, [-3, 5.8, 11], [3, .2, -26], 58],
    [.55, [1.4, 2.4, 5.4], [2.4, 1.3, -10], 52],
    [1, [3.4, 1.75, 2.6], [1.85, 1.38, -1.0], 46],
  ];
  const aside = document.getElementById('aside');
  S.frames.push((p, t) => {
    const tall = S.w / S.h < .9, k = camKeys(tall ? keysT : keysW, p);
    cam.position.set(...k.pos); cam.lookAt(...k.tgt); cam.fov = k.fov;
    const shift = tall ? 0 : .16 * S.w * smooth(.3, 1, p);
    if (shift) cam.setViewOffset(S.w, S.h, -shift, 0, S.w, S.h); else cam.clearViewOffset();
    cam.updateProjectionMatrix();
    const turn = smooth(.35, .9, p);
    seatPose(turn);
    // wind in his shirt + breathing
    mo.J.spine.rotation.z = Math.sin(t * 1.3) * .015; mo.J.shL.rotation.x += Math.sin(t * 1.1) * .01;
    mohitLife(mo, t);
    aside.classList.toggle('on', p > .78);
    seaTick(t);
    spray.forEach(s => { const u = ((t * .45 + s.userData.ph) % 3) / 3; const b = Math.sin(Math.min(1, u * 1.6) * Math.PI); s.position.set(s.userData.x + u * .6, -2.4 + b * 1.6, s.userData.z + u * .4); s.material.opacity = b * .75; s.visible = b > .02; });
    lamps.forEach((l, i) => l.group.rotation.z = 0);
  });
})();
</script>
</body>
