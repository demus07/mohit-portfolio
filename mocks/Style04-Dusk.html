<style>
:root{--paper:#f1ead9;--paper2:#e9e0cb;--ink:#1d1a16;--ink2:#5b544a;--ink3:#8c8478;--acc:#e2782a;--acc-soft:#f2c38d}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:50;mix-blend-mode:multiply;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 -1.3 .78'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:300px}
.serif{font-family:"Newsreader",Georgia,serif}
h1,h2{font-family:"Newsreader",Georgia,serif;font-weight:400;letter-spacing:-.018em;line-height:.98;text-wrap:balance;font-optical-sizing:auto}
p{text-wrap:pretty}
a{color:inherit}
.ilink{text-decoration:none;background:linear-gradient(var(--acc),var(--acc)) 0 100%/100% 2px no-repeat;padding-bottom:.12em;transition:background-size .45s cubic-bezier(.2,.7,.2,1),color .3s}
.ilink:hover,.ilink:focus-visible{background-size:100% .5em}
.cta{display:inline-flex;align-items:baseline;gap:.45em;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:1.45rem;text-decoration:none;color:var(--ink);position:relative;padding-bottom:.2em}
.cta svg{position:absolute;left:-2%;bottom:-.25em;width:104%;height:.7em;overflow:visible}
.cta svg path{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:0;transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
.cta:hover svg path,.cta:focus-visible svg path{animation:redraw .8s cubic-bezier(.2,.7,.2,1)}
.cta .arr{display:inline-block;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.cta:hover .arr,.cta:focus-visible .arr{transform:translateX(6px)}
@keyframes redraw{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.dusk{position:relative;height:820vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.copy{position:absolute;z-index:3;left:clamp(24px,5.4vw,96px);top:clamp(28px,9vh,96px);width:min(30rem,38vw)}
h2{font-size:clamp(2.6rem,4.6vw,4.8rem);font-weight:300}
.stops{position:relative;margin-top:1.6rem;min-height:11rem}
.stop{position:absolute;left:0;top:0;width:100%;opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.stop.on{opacity:1;transform:none}
.stop .where{font-size:1rem;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:.6rem}
.stop .where::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--acc)}
.stop p{margin-top:.55rem;font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:clamp(1.25rem,1.6vw,1.55rem);line-height:1.3;max-width:24rem}
.trail{display:flex;gap:.45rem;margin-top:.2rem}
.trail i{display:block;width:22px;height:2px;background:var(--ink3);opacity:.5;transition:background .6s,opacity .6s}
.trail i.on{background:var(--acc);opacity:1}
.roles{width:min(1320px,100% - 2*clamp(22px,5.4vw,96px));margin:0 auto;padding:clamp(70px,14vh,140px) 0 clamp(80px,16vh,160px);display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(28px,4vw,72px)}
.roles .lead{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(1.5rem,2.2vw,2.1rem);line-height:1.2;max-width:16rem;position:sticky;top:12vh;align-self:start}
.role{position:relative;padding:1.4rem 0 1.5rem;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:1.5rem}
.role svg.rule{position:absolute;left:0;top:0;width:100%;height:8px;overflow:visible}
.role svg.rule path{fill:none;stroke:#1d1a16;stroke-width:1.2;opacity:.5}
.role .co{font-family:"Newsreader",Georgia,serif;font-size:clamp(1.6rem,2.3vw,2.2rem);font-weight:300;line-height:1.1}
.role .ti{font-size:1.02rem;color:var(--ink2);margin-top:.3rem}
.role .when{font-size:1rem;color:var(--ink2);white-space:nowrap;padding-top:.5rem}
.role ul{grid-column:1/-1;list-style:none;margin-top:1rem;display:grid;gap:.7rem;max-width:38rem}
.role li{font-size:1.04rem;line-height:1.5;padding-left:1.3rem;position:relative}
.role li::before{content:"";position:absolute;left:0;top:.72em;width:.65rem;height:1.5px;background:var(--acc)}
@media (max-width:720px){
  .copy{left:22px;right:22px;top:24px;width:auto}
  h2{font-size:clamp(2.1rem,9.6vw,2.6rem)}
  .stops{margin-top:1rem;min-height:10rem}
  #scene{top:auto;bottom:0;height:52%}
  .roles{grid-template-columns:1fr}
  .roles .lead{position:static}
  .role{grid-template-columns:1fr}
  .role .when{padding-top:.3rem}
}
</style>

const NS='http://www.w3.org/2000/svg';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const f1=n=>Math.round(n*10)/10;
/* a hand-drawn segment: slight bow in the middle */
function wob(x1,y1,x2,y2,r,j=1){const mx=(x1+x2)/2+(r()-.5)*j*2,my=(y1+y2)/2+(r()-.5)*j*2;return`M${f1(x1)},${f1(y1)}Q${f1(mx)},${f1(my)} ${f1(x2)},${f1(y2)}`}
/* parallel hatching inside a clip */
let _hid=0;
function hatch(parent,o){const{box:[x,y,w,h],angle=45,gap=6,width=1,color='#1d1a16',op=1,seed=1,jit=.8,trim=0,clipPath,clipRect}=o;const r=rng(seed);
  const g=el('g',{},parent);
  let cid=o.clip;
  if(!cid){cid='hc'+(++_hid);const defs=parent.ownerSVGElement?parent.ownerSVGElement.querySelector('defs'):parent.querySelector('defs');const cp=el('clipPath',{id:cid},defs);if(clipPath)el('path',{d:clipPath},cp);else el('rect',{x,y,width:w,height:h,rx:o.rx||0},cp)}
  g.setAttribute('clip-path',`url(#${cid})`);
  const a=angle*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx,cx=x+w/2,cy=y+h/2,L=Math.hypot(w,h)/2+4;
  let d='';for(let t=-L;t<=L;t+=gap*(.85+r()*.3)){const ox=cx+nx*t,oy=cy+ny*t;const l1=L*(1-trim*r()),l2=L*(1-trim*r());d+=wob(ox-dx*l1,oy-dy*l1,ox+dx*l2,oy+dy*l2,r,jit)}
  el('path',{d,fill:'none',stroke:color,'stroke-width':width,opacity:op,'stroke-linecap':'round'},g);return g}
function cross(parent,o){hatch(parent,o);return hatch(parent,Object.assign({},o,{angle:(o.angle||45)+90,seed:(o.seed||1)+7,clip:o._clip}))}
function P(parent,d,o={}){return el('path',Object.assign({d,fill:'none',stroke:'#1d1a16','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'},o),parent)}
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t)};
function progressOf(sec){const r=sec.getBoundingClientRect();return clamp(-r.top/(r.height-innerHeight))}

const $=id=>document.getElementById(id);const INK='#1d1a16',GREY='#8c8478';
const STOPS=[['Ramrao Adik, 2021','My first real code was a blog that tracked patch notes for games I played. It got taken down over copyright. First lesson in building.'],
['NFTs','The worst call I\'ve made. I listened to the hype instead of the people calling it out.'],
['Everything else','Blogging, Google Ads and SEO, Meta Ads, an agency, dropshipping. For about a year I stopped coding and turned into a finance guy.'],
['MK Exim, 2025','One person led hundreds across warehouse, finance, e-commerce and media, and walked me through how it all connected. The biggest room for growth was in tech.'],
['Graduated, 2025','Computer Engineering, 9.45 CGPA. Grades taught me less than shipping did.'],
['Sypha AI, 2025','So I came back to engineering for good. An LLM gateway, an AI CLI 500+ developers use, and days of finance work turned into one upload.'],
['AuctionXI, 2026','My own product, and the thing I\'m proudest of. It taught me what code alone can\'t: getting users, keeping them, taking the friction out of every step.']];
const ROLES=[['Sypha AI','Software Engineer','Dec 2025 – now',['Built Sypha Gateway. It replaced OpenRouter across every Sypha product and cut its 5% markup.','Built an AI CLI that 500+ developers use daily, across 20+ providers and self-hosted models.','Turned trackers, MIS reports and PDFs into a 21-sheet P&L workbook. Days of reconciliation, one upload.','Unblocked a Kotlin plugin stuck in production for two months by tracing 21 cascading issues.']],
['AuctionXI','Founder','Apr 2026 – now'],['TexAgent','Freelance developer','Sep 2026 – now'],['MK Exim India','E-commerce, Amazon, TataCliQ and Sephora','Mar – Sep 2025'],['Brahmani Gems','Web developer intern, Shopify','Jul – Aug 2024']];
/* copy */
const stopsEl=$('stops');
STOPS.forEach(([w,l])=>{const d=document.createElement('div');d.className='stop';d.innerHTML=`<div class="where">${w}</div><p>${l}</p>`;stopsEl.appendChild(d)});
const tr=document.createElement('div');tr.className='trail';tr.style.position='absolute';tr.style.bottom='-1.6rem';tr.innerHTML=STOPS.map(()=>'<i></i>').join('');stopsEl.appendChild(tr);
$('roleList').innerHTML=ROLES.map(([c,t,w,b],i)=>`<div class="role"><svg class="rule" viewBox="0 0 800 8" preserveAspectRatio="none"><path d="${wob(0,4,800,4,rng(i+9),2.6)}"/></svg><div><div class="co">${c}</div><div class="ti">${t}</div></div><div class="when">${w}</div>${b?`<ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`).join('');

/* night arriving: layers of hatching that fade in one after another */
const darkLayers=[];
(()=>{const g=$('dark');[[2,6.5,.9,1,1.6],[40,6,.8,2,1.2],[-46,5.4,.75,3,1.2]].forEach(([a,gap,w,s,j])=>{const l=el('g',{opacity:0},g);hatch(l,{box:[-20,-20,1480,544],angle:a,gap,width:w,seed:s,op:.42,color:'#2b2722',jit:j*3});darkLayers.push(l)})})();
/* far shore: the Necklace across the bay, Malabar Hill; its lights come on */
const farLights=[];
(()=>{const g=$('far'),r=rng(4);
  P(g,'M-20,520H1460',{'stroke-width':1.5});
  P(g,'M760,520C800,500 850,482 920,476C990,470 1040,478 1090,492C1130,504 1160,514 1190,520',{stroke:GREY,'stroke-width':1.2});
  hatch(g,{clipPath:'M760,520C800,500 850,482 920,476C990,470 1040,478 1090,492C1130,504 1160,514 1190,520Z',box:[760,470,430,50],angle:70,gap:3.5,width:.8,color:GREY,seed:5});
  let x=200;while(x<1400){const w=8+r()*14,h=6+r()*16+(x>760&&x<1190?18:0);P(g,`M${f1(x)},520V${f1(520-h)}H${f1(x+w)}V520`,{stroke:GREY,'stroke-width':.9});x+=w+1+r()*4}
  for(let k=0;k<70;k++){const t=k/69,lx=200+t*1200,ly=518-Math.sin(t*3.1)*2;const c=el('circle',{cx:f1(lx),cy:f1(ly),r:1.6,fill:'#e2782a',opacity:0},g);farLights.push([c,t])}
})();
/* sea between the far shore and the wall */
(()=>{const g=$('sea'),r=rng(7);for(let y=524;y<642;){const t=(y-520)/122;for(let x=-40;x<2900;){const l=16+t*70+r()*40;P(g,wob(x,y,x+l,y+r()*1.5,r,.6),{'stroke-width':.6+t*.9,opacity:.4+t*.4});x+=l+12+r()*30}y+=3+t*8+r()*2}})();
/* the wall and lamps, laid out along a long walk */
const STEP=640,FIRST=1240,LAMPS=[];
const WORLD=FIRST+6*STEP+520;
(()=>{const g=$('wall');
  el('rect',{x:-200,y:640,width:WORLD+2000,height:70,fill:'#f1ead9'},g);
  P(g,`M-200,640H${WORLD+1800}`,{'stroke-width':2.4});P(g,`M-200,650H${WORLD+1800}`,{'stroke-width':1});
  hatch(g,{box:[-200,651,WORLD+2000,52],angle:-8,gap:3.6,width:.9,seed:18,op:.7});
  P(g,`M-200,704H${WORLD+1800}`,{'stroke-width':2});
  for(let x=-200;x<WORLD+1800;x+=118)P(g,`M${x},640V704`,{'stroke-width':.9});
  const L=$('lamps');
  for(let k=0;k<7;k++){const x=FIRST+k*STEP,lg=el('g',{},L);
    const lit=el('g',{opacity:0},lg);
    el('path',{d:`M${x+40},300L${x-60},706L${x+160},706Z`,fill:'url(#cone)'},lit);
    el('circle',{cx:x+40,cy:296,r:120,fill:'url(#lampGlow)'},lit);
    el('ellipse',{cx:x+40,cy:790,rx:190,ry:40,fill:'url(#pool)'},lit);
    P(lg,`M${x},704V300Q${x},270 ${x+30},272L${x+46},276`,{'stroke-width':3.2});
    P(lg,`M${x-8},704h16M${x-5},690h10`,{'stroke-width':2.4});
    const head=el('path',{d:`M${x+26},272h30q6,0 6,6v4h-42v-4q0,-6 6,-6Z`,fill:'#f1ead9',stroke:INK,'stroke-width':2},lg);
    LAMPS.push({x,lit,head,lg});}
})();
/* promenade paving, scrolls with the world */
(()=>{const g=$('pave');el('rect',{x:-20,y:704,width:1480,height:220,fill:'none'},g);
  const lines=el('g',{id:'paveLines'},g);for(let x=-400;x<2000;x+=96)P(lines,`M${x},706L${x-(x-720)*.9-40},920`,{'stroke-width':.8,opacity:.4});
  for(let y=730;y<920;y+=y*.04)P(g,`M-20,${f1(y)}H1460`,{'stroke-width':.8,opacity:.45});})();
/* Mohit walking: head is the same drawing, mirrored to face the way he walks */
const WK={};
(()=>{const g=$('walker');const fig=el('g',{},g);WK.fig=fig;
  const arm=(parent,near)=>{const a=el('g',{},parent);const up=el('g',{},a);
    el('path',{d:'M-8,0C-8,-6 8,-6 8,0L7,46H-7Z',fill:near?'#f8f4ec':'#e9e2d3',stroke:INK,'stroke-width':1.8,'stroke-linejoin':'round'},up);
    el('path',{d:'M-8,0C-8,-6 8,-6 8,0L7,46H-7Z',fill:'url(#pinstripe)'},up);
    const fo=el('g',{transform:'translate(0,46)'},up);
    el('path',{d:'M-5.5,0H5.5L4.5,38H-4.5Z',fill:near?'#e4c6a2':'#cfae8a',stroke:INK,'stroke-width':1.6,'stroke-linejoin':'round'},fo);
    el('path',{d:'M-7.5,-6H7.5L7,5H-7Z',fill:'#fbf8f1',stroke:INK,'stroke-width':1.6},fo);
    el('ellipse',{cx:0,cy:44,rx:5.5,ry:7.5,fill:near?'#e4c6a2':'#cfae8a',stroke:INK,'stroke-width':1.5},fo);
    return{a,up,fo}};
  const leg=(parent,near)=>{const l=el('g',{},parent);const fill=near?'#3a352e':'#24201b';
    el('path',{d:'M-11,0H11L8,78H-8Z',fill,stroke:INK,'stroke-width':1.6,'stroke-linejoin':'round'},l);
    const sh=el('g',{transform:'translate(0,76)'},l);
    el('path',{d:'M-8,0H8L6.5,70H-6.5Z',fill,stroke:INK,'stroke-width':1.6,'stroke-linejoin':'round'},sh);
    el('path',{d:'M-7,66L-8,77Q-8,80 -4,80H17Q21,80 20,75Q18,70 8,68Z',fill:'#1d1a16'},sh);
    return{l,sh}};
  WK.armF=arm(fig,false);WK.legF=leg(fig,false);
  // torso
  const t=el('g',{},fig);
  el('path',{d:'M-8,-96C4,-100 14,-98 18,-90C23,-78 22,-58 20,-38C19,-22 20,-10 22,2L-18,4C-19,-14 -20,-36 -19,-56C-19,-74 -18,-90 -8,-96Z',fill:'#f8f4ec',stroke:INK,'stroke-width':2,'stroke-linejoin':'round'},t);
  el('path',{d:'M-8,-96C4,-100 14,-98 18,-90C23,-78 22,-58 20,-38C19,-22 20,-10 22,2L-18,4C-19,-14 -20,-36 -19,-56C-19,-74 -18,-90 -8,-96Z',fill:'url(#pinstripe)'},t);
  P(t,'M4,-98L10,-88L15,-97',{'stroke-width':1.6,fill:'#fbf8f1'});
  P(t,'M14,-86C16,-60 16,-30 18,0',{'stroke-width':1,opacity:.6});
  hatch(t,{clipPath:'M-8,-96C-18,-90 -19,-74 -19,-56C-20,-36 -19,-14 -18,4L-6,4L-6,-96Z',box:[-20,-100,16,106],angle:70,gap:3,width:.8,seed:61,op:.6});
  WK.legN=leg(fig,true);
  const head=el('use',{href:'#m-head-pensive',width:400,height:400,transform:'translate(48,-158) scale(-.19,.19)'},fig);
  WK.armN=arm(fig,true);
  WK.armN.a.setAttribute('transform','translate(0,-88)');WK.armF.a.setAttribute('transform','translate(-2,-88)');
})();
function pose(ph){const s=Math.sin(ph),c=Math.cos(ph);
  const th=24*s,kn=a=>Math.max(0,a)*38;
  WK.legN.l.setAttribute('transform',`translate(2,0) rotate(${f1(-th)})`);WK.legN.sh.setAttribute('transform',`translate(0,76) rotate(${f1(kn(Math.sin(ph-1.3)))})`);
  WK.legF.l.setAttribute('transform',`translate(-2,0) rotate(${f1(th)})`);WK.legF.sh.setAttribute('transform',`translate(0,76) rotate(${f1(kn(Math.sin(ph+Math.PI-1.3)))})`);
  WK.armN.up.setAttribute('transform',`rotate(${f1(18*s)})`);WK.armN.fo.setAttribute('transform',`translate(0,46) rotate(${f1(-10-8*Math.max(0,s))})`);
  WK.armF.up.setAttribute('transform',`rotate(${f1(-18*s)})`);WK.armF.fo.setAttribute('transform',`translate(0,46) rotate(${f1(-10-8*Math.max(0,-s))})`);
  WK.fig.setAttribute('transform',`translate(${WX},${f1(668-Math.abs(c)*3)}) scale(1.08)`)}
const WX=860;
/* scroll */
const world=$('world'),sea=$('sea'),pl=$('paveLines'),svg=$('scene'),stopEls=[...stopsEl.querySelectorAll('.stop')],trail=[...tr.children],after=$('afterglow');
let mobile=false;function layout(){mobile=innerWidth<720;if(mobile)svg.setAttribute('viewBox','540 230 640 720');else svg.setAttribute('viewBox','0 0 1440 900');last=-1}
let last=-1,cur=-1;
layout();addEventListener('resize',layout);
function frame(){const p=RM?1:progressOf($('dusk'));if(Math.abs(p-last)>1e-5){last=p;
  const X=p*(FIRST+6*STEP-WX+260);
  world.setAttribute('transform',`translate(${f1(-X)},0)`);sea.setAttribute('transform',`translate(${f1(-X*.32)},0)`);
  pl.setAttribute('transform',`translate(${f1(-(X%96))},0)`);
  pose(X/150*Math.PI);
  let k=-1;LAMPS.forEach((L,i)=>{const d=WX-(L.x-X);const on=smooth(-60,40,d);L.lit.setAttribute('opacity',on.toFixed(3));L.head.setAttribute('fill',on>.5?'#f2b06a':'#f1ead9');const sx=L.x-X;L.lg.setAttribute('opacity',(mobile?1:smooth(560,760,sx)).toFixed(3));if(d>-80)k=i});
  k=Math.max(0,k);if(k!==cur){cur=k;stopEls.forEach((s,i)=>s.classList.toggle('on',i===k));trail.forEach((t,i)=>t.classList.toggle('on',i<=k))}
  darkLayers.forEach((l,i)=>l.setAttribute('opacity',smooth(.06+i*.26,.34+i*.26,p).toFixed(3)));
  after.setAttribute('opacity',(.5*(1-smooth(.1,.7,p))).toFixed(3));
  farLights.forEach(([c,t])=>c.setAttribute('opacity',smooth(.1+t*.6,.16+t*.6,p).toFixed(2)));
 }requestAnimationFrame(frame)}
frame();
