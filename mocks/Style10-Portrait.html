<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#efe8da;display:flex;gap:20px;padding:20px}svg.p{width:680px;height:850px;background:#e6dccb}</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <linearGradient id="m10-skinlight" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d59f76"/><stop offset=".55" stop-color="#be875f"/><stop offset="1" stop-color="#a06a47"/>
  </linearGradient>
  <linearGradient id="m10-hairsheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a3142"/><stop offset=".5" stop-color="#121419"/><stop offset="1" stop-color="#0b0c10"/>
  </linearGradient>
  <!-- pinstripes are lines of type: his name, set tiny in lavender -->
  <pattern id="m10-pin" width="96" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
    <rect width="96" height="9" fill="#f7f4f8"/><text x="0" y="4" font-size="4.6" textLength="96" lengthAdjust="spacingAndGlyphs" fill="#a996cf" font-family="Hanken Grotesk, sans-serif" font-weight="600">mohit bagri · mohit bagri · mohit bagri ·</text>
  </pattern>
  <pattern id="m10-pinV" width="9" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
    <rect width="9" height="96" fill="#f7f4f8"/><text transform="translate(4,0) rotate(90)" x="0" y="0" font-size="4.6" textLength="96" lengthAdjust="spacingAndGlyphs" fill="#a996cf" font-family="Hanken Grotesk, sans-serif" font-weight="600">mohit bagri · mohit bagri · mohit bagri ·</text>
  </pattern>

  <!-- HEAD: three-quarter, facing left. Shared by both expressions. viewBox space ~ x 110..320, y 80..350 -->

    <!-- neck -->
    <path d="M186,318 C188,336 188,352 186,372 L296,378 C284,350 274,326 268,292 Z" fill="#a06a47"/>
    <path d="M190,330 C214,344 246,340 266,318 L268,300 C246,322 214,330 190,330Z" fill="#7f5236" opacity=".55"/>
    <!-- ear -->
    <path d="M254,236 C262,222 284,222 286,242 C288,262 278,284 262,288 C256,289 252,282 252,272 Z" fill="#b57d56"/>
    <path d="M262,246 C268,236 278,240 276,254 C275,266 268,274 262,276" fill="none" stroke="#7a4d33" stroke-width="2.4" stroke-linecap="round"/>

    <path d="M160,168 C152,182 148,198 147,214 C148,224 151,230 149,238 C143,248 134,256 129,264 C127,269 131,273 139,274 C141,279 140,284 138,288 C140,292 142,294 140,299 C142,305 146,309 147,315 C146,322 150,330 160,335 C176,343 204,342 226,334 C244,326 254,310 258,290 L256,240 C254,214 246,192 232,178 C210,162 180,160 160,168 Z" fill="url(#m10-skinlight)"/>

    <path d="M139,281 C148,277 160,277 172,283 C162,284 150,285 140,286 Z" fill="#3b2a24" opacity=".55"/>

    <path d="M168,194 C182,185 204,183 224,188 C227,190 226,193 222,193 C204,190 186,192 170,199 Z" fill="#14161b"/>
    <path d="M138,203 C143,198 150,196 156,197 L155,201 C150,201 145,203 140,206Z" fill="#14161b" opacity=".9"/>
  </g>

    <path d="M156,186 C147,172 144,154 149,138 C153,124 162,112 176,105 C186,100 196,98 208,98 C214,92 224,89 234,91 C242,93 248,96 254,95 C264,91 276,92 284,98 C298,106 310,120 318,140 C326,160 324,186 316,208 C310,224 302,240 296,256 L282,258 C282,242 278,230 270,224 C264,220 258,221 254,227 C252,212 246,198 236,188 C222,182 200,180 182,184 C172,186 164,189 156,186 Z" fill="url(#m10-hairsheen)"/>

    <path d="M244,198 C250,214 252,232 252,248 C248,240 244,226 240,214Z" fill="#1b1c20" opacity=".8"/>
  </g>

  <!-- GLASSES: thin rectangular, dark top rim, light grey lower rim, slightly oversized -->
  <g id="m10-glasses">
    <!-- near lens -->
    <path d="M168,207 L226,203 C230,203 232,206 232,210 L230,236 C229,242 225,245 219,245 L178,247 C172,247 168,244 167,238 L166,212 C166,209 166,207 168,207 Z" fill="#dfe8ef" fill-opacity=".14" stroke="#c7cdd3" stroke-width="2.2"/>

    <path d="M206,210 L220,209" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>

    <path d="M153,212 C157,209 162,209 166,211" fill="none" stroke="#141820" stroke-width="2.6" stroke-linecap="round"/>

    <path d="M231,208 L262,226" stroke="#141820" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  </g>

  <g id="m10-mouth-pensive">

    <path d="M142,299 C149,302 156,302 162,300" fill="none" stroke="#8a5638" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
  </g>
  <g id="m10-mouth-smile">
    <path d="M138,289 C152,290 170,290 188,284 C184,300 168,312 152,311 C144,310 140,302 138,289 Z" fill="#5a2a20"/>

    <path d="M150,306 C158,307 166,305 172,302" fill="none" stroke="#b46a5a" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M186,280 C192,284 194,290 192,296" fill="none" stroke="#7a4d33" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- ASSEMBLED HEADS -->
  <g id="m10-headP">
    <use href="#m10-head-base"/><use href="#m10-eyes-pensive"/><use href="#m10-mouth-pensive"/><use href="#m10-hair"/><use href="#m10-glasses"/>
  </g>
  <g id="m10-headS">
    <use href="#m10-head-base"/><use href="#m10-eyes-smile"/><use href="#m10-mouth-smile"/><use href="#m10-hair"/><use href="#m10-glasses"/>
  </g>

  <!-- POSE A: at the window, chin on fist, pondering. viewBox 20 50 480 600 -->
  <symbol id="m10-pensive" viewBox="20 50 480 600">
    <!-- torso: broad shoulders, near shoulder to the right -->
    <path d="M60,650 C62,560 84,470 132,420 C156,396 190,376 220,370 L296,372 C350,380 410,402 446,440 C478,474 494,560 498,650 Z" fill="url(#m10-pinV)"/>
    <path d="M330,380 C392,396 440,424 462,470 C482,514 492,580 496,650 L420,650 C418,560 400,470 330,380Z" fill="#cfc6dc" opacity=".55"/>
    <path d="M384,470 C392,540 396,600 396,650" fill="none" stroke="#c4b9d8" stroke-width="2"/>
    <!-- open collar -->
    <path d="M190,372 C204,392 222,406 242,414 L250,382 C232,380 208,376 190,372Z" fill="#a06a47"/>
    <path d="M184,366 C190,394 210,418 240,430 L232,452 C200,438 178,410 172,376Z" fill="#fbf9fb"/>

    <path d="M78,650 C82,624 88,604 96,590 L204,584 C206,604 208,628 210,650 Z" fill="url(#m10-pinV)"/>
    <path d="M178,588 C190,610 198,630 200,650 L210,650 C208,628 206,604 204,584Z" fill="#cfc6dc" opacity=".7"/>
    <path d="M104,566 C110,520 124,462 146,410 C150,402 156,398 162,398 L192,396 C198,398 200,404 199,412 C194,460 192,520 194,566 Z" fill="#a8714c"/>
    <path d="M176,404 C186,404 194,406 198,412 C194,460 192,520 194,566 L178,566 C176,516 176,456 176,404Z" fill="#8a5a3b" opacity=".6"/>
    <path d="M110,560 C116,512 128,462 148,414" fill="none" stroke="#d29d74" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M150,404 C160,409 182,409 196,404" fill="none" stroke="#7f5236" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>

    <path d="M92,560 C120,546 176,544 206,554" fill="none" stroke="#fbf9fb" stroke-width="4" stroke-linecap="round"/>
    <path d="M91,579 C120,567 176,565 207,574" fill="none" stroke="#b6a8cf" stroke-width="1.8"/>
    <path d="M90,598 C122,584 178,582 208,592" fill="none" stroke="#9c8fb4" stroke-width="2"/>

    <path d="M152,404 C142,388 138,368 142,352 C146,338 160,330 178,330 C196,330 210,338 213,352 C216,368 210,388 198,402 C184,408 164,408 152,404 Z" fill="#b57d56"/>

      <path d="M140,340 C140,333 146,330 156,331 L168,333 C171,337 170,343 166,345 L148,346 C143,346 140,344 140,340Z"/>
      <path d="M136,354 C136,347 142,345 152,346 L164,347 C168,351 167,357 163,359 L144,360 C139,360 136,358 136,354Z"/>

      <path d="M138,381 C138,375 144,373 152,374 L160,375 C163,379 162,384 158,386 L146,387 C141,387 138,385 138,381Z"/>
    </g>
    <path d="M168,334 C186,330 202,334 210,344" fill="none" stroke="#d6a27a" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
    <path d="M182,338 C192,336 202,340 206,348 C200,350 190,350 182,346 Z" fill="#c48d65"/>

  <!-- POSE B: from behind, turning to smile over his shoulder (after the portrait). viewBox 20 50 480 600 -->

    <path d="M142,422 C150,500 148,580 150,650" fill="none" stroke="#bdb0d6" stroke-width="2"/>

    <path d="M150,440 C230,458 340,454 420,424" fill="none" stroke="#c9bedd" stroke-width="2"/>

    <!-- collar around the back of the neck -->

    <path d="M196,362 C232,364 270,356 298,344" fill="none" stroke="#b6a8cf" stroke-width="1.6"/>
  </symbol>
</defs>
</svg>

<svg class="p" viewBox="0 0 480 600"><use href="#m10-pensive" width="480" height="600"/></svg>
