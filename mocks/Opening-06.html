<style>

.track{height:460vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--navy)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bokeh{position:absolute;inset:0;pointer-events:none;opacity:0}
.bokeh i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(242,161,69,.55),rgba(242,161,69,.18) 62%,rgba(242,161,69,0));will-change:transform}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.16;mix-blend-mode:overlay}
.copy{position:absolute;z-index:4;left:clamp(24px,5.6vw,104px);top:clamp(32px,10vh,108px);width:min(31rem,38vw)}
h1{font-family:Newsreader,serif;font-weight:300;font-size:clamp(52px,6.6vw,112px);line-height:.92;letter-spacing:-.02em;margin:0 0 .38em}
.line{font-size:clamp(16px,1.2vw,19px);line-height:1.55;max-width:40ch;margin:0 0 1.5em;color:rgba(239,232,218,.82)}
.cta{font-size:clamp(16px,1.2vw,19px);color:var(--sodium);text-decoration:none;display:inline-flex;gap:.5em;align-items:baseline;padding-bottom:3px;background:linear-gradient(currentColor,currentColor) 0 100%/0% 1px no-repeat;transition:background-size .5s cubic-bezier(.2,.7,.2,1)}
.cta span{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.cta:hover{background-size:100% 1px}.cta:hover span{transform:translateX(6px)}
.note{font-family:Newsreader,serif;font-style:italic;font-weight:300;font-size:clamp(22px,1.9vw,30px);line-height:1.3;max-width:19ch;margin:2.2em 0 0;opacity:0;transform:translateY(14px);color:var(--paper)}
.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:14px;color:rgba(239,232,218,.55);transition:opacity .6s}
.after{height:40vh;background:var(--navy)}
@media (max-width:700px){
  .copy{left:20px;right:20px;top:26px;width:auto}
  h1{font-size:48px}
  .line{font-size:16px;margin-bottom:1em}
  .note{font-size:20px;margin-top:1em;max-width:24ch}
}
@media (prefers-reduced-motion:reduce){.cta span{transition:none}}
</style>
</head>

<script>
(() => {
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = document.getElementById('world'), track = document.getElementById('track');
  const wipe = document.getElementById('wipe'), note = document.getElementById('note'), hint = document.getElementById('hint');
  const bokeh = document.getElementById('bokeh');
  const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const seg = (p,a,b)=>clamp((p-a)/(b-a));

  // condensation mist dots + glass drops
  const NS='http://www.w3.org/2000/svg', mist=document.getElementById('mist'), dropsG=document.getElementById('drops');
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  for(let i=0;i<170;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',700+rnd()*182);c.setAttribute('cy',332+rnd()*108);c.setAttribute('r',.25+rnd()*.7);mist.appendChild(c);}
  const drops=[];
  for(let i=0;i<34;i++){
    const g=document.createElementNS(NS,'g'); const r=.7+rnd()*1.9;
    g.innerHTML=`<circle r="${r}" fill="#0c1823" opacity=".35"/><circle r="${r*.8}" cy="${-r*.15}" fill="none" stroke="#e9eef2" stroke-opacity=".55" stroke-width="${r*.28}"/><circle r="${r*.25}" cx="${-r*.35}" cy="${-r*.4}" fill="#fff" opacity=".85"/>`;
    const run = rnd()<.22;
    const d={g,x:700+rnd()*182,y:332+rnd()*108,v:run?(6+rnd()*14):0,trail:null};
    if(run){const t=document.createElementNS(NS,'path');t.setAttribute('stroke','#dfe7ec');t.setAttribute('stroke-opacity','.18');t.setAttribute('stroke-width',r*.9);t.setAttribute('fill','none');dropsG.appendChild(t);d.trail=t;}
    dropsG.appendChild(g); drops.push(d);
  }
  // bokeh
  const bk=[[.78,.18,240],[.9,.62,320],[.62,.9,200],[.98,.3,160],[.7,.5,120]].map(([x,y,s])=>{const i=document.createElement('i');i.style.cssText=`left:${x*100}%;top:${y*100}%;width:${s}px;height:${s}px;margin:${-s/2}px`;bokeh.appendChild(i);return i;});

  // cameras: focus point in world, view width, where focus sits on screen
  const CAM = {
    wide:  {x:720,y:420,w:1440,fx:.5,fy:.47},
    close: {x:792,y:388,w:300,fx:.66,fy:.56},
    wideP: {x:790,y:420,w:820,fx:.5,fy:.58},
    closeP:{x:790,y:388,w:236,fx:.5,fy:.7}
  };
  function camera(t){
    const ph = innerWidth<700, A=ph?CAM.wideP:CAM.wide, B=ph?CAM.closeP:CAM.close;
    const w=Math.exp(lerp(Math.log(A.w),Math.log(B.w),t)), h=w*innerHeight/innerWidth;
    const x=lerp(A.x,B.x,t), y=lerp(A.y,B.y,t), fx=lerp(A.fx,B.fx,t), fy=lerp(A.fy,B.fy,t);
    return [x-fx*w, y-fy*h, w, h];
  }

  // rain canvas
  const cv=document.getElementById('rain'), cx=cv.getContext('2d'); let W=0,H=0,dpr=1, streaks=[];
  function size(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/5200); streaks=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,l:10+Math.random()*30,v:.9+Math.random()*1.4,z:Math.random()}));}
  size(); addEventListener('resize',size);

  let sp=null, last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    const r=track.getBoundingClientRect(), p=clamp(-r.top/(r.height-innerHeight));
    sp = sp===null||rm ? p : sp+(p-sp)*Math.min(1,dt*7);
    const z=ease(seg(sp,.04,.55));
    svg.setAttribute('viewBox',camera(z).map(v=>v.toFixed(2)).join(' '));
    wipe.setAttribute('stroke-dashoffset',(1-ease(seg(sp,.55,.86))).toFixed(4));
    const n=seg(sp,.84,.97); note.style.opacity=n; note.style.transform=`translateY(${(1-n)*14}px)`;
    hint.style.opacity = sp>.02?0:1;
    bokeh.style.opacity = .25+z*.75;
    bk.forEach((b,i)=>{b.style.transform=`translate(${Math.sin(now/4000+i)*14}px,${Math.cos(now/5200+i*2)*10}px) scale(${.7+z*.6})`;});
    // glass drops: some run, leaving a trail; wrap off the bottom edge
    drops.forEach(d=>{
      if(d.v && !rm){d.y+=d.v*dt*(.6+Math.sin(now/300+d.x)*.4); if(d.y>446){d.y=326;}
        d.trail.setAttribute('d',`M${d.x.toFixed(1)},${Math.max(332,d.y-22).toFixed(1)} L${d.x.toFixed(1)},${d.y.toFixed(1)}`);}
      d.g.setAttribute('transform',`translate(${d.x.toFixed(1)} ${d.y.toFixed(1)})`);
    });
    // rain: falls in front, thins as we press to the glass
    cx.clearRect(0,0,W,H);
    const dens=1-z*.55;
    cx.lineCap='round';
    for(let i=0;i<streaks.length;i++){const s=streaks[i]; if(i/streaks.length>dens) break;
      if(!rm){s.y+=s.v*(700+s.z*900)*dt; s.x-=s.v*90*dt; if(s.y>H+40){s.y=-40;s.x=Math.random()*W*1.1;} if(s.x<-20)s.x+=W;}
      const warm = s.x>W*.55 ? .5 : .15;
      cx.strokeStyle=`rgba(${Math.round(lerp(190,242,warm))},${Math.round(lerp(205,190,warm))},${Math.round(lerp(220,150,warm))},${.08+s.z*.22})`;
      cx.lineWidth=.6+s.z*1.1;
      cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x+s.l*.12,s.y-s.l);cx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
