<style>

    animation:g 1.4s steps(4) infinite}
  @keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-2%,3%)}50%{transform:translate(3%,-1%)}75%{transform:translate(-1%,-2%)}}
  .copy{position:absolute;z-index:4;left:clamp(24px,5.4vw,92px);top:clamp(36px,11vh,120px);width:min(25rem,33vw)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-variation-settings:"opsz" 144;font-size:clamp(3rem,6vw,6rem);line-height:.92;letter-spacing:-.025em;color:#16303d;text-wrap:balance}

  .line{font-size:clamp(1rem,1.15vw,1.12rem);line-height:1.55;color:#2f4652;max-width:21rem}
  .note{position:absolute;inset:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(1.3rem,1.7vw,1.65rem);line-height:1.3;color:#16303d;opacity:0}
  .cta{display:inline-flex;gap:.5em;font-size:1.05rem;font-weight:500;color:#2c6d8c;text-decoration:none;padding-bottom:3px;
    background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s cubic-bezier(.2,.7,.2,1),color .3s}
  .cta span{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .cta:hover,.cta:focus-visible{background-size:100% 1px;color:#16303d}
  .cta:hover span,.cta:focus-visible span{transform:translateX(5px)}
  @media (max-width:720px){
    .copy{left:20px;right:20px;top:26px;width:auto}
    h1{font-size:clamp(2.6rem,12.5vw,3.4rem)}
    .slot{margin-top:1rem;min-height:6.6em}
    .cam{transform-origin:50% 62%}
  }
  @media (prefers-reduced-motion:reduce){.grain{animation:none}}
</style>
</head>

<script>
(() => {
  const sec = document.getElementById("intro");
  const layers = [...document.querySelectorAll(".layer")];
  const blurL = document.getElementById("blurL"), tint = document.getElementById("tint"), refl = document.getElementById("refl");
  const reflMove = document.getElementById("reflMove"), glint = document.getElementById("glint"), clouds = document.getElementById("rclouds");
  const cam = document.getElementById("cam"), line = document.getElementById("line"), note = document.getElementById("note");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  let target = 0, cur = 0, lastVB = "";
  const read = () => { const r = sec.getBoundingClientRect(); target = clamp(-r.top / (r.height - innerHeight), 0, 1); };
  const fit = () => {
    const a = innerWidth / innerHeight;
    // phones: frame the window, leave painted body above for the text
    const vb = a < .9 ? `${970 - 620 * a} -440 ${1240 * a} 1240` : "0 0 1440 900";
    if (vb !== lastVB) { layers.forEach(l => l.setAttribute("viewBox", vb)); lastVB = vb; }
  };
  addEventListener("scroll", read, { passive: true }); addEventListener("resize", () => { read(); fit(); });
  read(); fit(); cur = target;
  function frame(t) {
    cur += (target - cur) * (reduce ? 1 : .085);
    const p = cur, s = t / 1000;
    const r = ease(seg(p, .1, .78));
    // the reflection slides off along the glass and thins; tint lifts; focus resolves
    reflMove.setAttribute("transform", `translate(${(-r * 520).toFixed(1)} 0)`);
    refl.style.opacity = (0.8 - r * .74).toFixed(3);
    tint.style.opacity = (0.5 - r * .42).toFixed(3);
    blurL.style.opacity = (1 - ease(seg(p, .25, .82))).toFixed(3);
    cam.style.transform = `scale(${(1 + ease(seg(p, .05, .9)) * .07).toFixed(4)})`;
    const a = seg(p, .3, .48), b = seg(p, .6, .8);
    line.style.opacity = 1 - a; line.style.transform = `translateY(${-a * 12}px)`;
    note.style.opacity = b; note.style.transform = `translateY(${(1 - b) * 12}px)`;
    if (!reduce) {
